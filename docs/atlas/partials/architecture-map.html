  <g data-go="data-model" aria-label="PostgreSQL: open the page on the data model and tenant isolation">

    <text class="d-title" x="17" y="277">PostgreSQL</text>
    <text class="d-sub" x="112" y="277">row-level security on every tenant table · one transaction per decision</text>
    <text class="d-mono" x="17" y="300">runs · run_events · tasks · timers · signal_waits · approvals · trigger_receipts · audit_log · secrets</text>
    <text class="d-mono" x="17" y="322">dispatch: taskiem_claim_tasks · _claim_due_timers · _claim_runs_to_orchestrate · _recover_expired_leases</text>
  </g>

  <g data-go="ai" aria-label="AI models: open the page on the AI layer"><rect class="d-box" x="256" y="520" width="232" height="62" rx="7"/><text class="d-title" x="270" y="545">AI models</text><text class="d-sub" x="270" y="564">ai steps · builder · self-repair</text></g>
  <g data-go="business-modules" aria-label="Xenibase: open the page on business modules"><rect class="d-box" x="511" y="520" width="232" height="62" rx="7"/><text class="d-title" x="525" y="545">Xenibase</text><text class="d-sub" x="525" y="564">data tables · files · kept copies</text></g>

</svg>
