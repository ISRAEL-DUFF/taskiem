openapi: 3.1.0
info:
  title: Payrolla Connect API
  version: "2026-11-01"
  summary: Read and prepare a company's payroll, receive its events, and embed Payrolla screens.
  description: |
    The Connect API is for software a Payrolla company has connected: an app the
    company uses (such as Taskiem), or the company's own product. The company owner
    issues a key in Payrolla → Settings → Connected apps and chooses its scopes.

    **The key alone never approves or pays.** With the write scopes a connected app
    prepares payroll: it adds and changes employees, makes and adjusts runs. With
    `payroll:approve` it approves, locks and pays as a person linked to a Payrolla
    user — and anything that commits money takes a one-time code Payrolla sends to
    that user's own factor. Locking a run commits its payment: Payrolla pays it on
    the pay date.

    ## Writes
    Every write (`employees:write`, `payroll:write`) needs two headers:
    - `Idempotency-Key`: a value unique to this change. Retrying with the same value
      returns the first answer (marked `Idempotent-Replayed: true`) for 24 hours;
      sending a different request under a used value is refused
      (`IDEMPOTENCY_KEY_REUSED`). Server errors (5xx) aren't kept, so they can be
      retried with the same value.
    - `X-Acting-User`: your id for the person who did it, with `X-Acting-User-Name`.
      Payrolla records both beside the change in its own history.

    A change through the API sends the same events as the same change made in
    Payrolla. A change to an existing employee's bank account is held until an
    approver confirms it with a code.

    ## Authentication
    Send the key as a bearer token: `Authorization: Bearer pyk_live_…`. A key belongs
    to exactly one company; every call reads or writes that company only. Never put a
    key in a browser, a mobile app, an email, a chat or a ticket.

    An app Payrolla has registered can instead connect in one step with OAuth 2.0
    and use its access token the same way: `Authorization: Bearer pyt_…`.

    ## Connecting with OAuth 2.0
    For apps Payrolla has registered (you get a `client_id`, and a `client_secret`
    for a server-side app). The authorization-code grant with PKCE (`S256`) is the
    only grant; PKCE is required for every client.

    1. Send the owner's browser to `https://payroller.surge.sh/oauth/authorize` with
       `response_type=code`, `client_id`, `redirect_uri` (exactly as registered),
       `scope` (space-separated, within what your app is registered for), `state`,
       `code_challenge` and `code_challenge_method=S256`. Optional sign-up hints for a
       business that isn't on Payrolla yet: `company_name`, `rc_number`, `email`.
    2. The owner signs in — or signs up — sees your app's name and the scopes, and
       allows it with their Payrolla code. Only a company owner can connect an app.
    3. Payrolla sends the browser to `redirect_uri?code=…&state=…`, or
       `?error=access_denied&state=…` if they said no. Check `state`.
    4. Within 10 minutes, swap the code (once):
       `POST {server}/oauth/token` (form-encoded; client credentials by HTTP Basic or
       in the body) with `grant_type=authorization_code`, `code`, `redirect_uri` and
       `code_verifier`. The answer is RFC 6749 JSON (not enveloped):
       `access_token` (`pyt_…`, 1 hour), `refresh_token` (`pyr_…`, 90 days),
       `token_type: Bearer`, `expires_in`, `scope`, `company_id`, `company_name`.
    5. Refresh with `grant_type=refresh_token`. Each refresh token works once and
       is replaced; using an old one again ends the whole connection's token chain
       (`invalid_grant`), so store the new one before using the new access token.
       Likewise, sending a code a second time cancels the tokens it already gave.
    6. To disconnect, `POST {server}/oauth/revoke` with a current `token=`. The
       connection ends and its webhooks stop after a final `company.disconnected`.
       A token that no longer works (expired, cancelled, or a used refresh token)
       is ignored, so it can't end a connection you've since reconnected.

    One company has one connection per app: connecting again replaces its scopes
    with what the owner allowed this time. The owner sees the connection under
    Settings → Connected apps and can revoke it there; you'll get
    `company.disconnected` with `reason: revoked_by_owner`. Token-endpoint errors
    are `{"error", "error_description"}`: `invalid_client`, `invalid_grant`,
    `unsupported_grant_type`, `invalid_request`.

    ## Responses
    Every response is JSON in an envelope: `{"data": …}` on success, or
    `{"error": {"code", "message", "details"}}` on failure. Branch on `error.code`;
    messages may change.

    | Status | Codes |
    |---|---|
    | 401 | `API_KEY_REQUIRED`, `API_KEY_INVALID` (unknown or revoked) |
    | 403 | `SCOPE_REQUIRED`, and the route-specific codes listed per operation |
    | 404 | `RUN_NOT_FOUND`, `PAYSLIP_NOT_FOUND`, `NOT_FOUND`, … |
    | 429 | `RATE_LIMITED`, with `Retry-After` in seconds |

    ## Rate limit
    120 requests per minute per key.

    ## Lists
    Listings return `next_cursor`. Pass it back as `cursor` to get the next page; an
    empty string means there are no more. Cursors are opaque.

    ## Money and time
    Amounts are integers in kobo (₦1 = 100 kobo). Dates are `YYYY-MM-DD`; times are
    RFC 3339 in UTC.

    ## Events
    The `webhooks` section lists every event type and its body. Signing, retries and
    replay are in `docs/api/webhooks.md`.
servers:
  # Replaced with this deployment's address when served from /connect/openapi.yaml.
  - url: https://synledger.name.ng/payrolla/api/v1
    description: This Payrolla deployment. Keys from one environment never work in another.
security:
  - companyKey: []
tags:
  - name: Company
  - name: Payroll
  - name: Employees
  - name: Payslips
  - name: Webhooks
  - name: Events
  - name: Approvals
  - name: Reports
  - name: Embedding

# x-payrolla-scope on each operation is the key scope it needs: a scope name,
# "any" (any valid key) or "none" (public). The contract test checks it.
paths:
  /connect/openapi.yaml:
    get:
      tags: [Company]
      operationId: getSpec
      summary: This document
      security: []
      x-payrolla-scope: none
      responses:
        "200":
          description: The OpenAPI document, as YAML.
          content:
            application/yaml:
              schema: { type: string }

  /connect/company:
    get:
      tags: [Company]
      operationId: getCompany
      summary: The company and the key making the call
      description: Any valid key may call this. Use it to check a key works and see its scopes.
      x-payrolla-scope: any
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CompanyView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /connect/runs:
    get:
      tags: [Payroll]
      operationId: listRuns
      summary: List payroll runs
      description: Newest first.
      x-payrolla-scope: payroll:read
      parameters:
        - name: status
          in: query
          description: Comma-separated run statuses.
          schema: { type: string, examples: ["COMPUTED,APPROVED"] }
        - name: updated_since
          in: query
          description: Only runs changed at or after this time (RFC 3339).
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [runs, next_cursor]
                    properties:
                      runs:
                        type: array
                        items: { $ref: "#/components/schemas/RunSummary" }
                      next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`INVALID_STATUS`: an unknown status was named."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    post:
      tags: [Payroll]
      operationId: createRun
      summary: Make a payroll run for a period, and calculate it
      description: |
        `period` (`2026-11`) for companies paid monthly; otherwise `period_start` and
        `period_end`. `pay_date` defaults to the period's last day. Payrolla
        calculates the run as its own "Run payroll" does, and sends `run.computed`.
        If the calculation fails, the run is still made (as DRAFT) and the answer
        carries `compute_error`: fix the cause and call `/compute`. Retrying the
        same request returns the same run; it never makes a second one.
      x-payrolla-scope: payroll:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, examples: ["2026-11"] }
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
                pay_date: { type: string, format: date }
      responses:
        "201":
          description: Made. `compute_error` is present if it couldn't be calculated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [run]
                    properties:
                      run: { $ref: "#/components/schemas/RunDetail" }
                      compute_error: { $ref: "#/components/schemas/ComputeError" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`DUPLICATE_RUN`: a run for this period already exists."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}:
    get:
      tags: [Payroll]
      operationId: getRun
      summary: One payroll run, with its timeline
      x-payrolla-scope: payroll:read
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [run]
                    properties:
                      run: { $ref: "#/components/schemas/RunDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/runs/{runID}/lines:
    get:
      tags: [Payroll]
      operationId: getRunLines
      summary: Each employee's net pay and payout status in a run
      description: No bank details and no pay breakdown — only the net amount and how its payout went.
      x-payrolla-scope: payroll:read
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [lines]
                    properties:
                      lines:
                        type: array
                        items: { $ref: "#/components/schemas/RunLine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/runs/{runID}/approval-link:
    get:
      tags: [Payroll]
      operationId: getApprovalLink
      summary: Where an approver reviews this run in Payrolla
      description: |
        There is no approve API. Send this link to the approver; it opens the run's
        review in Payrolla after they sign in, and approval still needs their own
        confirmation. The link carries no credential, so it is safe to put in a
        message.
      x-payrolla-scope: payroll:read
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApprovalLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees
      description: Pay is included only for keys that also have `payroll:read`.
      x-payrolla-scope: employees:read
      parameters:
        - name: external_ref
          in: query
          description: Find the employee with your id for them. `external_id` works too.
          schema: { type: string }
        - name: status
          in: query
          description: Comma-separated — ACTIVE, INACTIVE, TERMINATED.
          schema: { type: string }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [employees, next_cursor]
                    properties:
                      employees:
                        type: array
                        items: { $ref: "#/components/schemas/EmployeeRecord" }
                      next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Add an employee
      description: |
        A bank account is checked with the bank first; the bank's own name for the
        account is what is stored and returned (`bank.account_name`). Pay is monthly
        gross, optionally split into basic, housing and transport.
      x-payrolla-scope: employees:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201": { $ref: "#/components/responses/EmployeeOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`PHONE_TAKEN`, `EXTERNAL_REF_TAKEN`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/employees/{employeeID}:
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: One employee
      x-payrolla-scope: employees:read
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
      responses:
        "200": { $ref: "#/components/responses/EmployeeOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Employees]
      operationId: updateEmployee
      summary: Change an employee
      description: |
        Send only what changes. A pay change opens a new pay record from
        `pay.effective_from` (default today). A new bank account doesn't apply at
        once: it is held until an approver other than whoever asked confirms it with
        a code, and comes back as `pending_bank_change` (the current account keeps
        being paid meanwhile). Phone numbers can't be changed through the API yet
        (`PHONE_CHANGE_NOT_AVAILABLE`). `employee.updated` follows, with `changed_fields`.
      x-payrolla-scope: employees:write
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeePatch" }
      responses:
        "200": { $ref: "#/components/responses/EmployeeOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`EXTERNAL_REF_TAKEN`, `SYNCED_FIELD_READ_ONLY`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/employees/{employeeID}/terminate:
    post:
      tags: [Employees]
      operationId: terminateEmployee
      summary: End an employee's employment, now
      description: They're left out of runs calculated from now on. `employee.terminated` follows.
      x-payrolla-scope: employees:write
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      responses:
        "200": { $ref: "#/components/responses/EmployeeOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/employees/{employeeID}/payslips:
    get:
      tags: [Payslips]
      operationId: listEmployeePayslips
      summary: An employee's final payslips, most recent first
      x-payrolla-scope: payslips:read
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [payslips]
                    properties:
                      payslips:
                        type: array
                        items: { $ref: "#/components/schemas/PayslipSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/payslips/{payslipID}:
    get:
      tags: [Payslips]
      operationId: getPayslip
      summary: A payslip's contents, to show in your own screens
      description: Final payslips only (their run is locked); before that, read the run's lines.
      x-payrolla-scope: payslips:read
      parameters:
        - name: payslipID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [payslip]
                    properties:
                      payslip: { $ref: "#/components/schemas/Payslip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`PAYSLIP_NOT_FINAL`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /connect/funding:
    get:
      tags: [Payroll]
      operationId: getFunding
      summary: What the company pays salaries from, and its balance
      x-payrolla-scope: payroll:read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [funding]
                    properties:
                      funding: { $ref: "#/components/schemas/Funding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: "`BALANCE_UNAVAILABLE`: the wallet provider didn't answer."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /connect/runs/{runID}/compute:
    post:
      tags: [Payroll]
      operationId: computeRun
      summary: Recalculate a run that isn't approved yet
      x-payrolla-scope: payroll:write
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      responses:
        "200": { $ref: "#/components/responses/RunOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /connect/runs/{runID}/cancel:
    post:
      tags: [Payroll]
      operationId: cancelRun
      summary: Cancel a run that isn't approved yet
      description: An approved run can be cancelled only in Payrolla, by a person.
      x-payrolla-scope: payroll:write
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      responses:
        "200": { $ref: "#/components/responses/RunOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /connect/runs/{runID}/adjustments:
    get:
      tags: [Payroll]
      operationId: listAdjustments
      summary: A run's bonuses and deductions
      x-payrolla-scope: payroll:read
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [adjustments]
                    properties:
                      adjustments:
                        type: array
                        items: { $ref: "#/components/schemas/Adjustment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/runs/{runID}/lines/{employeeID}/adjustments:
    post:
      tags: [Payroll]
      operationId: addAdjustment
      summary: Add a bonus or deduction for one employee in a run
      description: |
        The amount is gross; tax and pension apply as usual. The run is recalculated
        at once; the answer carries the run and its lines, and `run.adjusted` then
        `run.computed` follow. Only runs that aren't approved can be adjusted.
      x-payrolla-scope: payroll:write
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/EmployeeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount_kobo, reason]
              properties:
                type: { type: string, enum: [BONUS, DEDUCTION] }
                amount_kobo: { type: integer, minimum: 1 }
                reason: { type: string }
      responses:
        "201": { $ref: "#/components/responses/AdjustedOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/adjustments/{adjustmentID}:
    delete:
      tags: [Payroll]
      operationId: removeAdjustment
      summary: Remove a bonus or deduction, and recalculate
      x-payrolla-scope: payroll:write
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: adjustmentID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      responses:
        "200": { $ref: "#/components/responses/AdjustedOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /connect/runs/{runID}/exclusions:
    get:
      tags: [Payroll]
      operationId: listExclusions
      summary: Who is left out of a run, and why
      x-payrolla-scope: payroll:read
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [exclusions]
                    properties:
                      exclusions:
                        type: array
                        items: { $ref: "#/components/schemas/Exclusion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/runs/{runID}/lines/{employeeID}/exclude:
    post:
      tags: [Payroll]
      operationId: excludeFromRun
      summary: Leave an employee out of this run only, and recalculate
      description: "`ALREADY_EXCLUDED` (409) if they're already left out."
      x-payrolla-scope: payroll:write
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/EmployeeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "201": { $ref: "#/components/responses/AdjustedOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/exclusions/{exclusionID}:
    delete:
      tags: [Payroll]
      operationId: removeExclusion
      summary: Put an excluded employee back in the run, and recalculate
      x-payrolla-scope: payroll:write
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: exclusionID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      responses:
        "200": { $ref: "#/components/responses/AdjustedOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /connect/approvers:
    get:
      tags: [Approvals]
      operationId: listApprovers
      summary: Who may approve or pay, and whom your people are linked to
      description: |
        Everyone in the company who may approve, lock or pay payroll, whether they
        can receive a confirmation code, and — when one of your people has been
        linked to them — that person's id (`linked_as`).
      x-payrolla-scope: payroll:approve
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [approvers]
                    properties:
                      approvers:
                        type: array
                        items: { $ref: "#/components/schemas/Approver" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /connect/approvers/{userID}/link:
    post:
      tags: [Approvals]
      operationId: startLink
      summary: Link the acting person (X-Acting-User) to a Payrolla user
      description: |
        Payrolla sends that user a code on their own factor ("link your Payrolla
        account to …"). They enter it in your app, and you confirm it with
        `/link/confirm`. Only that user can complete the link.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      responses:
        "202": { $ref: "#/components/responses/ChallengeOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`ALREADY_LINKED`: the acting person is linked to someone else."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    delete:
      tags: [Approvals]
      operationId: unlink
      summary: Remove a user's link to your app
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, properties: { unlinked: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/approvers/{userID}/link/confirm:
    post:
      tags: [Approvals]
      operationId: confirmLink
      summary: Confirm a link with the code the user received
      description: |
        The acting person becomes linked to the user, and can act as them —
        always with a fresh code for anything that commits money.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeInput" }
      responses:
        "200": { $ref: "#/components/responses/ApproverOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/confirmations:
    post:
      tags: [Approvals]
      operationId: startRunConfirmation
      summary: Send the linked person a code for one action on a run
      description: |
        `action` is `approve`, `lock`, `pay_now` or `retry_failed`. The acting person
        must be linked. With separation of duties on, whoever prepared a run through
        the API can't approve it (`SOD_VIOLATION`). `pay_now` is refused while the
        payment waits for funds (`AWAITING_FUNDS`) or has started (`ALREADY_PAYING`). Payrolla checks the action is possible first (the run's
        state, the person's role), then sends the code to the person's own factor,
        worded with what it confirms — for example "lock November 2026 payroll and
        pay ₦9,200,000 to 48 people on 28 Nov 2026". Codes last 5 minutes, allow 5
        attempts, and work once, for that action on that run.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, lock, pay_now, retry_failed] }
      responses:
        "202": { $ref: "#/components/responses/ChallengeOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/approve:
    post:
      tags: [Approvals]
      operationId: approveRun
      summary: Approve a run, with the linked person's code
      # With separation of duties on, the app person who made the run (with
      # POST /connect/runs) can't approve it as their linked user: SOD_VIOLATION.
      description: |
        Separation of duties holds: someone who prepared a run can't approve it.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeInput" }
      responses:
        "200": { $ref: "#/components/responses/DecisionOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/lock:
    post:
      tags: [Approvals]
      operationId: lockRun
      summary: Lock a run, with the linked person's code — this commits its payment
      description: |
        Payrolla pays the run automatically on its pay date (at once if that date has
        come). If the wallet is short then, it waits and pays on top-up
        (`run.awaiting_funds`). A run Payrolla couldn't pay — someone with no account —
        is refused before it is locked (`NO_PAYOUT_DESTINATION`).
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeInput" }
      responses:
        "200": { $ref: "#/components/responses/DecisionOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/pay-now:
    post:
      tags: [Approvals]
      operationId: payNow
      summary: Pay a locked run now instead of on its pay date
      description: |
        Needs a person who may pay.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeInput" }
      responses:
        "200": { $ref: "#/components/responses/DecisionOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/retry-failed:
    post:
      tags: [Approvals]
      operationId: retryFailed
      summary: Resend a run's failed payments
      description: |
        Each goes to the employee's current account, so a corrected (and approved)
        bank account is used. Returned payments are not resent.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeInput" }
      responses:
        "200": { $ref: "#/components/responses/DecisionOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/reject:
    post:
      tags: [Approvals]
      operationId: rejectRun
      summary: Send a run back, as the linked person
      description: No code — rejecting moves no money — but the acting person must be linked.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/DecisionOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/runs/{runID}/payment:
    get:
      tags: [Payroll]
      operationId: getRunPayment
      summary: What is happening to a run's payment
      x-payrolla-scope: payroll:read
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [payment]
                    properties:
                      payment: { $ref: "#/components/schemas/RunPayment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/bank-changes:
    get:
      tags: [Employees]
      operationId: listBankChanges
      summary: Bank account changes waiting for an approver
      x-payrolla-scope: employees:read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [bank_changes]
                    properties:
                      bank_changes:
                        type: array
                        items: { $ref: "#/components/schemas/BankChange" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /connect/bank-changes/{changeID}/confirmations:
    post:
      tags: [Approvals]
      operationId: startBankChangeConfirmation
      summary: Send the linked approver a code for a held bank change
      description: |
        The approver can't be whoever asked for the change (`SAME_PERSON`) — unless
        they are the company's only owner or approver, when they may, with their code.
        The employee is told when a change is asked for, and again when it applies.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/ChangeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      responses:
        "202": { $ref: "#/components/responses/ChallengeOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /connect/bank-changes/{changeID}/approve:
    post:
      tags: [Approvals]
      operationId: approveBankChange
      summary: Approve a held bank change, with the linked approver's code
      description: |
        The employee is paid into the new account from then on, and is told by SMS
        and email.
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/ChangeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeInput" }
      responses:
        "200": { $ref: "#/components/responses/BankChangeOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /connect/bank-changes/{changeID}/reject:
    post:
      tags: [Approvals]
      operationId: rejectBankChange
      summary: Reject a held bank change; the current account stays
      x-payrolla-scope: payroll:approve
      parameters:
        - $ref: "#/components/parameters/ChangeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/BankChangeOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApprovalForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /connect/settings:
    get:
      tags: [Company]
      operationId: getSettings
      summary: The company's payroll setup (read-only)
      description: |
        Pay frequency, tax state, separation of duties, funding model, and the
        statutory deductions in force. Changing any of it stays in Payrolla.
      x-payrolla-scope: any
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /connect/remittances:
    get:
      tags: [Reports]
      operationId: listRemittances
      summary: Statutory remittance schedules (PAYE, pension, NHF, NHIS)
      x-payrolla-scope: reports:read
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, GENERATED, PAYABLE, FILED, PAID] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [remittances]
                    properties:
                      remittances:
                        type: array
                        items: { $ref: "#/components/schemas/Remittance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /connect/remittances/{remittanceID}:
    get:
      tags: [Reports]
      operationId: getRemittance
      summary: One schedule, with a line per person
      description: |
        Pension schedules carry each person's PFA and pension PIN, which is why
        reports have their own scope. Treat them as you would payslips.
      x-payrolla-scope: reports:read
      parameters:
        - name: remittanceID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [remittance, lines]
                    properties:
                      remittance: { $ref: "#/components/schemas/Remittance" }
                      lines:
                        type: array
                        items: { $ref: "#/components/schemas/RemittanceLine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/employees/{employeeID}/bank-change:
    post:
      tags: [Employees]
      operationId: startEmployeeBankChange
      summary: An employee asks to be paid into a new account
      description: |
        For an employee using your app themselves. Payrolla checks the account with
        the bank and texts **the employee** a code naming the account. Your app never
        sees the code. SMS only, to the phone number on Payrolla (which the API can't
        change); an employee without one gets `EMPLOYEE_UNREACHABLE` and their employer
        changes the account in Payrolla. At most 3 codes per employee in 30 minutes
        (`TOO_MANY_CODES`). Only the app that started a change can confirm it.
      x-payrolla-scope: self_service
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number]
              properties:
                bank_code: { type: string, examples: ["044"] }
                account_number: { type: string, examples: ["2222222222"] }
      responses:
        "202":
          description: The code was sent to the employee.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [challenge]
                    properties:
                      challenge: { $ref: "#/components/schemas/EmployeeChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`EMPLOYEE_NOT_ACTIVE`, `SAME_ACCOUNT`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429":
          description: "`TOO_MANY_CODES`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /connect/employees/{employeeID}/bank-change/confirm:
    post:
      tags: [Employees]
      operationId: confirmEmployeeBankChange
      summary: The employee confirms with their code
      description: |
        Returns the held change. It waits for an approver exactly like any other
        (`requested_via: EMPLOYEE`, and `employee.bank_change_requested`); the
        employee keeps being paid into their current account until it's approved. Codes last 10 minutes,
        allow 5 tries and work once (`CODE_INVALID`, `CODE_EXPIRED`, `CODE_LOCKED`,
        `CODE_USED`).
      x-payrolla-scope: self_service
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActingUser"
        - $ref: "#/components/parameters/ActingUserName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeInput" }
      responses:
        "200": { $ref: "#/components/responses/BankChangeOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/payslips/{payslipID}/link:
    post:
      tags: [Payslips]
      operationId: createPayslipLink
      summary: A link to send an employee to their payslip
      description: |
        The employee confirms the last four digits of their phone before the payslip
        opens. Links last 7 days. Issuing one never cancels the link Payrolla itself
        sent the employee. The company owner must first turn on "Let connected apps
        send payslip links".
      x-payrolla-scope: payslips:links
      parameters:
        - name: payslipID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Created. Treat the URL like a password until it reaches the employee.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PayslipLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`SCOPE_REQUIRED`, or `PAYSLIP_LINKS_DISABLED` until the owner allows it."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`PAYSLIP_NOT_FINAL`: the run is not locked yet."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: "`NO_PHONE_FOR_VERIFICATION`: the employee has no phone to check against."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /connect/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: This key's webhook subscriptions
      x-payrolla-scope: webhooks:manage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [webhooks]
                    properties:
                      webhooks:
                        type: array
                        items: { $ref: "#/components/schemas/WebhookSubscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Subscribe a URL to events
      description: |
        Each event type needs the matching read scope: `employee.*` needs
        `employees:read`, everything else needs `payroll:read`. `"*"` subscribes to
        every type the key's scopes allow, including types added later. The signing
        secret is returned once.
      x-payrolla-scope: webhooks:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, event_types]
              properties:
                url: { type: string, format: uri, description: Must be https. }
                event_types:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/EventTypeOrWildcard" }
      responses:
        "201":
          description: Created
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [webhook, signing_secret]
                    properties:
                      webhook: { $ref: "#/components/schemas/WebhookSubscription" }
                      signing_secret:
                        type: string
                        description: Shown once. Store it with the receiver.
                      note: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`INVALID_WEBHOOK_URL`, `NO_EVENT_TYPES` or `INVALID_EVENT_TYPE`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /connect/webhooks/{webhookID}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Remove a subscription
      x-payrolla-scope: webhooks:manage
      parameters:
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/webhooks/{webhookID}/test:
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a `ping` event to this subscription only
      x-payrolla-scope: webhooks:manage
      parameters:
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      event_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`WEBHOOK_DISABLED`: turn it back on first (the owner can, in Payrolla)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /connect/webhooks/{webhookID}/deliveries:
    get:
      tags: [Webhooks]
      operationId: listDeliveries
      summary: Recent deliveries to this subscription
      x-payrolla-scope: webhooks:manage
      parameters:
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deliveries]
                    properties:
                      deliveries:
                        type: array
                        items: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/webhooks/{webhookID}/deliveries/{deliveryID}/resend:
    post:
      tags: [Webhooks]
      operationId: resendDelivery
      summary: Send a delivery again, with the identical body
      x-payrolla-scope: webhooks:manage
      parameters:
        - $ref: "#/components/parameters/WebhookID"
        - name: deliveryID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      queued: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connect/events:
    get:
      tags: [Events]
      operationId: replayEvents
      summary: Replay events from the last 30 days
      description: |
        Oldest first. Each item is the exact envelope that was (or would have been)
        delivered by webhook, so the same handler can process both. Only types the
        key's scopes allow are returned. `company.disconnected` is never replayed:
        it goes only to the ended connection's own webhooks. Use it to catch up after
        downtime, or poll it instead of receiving webhooks.
      x-payrolla-scope: any
      parameters:
        - name: after
          in: query
          description: An event id; returns events after it. Omit to start 30 days back.
          schema: { type: string, format: uuid }
        - name: types
          in: query
          description: Comma-separated event types.
          schema: { type: string, examples: ["payout.failed,run.completed"] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [events]
                    properties:
                      events:
                        type: array
                        items: { $ref: "#/components/schemas/Event" }
                      next_cursor:
                        type: [string, "null"]
                        format: uuid
                        description: Pass as `after` for the next page; null at the end.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`INVALID_EVENT_TYPE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /connect/embed/launch-token:
    post:
      tags: [Embedding]
      operationId: createLaunchToken
      summary: Mint a short-lived token that opens Payrolla inside your app
      description: |
        Call this from your backend each time you show the embed, and hand the
        `session_token` to the SDK's `getSessionToken`. The owner must have set up
        embedding for this key (allowed origins, modes and screens). See
        `docs/api/embedding.md`.
      x-payrolla-scope: embed:launch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchRequest" }
      responses:
        "200":
          description: OK
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [session_token, expires_at, host_id]
                    properties:
                      session_token: { type: string, description: Single use. Pass it to the SDK. }
                      expires_at: { type: string, format: date-time }
                      host_id: { type: string, description: "Not secret. The SDK's `hostId`." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            `SCOPE_REQUIRED`, `EMBED_NOT_CONFIGURED`, `EMBED_MODE_NOT_ALLOWED`,
            `EMBED_SCREEN_NOT_ALLOWED`, `EMBED_HOST_REVOKED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: "`INVALID_LAUNCH_CONTEXT`, `LAUNCH_USER_REQUIRED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

# One entry per event type, named exactly as the type. The contract test checks
# every event Payrolla emits against its entry here.
webhooks:
  ping:
    post:
      summary: Sent only when you ask for a test.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/PingEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.computed:
    post:
      summary: A run was calculated and is waiting for approval.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunComputedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.approved:
    post:
      summary: An approver approved the run.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunApprovedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.rejected:
    post:
      summary: An approver sent the run back.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunRejectedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.locked:
    post:
      summary: The run was locked; its payslips are final.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.cancelled:
    post:
      summary: The run was cancelled.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.disbursement_started:
    post:
      summary: Payouts were sent to the payment provider.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunDisbursementStartedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.completed:
    post:
      summary: Every payout in the run succeeded.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunSettledEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.partially_completed:
    post:
      summary: The run finished with some payouts failed.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunSettledEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.adjusted:
    post:
      summary: A bonus or deduction was added to a run, or removed.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunAdjustedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.payment_scheduled:
    post:
      summary: A run was locked; its payment is set for the pay date.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunPaymentScheduledEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.awaiting_funds:
    post:
      summary: A payment is due, but the wallet is short. It pays on top-up.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunAwaitingFundsEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  approval.recorded:
    post:
      summary: A person approved, rejected or locked — and where.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRecordedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  employee.bank_change_requested:
    post:
      summary: A new bank account is held for approval.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/BankChangeRequestedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  employee.bank_change_approved:
    post:
      summary: A held bank account change was approved; the employee is paid into it from now on.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/BankChangeDecidedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  employee.bank_change_rejected:
    post:
      summary: A held bank account change was rejected; the current account stays.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/BankChangeDecidedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  run.excluded:
    post:
      summary: Someone was left out of a run, or put back.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunExcludedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  payout.succeeded:
    post:
      summary: One employee was paid.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/PayoutEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  payout.failed:
    post:
      summary: One employee's payout failed; `reason` says why.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/PayoutFailedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  payout.reversed:
    post:
      summary: |
        A payout that had succeeded was returned by the bank; the employee is not
        paid. `run.partially_completed` follows, even after `run.completed`. A payout
        returned before it went through is sent as `payout.failed` instead.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/PayoutEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  employee.created:
    post:
      summary: An employee was added.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeCreatedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  employee.updated:
    post:
      summary: A field you can see changed. Changes to fields you can't see send nothing.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeChangedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  employee.terminated:
    post:
      summary: The employee was terminated.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeChangedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  payslip.issued:
    post:
      summary: A payslip was issued to the employee.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/PayslipIssuedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }
  company.disconnected:
    post:
      summary: |
        This connection ended: the owner revoked it (`revoked_by_owner`) or your app
        did (`revoked_by_app`). Sent only to this connection's own subscriptions, as
        their last delivery; nothing follows it.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/CompanyDisconnectedEvent" } } } }
      responses: { "200": { $ref: "#/components/responses/Received" } }

components:
  securitySchemes:
    companyKey:
      type: http
      scheme: bearer
      bearerFormat: pyk_live_… or pyt_…
      description: A company API key issued by the company owner, or an OAuth access token.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: "`next_cursor` from the previous page."
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    RunID:
      name: runID
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookID:
      name: webhookID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChangeID:
      name: changeID
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeID:
      name: employeeID
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique to this change; reuse it only to retry the same request. Kept for 24 hours.
      schema: { type: string, maxLength: 255 }
    ActingUser:
      name: X-Acting-User
      in: header
      required: true
      description: Your id for the person who made this change.
      schema: { type: string, maxLength: 200 }
    ActingUserName:
      name: X-Acting-User-Name
      in: header
      description: Their name, for Payrolla's history.
      schema: { type: string, maxLength: 200 }

  responses:
    BadRequest:
      description: |
        `INVALID_ID`, `INVALID_CURSOR`, `INVALID_LIMIT`, `INVALID_UPDATED_SINCE`,
        `INVALID_BODY`, and on writes `UNKNOWN_FIELD` (a field this request doesn't
        accept, named in the message), `IDEMPOTENCY_KEY_REQUIRED`, `ACTING_USER_REQUIRED`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: "`API_KEY_REQUIRED` or `API_KEY_INVALID`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: "`SCOPE_REQUIRED`: the key lacks this route's scope."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Validation, including `INVALID_BANK`, `PHONE_CHANGE_NOT_AVAILABLE`, `CODE_REQUIRED`, `NAME_REQUIRED`, `NO_CONTACT_DETAILS`, `INVALID_PERIOD`, `REASON_REQUIRED` and `IDEMPOTENCY_KEY_REUSED`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InvalidState:
      description: "`INVALID_STATE`: the run has moved on (approved, locked or cancelled), so it can't be changed."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ApprovalForbidden:
      description: |
        `SCOPE_REQUIRED`; `APPROVER_NOT_LINKED` (link the acting person first);
        `NOT_AN_APPROVER`, `CANNOT_PAY` (their Payrolla role doesn't allow it);
        `SAME_PERSON` (whoever asked for a bank change can't approve it);
        `PAYMENT_CONFIRMATION_NOT_SET_UP` (their owner adds their phone in Payrolla);
        `CODE_INVALID`, `CODE_EXPIRED`, `CODE_LOCKED`; `SOD_VIOLATION`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ChallengeOK:
      description: A code is on its way (or, with an authenticator, ready to enter)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [challenge]
                properties:
                  challenge: { $ref: "#/components/schemas/Challenge" }
    DecisionOK:
      description: OK — the run, and what is happening to its payment
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [run, payment]
                properties:
                  run: { $ref: "#/components/schemas/RunDetail" }
                  payment: { $ref: "#/components/schemas/RunPayment" }
    ApproverOK:
      description: Linked
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [approver]
                properties:
                  approver: { $ref: "#/components/schemas/Approver" }
    BankChangeOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [bank_change]
                properties:
                  bank_change: { $ref: "#/components/schemas/BankChange" }
    EmployeeOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [employee]
                properties:
                  employee: { $ref: "#/components/schemas/EmployeeRecord" }
    RunOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/RunDetail" }
    AdjustedOK:
      description: The change, and the run as recalculated
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [run, lines]
                properties:
                  adjustment: { $ref: "#/components/schemas/Adjustment" }
                  exclusion: { $ref: "#/components/schemas/Exclusion" }
                  run: { $ref: "#/components/schemas/RunDetail" }
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/RunLine" }
                  compute_error: { $ref: "#/components/schemas/ComputeError" }
    NotFound:
      description: Not found in this company.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Received:
      description: |
        Any 2xx acknowledges the event. 410 Gone switches the subscription off.
        Anything else is retried; `Retry-After` is honoured.

  schemas:
    Approver:
      type: object
      required: [user_id, name, email, role, can_approve, can_pay, can_confirm]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, APPROVER] }
        can_approve: { type: boolean, description: Approve, reject and lock. }
        can_pay: { type: boolean, description: Pay now and retry. }
        can_confirm: { type: boolean, description: Has a factor to receive codes on. }
        linked_as: { type: string, description: Your id for the person linked to them. }
        linked_since: { type: string, format: date-time }

    Challenge:
      type: object
      required: [challenge_id, channel, expires_at]
      properties:
        challenge_id: { type: string, format: uuid }
        channel: { type: string, enum: [TOTP, SMS, EMAIL], description: "TOTP: the code is in their authenticator app; nothing is sent." }
        destination_hint: { type: string, examples: ["•••• 4567"] }
        expires_at: { type: string, format: date-time }

    CodeInput:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, examples: ["482910"] }

    RunPayment:
      type: object
      required: [status, total_kobo, paid, failed, returned, pending]
      properties:
        status:
          type: string
          enum: [NOT_SCHEDULED, SCHEDULED, AWAITING_FUNDS, PAYING, COMPLETED, PARTIALLY_COMPLETED, FAILED]
        scheduled_for: { type: string, format: date }
        total_kobo: { type: integer }
        paid: { type: integer }
        failed: { type: integer }
        returned: { type: integer }
        pending: { type: integer }

    BankChange:
      type: object
      required: [id, employee_id, bank_code, account_name, last4, status, requested_via, requested_at]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        bank_code: { type: string }
        account_name: { type: string, description: The bank's own name for the new account. }
        last4: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, REPLACED] }
        requested_via: { type: string, enum: [PAYROLLA, CONNECT, EMPLOYEE], description: "EMPLOYEE: the employee asked in a connected app and confirmed with their own code." }
        requested_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }

    ComputeError:
      description: The change was saved, but the run couldn't be recalculated. Fix the cause and POST `/connect/runs/{id}/compute`.
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [SCOPE_REQUIRED] }
            message: { type: string }
            details: {}

    Scope:
      type: string
      enum: [payroll:read, employees:read, payslips:links, webhooks:manage, embed:launch, employees:write, payroll:write, payslips:read, payroll:approve, self_service, reports:read]

    CompanyView:
      type: object
      required: [company, key]
      properties:
        company:
          type: object
          required: [id, name, pay_frequency]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            pay_frequency: { type: string, examples: [MONTHLY] }
        key:
          type: object
          required: [id, name, kind, scopes]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { type: string, enum: [CONNECTED_APP, OWN_PRODUCT] }
            scopes:
              type: array
              items: { $ref: "#/components/schemas/Scope" }

    RunStatus:
      type: string
      enum: [DRAFT, COMPUTED, APPROVED, LOCKED, DISBURSING, COMPLETED, PARTIALLY_COMPLETED, CANCELLED, FAILED]

    RunSummary:
      type: object
      additionalProperties: false
      required: [run_id, period_start, period_end, pay_date, run_type, status, employee_count, total_gross_kobo, total_net_kobo]
      properties:
        run_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        pay_date: { type: string, format: date }
        run_type: { type: string, enum: [REGULAR, OFF_CYCLE] }
        status: { $ref: "#/components/schemas/RunStatus" }
        employee_count: { type: integer }
        total_gross_kobo: { type: integer }
        total_net_kobo: { type: integer }

    RunDetail:
      description: A run summary with its timeline.
      type: object
      required: [run_id, period_start, period_end, pay_date, run_type, status, employee_count, total_gross_kobo, total_net_kobo, created_at, updated_at]
      properties:
        run_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        pay_date: { type: string, format: date }
        run_type: { type: string, enum: [REGULAR, OFF_CYCLE] }
        status: { $ref: "#/components/schemas/RunStatus" }
        employee_count: { type: integer }
        total_gross_kobo: { type: integer }
        total_net_kobo: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time }
        locked_at: { type: string, format: date-time }
        approval_url:
          type: string
          format: uri
          description: Present while the run is waiting for approval.

    RunLine:
      type: object
      additionalProperties: false
      required: [payslip_id, employee_id, first_name, last_name, net_kobo, disbursement_status, gross_kobo, total_earnings_kobo, total_deductions_kobo, items]
      properties:
        payslip_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        net_kobo: { type: integer }
        disbursement_status:
          type: string
          description: PENDING, AWAITING_FUNDS, SENT, CONFIRMED, FAILED, PERMANENTLY_FAILED or REVERSED.
        reference: { type: string, description: The payment provider's reference. }
        reason: { type: string, description: Why the payout failed. }
        gross_kobo: { type: integer }
        total_earnings_kobo: { type: integer }
        total_deductions_kobo: { type: integer }
        items:
          type: array
          description: The breakdown — each earning, deduction and employer contribution.
          items: { $ref: "#/components/schemas/LineItem" }

    ApprovalLink:
      type: object
      required: [url, awaiting_approval, status]
      properties:
        url: { type: string, format: uri }
        awaiting_approval: { type: boolean }
        status: { $ref: "#/components/schemas/RunStatus" }

    Employee:
      description: |
        The only employee shape that leaves Payrolla. It never includes account
        numbers, BVN or NIN, tax or pension IDs, or pay.
      type: object
      additionalProperties: false
      required: [id, first_name, last_name, email, phone, department, status, employment_type, start_date, pay_method]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: string }
        department: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, TERMINATED] }
        employment_type: { type: string, enum: [SALARIED, DAILY, COMMISSION] }
        start_date: { type: string, format: date }
        pay_method: { type: string, enum: [WALLET, BANK, NONE] }
        external_ref: { type: string, description: The company's own id for this employee, if set. }

    LineItem:
      type: object
      additionalProperties: false
      required: [category, code, label, amount_kobo]
      properties:
        category:
          type: string
          enum: [EARNING, STATUTORY_DEDUCTION, VOLUNTARY_DEDUCTION, EWA_RECOVERY, LOAN_RECOVERY, EMPLOYER_CONTRIBUTION]
        code: { type: string, examples: [BASIC, PAYE, PENSION_EE] }
        label: { type: string }
        amount_kobo: { type: integer }

    MaskedBank:
      type: object
      required: [bank_code, account_name, last4]
      properties:
        bank_code: { type: string }
        account_name: { type: string, description: The bank's own name for the account. }
        last4: { type: string }

    PayView:
      type: object
      required: [gross_kobo, basic_kobo, housing_kobo, transport_kobo, pensionable, effective_from]
      properties:
        gross_kobo: { type: integer, description: Monthly. }
        basic_kobo: { type: integer }
        housing_kobo: { type: integer }
        transport_kobo: { type: integer }
        pensionable: { type: boolean }
        effective_from: { type: string, format: date-time }

    EmployeeRecord:
      description: |
        An employee as the API reads them: the fields events carry, plus the bank
        account masked and, for keys with `payroll:read`, current pay.
      type: object
      additionalProperties: false
      required: [id, first_name, last_name, email, phone, department, status, employment_type, start_date, pay_method]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: string }
        department: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, TERMINATED] }
        employment_type: { type: string, enum: [SALARIED, DAILY, COMMISSION] }
        start_date: { type: string, format: date }
        pay_method: { type: string, enum: [WALLET, BANK, NONE] }
        external_ref: { type: string }
        bank: { $ref: "#/components/schemas/MaskedBank" }
        pay: { $ref: "#/components/schemas/PayView" }
        pending_bank_change: { $ref: "#/components/schemas/BankChange" }

    PayInput:
      type: object
      required: [gross_kobo]
      properties:
        gross_kobo: { type: integer, minimum: 1, description: Monthly. }
        basic_kobo: { type: integer }
        housing_kobo: { type: integer }
        transport_kobo: { type: integer }
        pensionable: { type: boolean, default: true }
        effective_from: { type: string, format: date, description: On a change; default today. }

    EmployeeInput:
      type: object
      required: [first_name, last_name, start_date]
      description: A phone or an email is required, so the employee can get their payslip.
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string, description: "E.164, e.g. +2348012345678" }
        email: { type: string, format: email }
        employment_type: { type: string, enum: [SALARIED, DAILY, COMMISSION], default: SALARIED }
        start_date: { type: string, format: date }
        department: { type: string }
        cost_center: { type: string }
        external_ref: { type: string, description: Your id for this person, unique in the company. }
        pay: { $ref: "#/components/schemas/PayInput" }
        bank:
          type: object
          required: [bank_code, account_number]
          properties:
            bank_code: { type: string }
            account_number: { type: string }

    EmployeePatch:
      type: object
      description: Only the fields sent change.
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        department: { type: string }
        cost_center: { type: string }
        external_ref: { type: string }
        pay: { $ref: "#/components/schemas/PayInput" }
        bank:
          type: object
          description: A new account. Held until an approver confirms it — see `pending_bank_change`.
          required: [bank_code, account_number]
          properties:
            bank_code: { type: string }
            account_number: { type: string }

    Adjustment:
      type: object
      additionalProperties: false
      required: [id, employee_id, type, amount_kobo, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        type: { type: string, enum: [BONUS, DEDUCTION] }
        amount_kobo: { type: integer }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    Exclusion:
      type: object
      required: [id, employee_id, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    Payslip:
      type: object
      required: [payslip_id, run_id, period_start, period_end, pay_date, employee, employer, gross_kobo, total_earnings_kobo, total_deductions_kobo, net_kobo, items, payment_status]
      properties:
        payslip_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        pay_date: { type: string, format: date }
        employee:
          type: object
          properties:
            id: { type: string, format: uuid }
            first_name: { type: string }
            last_name: { type: string }
            department: { type: string }
            external_ref: { type: string }
        employer:
          type: object
          properties:
            name: { type: string }
            rc_number: { type: string }
        gross_kobo: { type: integer }
        total_earnings_kobo: { type: integer }
        total_deductions_kobo: { type: integer }
        net_kobo: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/LineItem" }
        payment_status: { type: string, description: PENDING, SENT, CONFIRMED, FAILED, REVERSED, … }

    PayslipSummary:
      type: object
      required: [payslip_id, run_id, period, pay_date, gross_kobo, net_kobo, disbursement_status]
      properties:
        payslip_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        period: { type: string, examples: ["2026-11"] }
        pay_date: { type: string, format: date-time }
        gross_kobo: { type: integer }
        net_kobo: { type: integer }
        disbursement_status: { type: string }

    Funding:
      type: object
      required: [has_wallet, available_kobo, currency]
      properties:
        has_wallet: { type: boolean }
        available_kobo: { type: integer }
        currency: { type: string, const: NGN }

    PayslipLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    EventType:
      type: string
      enum:
        - company.disconnected
        - run.computed
        - run.approved
        - run.rejected
        - run.locked
        - run.cancelled
        - run.disbursement_started
        - run.completed
        - run.partially_completed
        - run.adjusted
        - run.excluded
        - run.payment_scheduled
        - run.awaiting_funds
        - approval.recorded
        - payout.succeeded
        - payout.failed
        - payout.reversed
        - employee.created
        - employee.updated
        - employee.terminated
        - employee.bank_change_requested
        - employee.bank_change_approved
        - employee.bank_change_rejected
        - payslip.issued

    EventTypeOrWildcard:
      oneOf:
        - $ref: "#/components/schemas/EventType"
        - { type: string, const: "*" }

    WebhookSubscription:
      type: object
      required: [id, url, event_types, status, created_at]
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        api_key_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        event_types:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          description: DISABLED after a 410, after 3 days of failures, or when the owner pauses it.
        disabled_reason: { type: string }
        failing_since: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      required: [id, event_id, subscription_id, event_type, status, attempt_count, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        event_type: { type: string }
        status:
          type: string
          enum: [PENDING, DELIVERED, FAILED, DEAD]
          description: FAILED will be retried; DEAD will not.
        attempt_count: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_status_code: { type: integer }
        last_error: { type: string }
        delivered_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    LaunchRequest:
      type: object
      required: [user]
      properties:
        scope:
          type: string
          enum: [FULL, LAUNCH_CONTEXT]
          default: FULL
          description: FULL opens the whole payroll app; LAUNCH_CONTEXT opens one screen.
        context:
          type: object
          description: Required for LAUNCH_CONTEXT.
          properties:
            screen: { type: string, enum: [run-review, team, payslip, payout] }
            run_id: { type: string, format: uuid }
            employee_id: { type: string, format: uuid, description: Required for the payslip screen. }
        ttl_seconds: { type: integer, minimum: 1, maximum: 600, default: 300 }
        user:
          type: object
          description: |
            The person signed in to your app. Matched to a Payrolla user by
            `external_ref`, then by email. Whether an unknown person is added, and
            with what role at most, is the owner's choice.
          required: [external_ref, email, name]
          properties:
            external_ref: { type: string, description: Your stable id for this person. }
            email: { type: string, format: email }
            name: { type: string }
            role:
              type: string
              enum: [VIEWER, APPROVER, ADMIN]
              description: Used only when the person is added; never raises an existing user's role.

    # ── Events ────────────────────────────────────────────────────────────────
    # Every event is EventBase with a specific `type` and `data`. `data` objects
    # are closed (additionalProperties: false): a new field is a new api_version.

    EventBase:
      type: object
      required: [id, type, api_version, created_at, company_id, data]
      properties:
        id: { type: string, format: uuid, description: De-duplicate on this. }
        type: { type: string }
        api_version: { type: string, const: "2026-11-01" }
        created_at: { type: string, format: date-time }
        company_id: { type: string, format: uuid }
        data: { type: object }

    Event:
      description: Any event. Switch on `type`.
      oneOf:
        - $ref: "#/components/schemas/PingEvent"
        - $ref: "#/components/schemas/CompanyDisconnectedEvent"
        - $ref: "#/components/schemas/RunComputedEvent"
        - $ref: "#/components/schemas/RunApprovedEvent"
        - $ref: "#/components/schemas/RunRejectedEvent"
        - $ref: "#/components/schemas/RunEvent"
        - $ref: "#/components/schemas/RunDisbursementStartedEvent"
        - $ref: "#/components/schemas/RunSettledEvent"
        - $ref: "#/components/schemas/RunAdjustedEvent"
        - $ref: "#/components/schemas/RunPaymentScheduledEvent"
        - $ref: "#/components/schemas/RunAwaitingFundsEvent"
        - $ref: "#/components/schemas/ApprovalRecordedEvent"
        - $ref: "#/components/schemas/BankChangeRequestedEvent"
        - $ref: "#/components/schemas/BankChangeDecidedEvent"
        - $ref: "#/components/schemas/RunExcludedEvent"
        - $ref: "#/components/schemas/PayoutEvent"
        - $ref: "#/components/schemas/PayoutFailedEvent"
        - $ref: "#/components/schemas/EmployeeCreatedEvent"
        - $ref: "#/components/schemas/EmployeeChangedEvent"
        - $ref: "#/components/schemas/PayslipIssuedEvent"

    PingEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: ping }
        data:
          type: object
          additionalProperties: false
          required: [message, subscription_id]
          properties:
            message: { type: string }
            subscription_id: { type: string, format: uuid }

    RunComputedEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: run.computed }
        data:
          type: object
          additionalProperties: false
          required: [run, approval_url]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            approval_url: { type: string, format: uri }

    RunApprovedEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: run.approved }
        data:
          type: object
          additionalProperties: false
          required: [run, approved_by]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            approved_by: { type: string, description: The approver's name. }

    RunRejectedEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: run.rejected }
        data:
          type: object
          additionalProperties: false
          required: [run, note, rejected_by]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            note: { type: string }
            rejected_by: { type: string }

    RunEvent:
      description: run.locked and run.cancelled.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { enum: [run.locked, run.cancelled] }
        data:
          type: object
          additionalProperties: false
          required: [run]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }

    RunDisbursementStartedEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: run.disbursement_started }
        data:
          type: object
          additionalProperties: false
          required: [run, wallet_count, bank_count]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            wallet_count: { type: integer }
            bank_count: { type: integer }

    RunSettledEvent:
      description: run.completed and run.partially_completed.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { enum: [run.completed, run.partially_completed] }
        data:
          type: object
          additionalProperties: false
          required: [run, paid_count, failed_count]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            paid_count: { type: integer }
            failed_count: { type: integer }

    RunAdjustedEvent:
      description: A bonus or deduction was added to a run, or removed. `run.computed` follows when the run is recalculated.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: run.adjusted }
        data:
          type: object
          additionalProperties: false
          required: [run, change, adjustment]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            change: { type: string, enum: [added, removed] }
            adjustment: { $ref: "#/components/schemas/Adjustment" }

    RunPaymentScheduledEvent:
      description: The run was locked; Payrolla pays it on `scheduled_for`.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: run.payment_scheduled }
        data:
          type: object
          additionalProperties: false
          required: [run, scheduled_for, total_net_kobo]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            scheduled_for: { type: string, format: date }
            total_net_kobo: { type: integer }

    RunAwaitingFundsEvent:
      description: |
        The payment is due but the wallet doesn't cover it. It's sent automatically
        as soon as the wallet is topped up.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: run.awaiting_funds }
        data:
          type: object
          additionalProperties: false
          required: [run, needed_kobo, available_kobo, short_by_kobo]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            needed_kobo: { type: integer }
            available_kobo: { type: integer }
            short_by_kobo: { type: integer }

    ApprovalRecordedEvent:
      description: |
        A person approved, rejected or locked a run, or approved or rejected a bank
        change — and where: in Payrolla (`via: payrolla`) or in a connected app with
        their own code (`via: connect`).
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: approval.recorded }
        data:
          type: object
          additionalProperties: false
          required: [subject, subject_id, action, by, via]
          properties:
            subject: { type: string, enum: [run, bank_change] }
            subject_id: { type: string, format: uuid }
            action: { type: string, enum: [approved, rejected, locked] }
            by:
              type: object
              additionalProperties: false
              required: [user_id, name]
              properties:
                user_id: { type: string, format: uuid }
                name: { type: string }
            via: { type: string, enum: [payrolla, connect] }
            app_name: { type: string }
            run: { $ref: "#/components/schemas/RunSummary" }
            employee_id: { type: string, format: uuid }

    BankChangeRequestedEvent:
      description: A new bank account was asked for and is held for approval. No account details.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: employee.bank_change_requested }
        data:
          type: object
          additionalProperties: false
          required: [employee, change_id, requested_via]
          properties:
            employee: { $ref: "#/components/schemas/Employee" }
            change_id: { type: string, format: uuid }
            requested_via: { type: string, enum: [payrolla, connect, employee], description: "employee: the employee asked in a connected app and confirmed with a code texted to them." }

    BankChangeDecidedEvent:
      description: employee.bank_change_approved and employee.bank_change_rejected.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { enum: [employee.bank_change_approved, employee.bank_change_rejected] }
        data:
          type: object
          additionalProperties: false
          required: [employee, change_id]
          properties:
            employee: { $ref: "#/components/schemas/Employee" }
            change_id: { type: string, format: uuid }

    RunExcludedEvent:
      description: Someone was left out of a run, or put back.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: run.excluded }
        data:
          type: object
          additionalProperties: false
          required: [run, change, exclusion_id, employee_id, reason]
          properties:
            run: { $ref: "#/components/schemas/RunSummary" }
            change: { type: string, enum: [added, removed] }
            exclusion_id: { type: string, format: uuid }
            employee_id: { type: string, format: uuid }
            reason: { type: string }

    PayoutEvent:
      description: payout.succeeded and payout.reversed. No bank details.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { enum: [payout.succeeded, payout.reversed] }
        data:
          type: object
          additionalProperties: false
          required: [run_id, payslip_id, employee_id, amount_kobo, method, reference]
          properties:
            run_id: { type: string, format: uuid }
            payslip_id: { type: string, format: uuid }
            employee_id: { type: string, format: uuid }
            amount_kobo: { type: integer }
            method: { type: string, enum: [WALLET, BANK] }
            reference: { type: string, description: The payment provider's reference; may be empty. }

    PayoutFailedEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: payout.failed }
        data:
          type: object
          additionalProperties: false
          required: [run_id, payslip_id, employee_id, amount_kobo, method, reference, reason]
          properties:
            run_id: { type: string, format: uuid }
            payslip_id: { type: string, format: uuid }
            employee_id: { type: string, format: uuid }
            amount_kobo: { type: integer }
            method: { type: string, enum: [WALLET, BANK] }
            reference: { type: string }
            reason: { type: string }

    EmployeeCreatedEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: employee.created }
        data:
          type: object
          additionalProperties: false
          required: [employee]
          properties:
            employee: { $ref: "#/components/schemas/Employee" }

    EmployeeChangedEvent:
      description: employee.updated and employee.terminated.
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { enum: [employee.updated, employee.terminated] }
        data:
          type: object
          additionalProperties: false
          required: [employee, changed_fields]
          properties:
            employee: { $ref: "#/components/schemas/Employee" }
            changed_fields:
              type: array
              items:
                type: string
                enum: [first_name, last_name, email, phone, department, status, employment_type, start_date, pay_method, external_ref, bank, pay]
              description: |
                Which fields changed. `bank` and `pay` say only that the bank account or
                pay changed — never the values; read them with the API.

    PayslipIssuedEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: payslip.issued }
        data:
          type: object
          additionalProperties: false
          required: [payslip_id, employee_id, run_id, period]
          properties:
            payslip_id: { type: string, format: uuid }
            employee_id: { type: string, format: uuid }
            run_id: { type: string, format: uuid }
            period: { type: string, examples: ["September 2026"] }

    CompanyDisconnectedEvent:
      allOf: [{ $ref: "#/components/schemas/EventBase" }]
      properties:
        type: { const: company.disconnected }
        data:
          type: object
          additionalProperties: false
          required: [key_id, reason]
          properties:
            key_id: { type: string, format: uuid, description: The connection that ended. }
            reason: { type: string, enum: [revoked_by_owner, revoked_by_app] }

    Settings:
      type: object
      required: [company]
      properties:
        company:
          type: object
          required: [id, name, pay_frequency, paye_tin_set, separation_of_duties]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            rc_number: { type: string }
            tax_state: { type: string, examples: [Lagos] }
            pay_frequency: { type: string, examples: [MONTHLY] }
            paye_tin_set: { type: boolean, description: Whether the company's PAYE TIN is on file (needed to file returns). }
            separation_of_duties: { type: boolean, description: Whoever prepares a run can't approve it. }
            funding_model: { type: string, examples: [PREFUNDED] }
            kyb_verified: { type: boolean }
        statutory:
          type: [object, "null"]
          properties:
            paye_enabled: { type: boolean }
            pension_enabled: { type: boolean }
            pension_employee_rate: { type: number, examples: [0.08] }
            pension_employer_rate: { type: number, examples: [0.10] }
            nhf_enabled: { type: boolean }
            nhf_rate: { type: number, examples: [0.025] }
            nhis_enabled: { type: boolean }
            effective_from: { type: string, format: date-time }

    Remittance:
      type: object
      required: [id, payroll_run_id, authority, period, total_kobo, status, employee_count]
      properties:
        id: { type: string, format: uuid }
        payroll_run_id: { type: string, format: uuid }
        authority: { type: string, enum: [STATE_IRS, PENCOM_PFA, NHF, NHIS] }
        period: { type: string, examples: ["2026-11"] }
        total_kobo: { type: integer }
        status: { type: string, enum: [DRAFT, GENERATED, PAYABLE, FILED, PAID] }
        due_date: { type: string, format: date-time }
        pfa_code: { type: string, description: For pension schedules, the PFA it is paid to. }
        employee_count: { type: integer }
        filed_at: { type: [string, "null"], format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        filing_ref: { type: string }
        payment_ref: { type: string }

    RemittanceLine:
      type: object
      required: [employee_id, name, amount_kobo]
      properties:
        employee_id: { type: string, format: uuid }
        name: { type: string }
        pension_pfa: { type: string, description: Pension schedules only. }
        pension_pin: { type: string, description: Pension schedules only. }
        amount_kobo: { type: integer }

    EmployeeChallenge:
      type: object
      required: [challenge_id, channel, destination_hint, expires_at, account_name, last4]
      properties:
        challenge_id: { type: string, format: uuid }
        channel: { type: string, enum: [SMS] }
        destination_hint: { type: string, examples: ["•••• 7801"] }
        expires_at: { type: string, format: date-time }
        account_name: { type: string, description: The bank's name for the new account, to show the employee. }
        last4: { type: string }
