version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: UK
      ignore-rules: [license, licenses, licensecheck, color]
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    rules:
      # The spike and load generator are throwaway measurement code.
      - path: engine/spike/
        linters: [gosec, errcheck]
      - path: _test\.go
        linters: [gosec]
      # CLIs read the files their user names on the command line.
      - path: (cmd|tools)/
        text: "G304|G703"
formatters:
  enable: [gofmt, goimports]
