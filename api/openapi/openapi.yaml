            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/promote:
    post:
      operationId: promote
      tags:
      - Environments
      summary: Promote a version to an environment
      description: Deploys a version already deployed in the environment's source.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.publish
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promoted'
        '400':
          description: '`to` does not exist or does not take promotions from `from`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The key is limited to another environment, or four-eyes publishing needs another person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Nothing is deployed in `from`, another version runs there, or `to` deploys from Git.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The definition no longer passes the checks, with `problems`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/repairs:
    get:
      operationId: listWorkflowRepairs
      tags:
      - AI
      summary: List a workflow's repair proposals
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.read
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairList'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/runs:
    post:
      operationId: startRun
      tags:
      - Runs
      summary: Start a run
      description: 'Runs the version deployed in the environment (prod by default) unless the body pins another.
        An `Idempotency-Key` header makes the request safe to retry: the same key answers the same run (200).'
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: run.start
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 255
        description: 'Makes the request safe to retry: the same key answers the same run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStarted'
        '200':
          description: Already started with this Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStarted'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/triggers:
    get:
      operationId: listTriggers
      tags:
      - Workflows
      summary: List a workflow's triggers
      description: Webhook URLs, schedules and connector triggers by environment, with remote subscription status.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.read
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerList'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/versions:
    post:
      operationId: createVersion
      tags:
      - Workflows
      summary: Save a new version
      description: With `parent_digest`, edits made since are merged three ways; conflicts answer 409 with `conflicts`.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.edit
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionSaved'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/versions/{v}:
    get:
      operationId: getVersion
      tags:
      - Workflows
      summary: Get a version
      description: The definition, its layout and its current problems.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.read
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      - name: v
        in: path
        required: true
        schema:
          type: integer
        description: Version number
      responses:
        '200':
          description: The version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/versions/{v}/git-request:
    post:
      operationId: retryProposal
      tags:
      - Git
      summary: Open the Git pull request again
      description: For a platform-led Git environment whose pull request failed to open.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.publish
      x-taskiem-all-environments: true
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      - name: v
        in: path
        required: true
        schema:
          type: integer
        description: Version number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProposal'
        '409':
          description: No platform-led Git connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/versions/{v}/layout:
    put:
      operationId: putLayout
      tags:
      - Workflows
      summary: Save a version's canvas layout
      description: Positions on the canvas; not part of the definition.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.edit
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      - name: v
        in: path
        required: true
        schema:
          type: integer
        description: Version number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Layout'
        required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          description: No such version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/versions/{v}/publish:
    post:
      operationId: publish
      tags:
      - Workflows
      summary: Publish a version
      description: Makes a valid version the one new runs use. With four-eyes publishing a person's request waits
        for approval (202). An invalid definition answers 422 with its problems.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.publish
      x-taskiem-all-environments: true
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      - name: v
        in: path
        required: true
        schema:
          type: integer
        description: Version number
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '202':
          description: Waiting for a second person (four-eyes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/versions/{v}/publish/approve:
    post:
      operationId: decidePublishApprove
      tags:
      - Governance
      summary: Approve a publish request
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.publish
      x-taskiem-all-environments: true
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      - name: v
        in: path
        required: true
        schema:
          type: integer
        description: Version number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishDecided'
        '403':
          description: An API key, whoever asked, or the version's author.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The request is not pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The definition no longer passes the checks, with `problems`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/workflows/{wf}/versions/{v}/publish/reject:
    post:
      operationId: decidePublishReject
      tags:
      - Governance
      summary: Reject a publish request
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.publish
      parameters:
      - name: wf
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workflow id
      - name: v
        in: path
        required: true
        schema:
          type: integer
        description: Version number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishDecided'
        '403':
          description: An API key, whoever asked, or the version's author.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The request is not pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: taskiem_session
      description: The web app's session, set by sign-in (`POST /v1/auth/login`, a passkey or single sign-on). HttpOnly,
        SameSite=Strict, 12 hours. Requests that change something (anything but GET and HEAD) made with the cookie
        must also send the `X-Taskiem-Request` header (csrfHeader), or they are refused with 403.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Taskiem-Request
      description: 'Any non-empty value. Required with the session cookie on every request but GET and HEAD: a page
        on another site cannot set it without the browser asking first. Not needed with a bearer token.'
    sessionToken:
      type: http
      scheme: bearer
      description: 'The `token` that sign-in answers, sent as `Authorization: Bearer <token>`. Used by the CLI after
        `taskiem login`.'
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: tsk_key_…
      description: 'An API key (`POST /v1/api-keys`), sent as `Authorization: Bearer tsk_key_…`. It acts with its
        own permissions and within its owner''s current ones, may be limited to one environment, and expires (90
        days by default, at most 365). The partner API takes only keys that reach every environment.'
    endUserToken:
      type: http
      scheme: bearer
      bearerFormat: tsk_eut_…
      description: 'An embed app''s end-user token, minted by the partner (`POST /v1/partner/embed-apps/{app}/tokens`)
        and sent as `Authorization: Bearer tsk_eut_…` to `/v1/embed/{app}/…` only, from one of the app''s allowed
        origins (or from the partner''s servers when the app is headless).'
  responses:
    Error:
      description: An error. The body is always a JSON object with a human-readable `error`; some errors add a machine-readable
        `code` and details (see Errors).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: Done; no body.
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: What went wrong, in plain words. Safe to show to people.
        code:
          type: string
          description: 'Present on errors clients can act on: `limit_exceeded`, `quota_exceeded`, `backlog_full`,
            `rate_limited` (429, with Retry-After when waiting helps), `billing_degraded` (402), `plan_feature_required`
            (402, with `feature`), `downgrade_blocked` (409, with `blockers`), `key_unavailable` (503), `ai_disabled`,
            `ai_budget_exhausted`, `suspended`, and others named in the guides.'
        limit:
          type: string
          description: The plan limit that was reached.
        feature:
          type: string
          description: The plan feature the request needs.
        blockers:
          description: What stops a downgrade.
        problems:
          description: Why a definition or an input is not valid.
        conflicts:
          description: Edits that conflict with a newer version (409 on save).
        step_up:
          type: string
          description: The second factor an approval needs (`totp` or `passkey`).
        reauth:
          type: array
          items:
            type: string
          description: The proofs that will do to change a factor.
        passkey_required:
          type: boolean
        sso_required:
          type: boolean
        invitations_only:
          type: boolean
        enrol_passkey:
          type: boolean
      additionalProperties: true
    Problem:
      type: object
      required:
      - path
      - message
      properties:
        path:
          type: string
          description: JSON pointer into the definition, e.g. `/steps/2/needs`.
        message:
          type: string
    Problems:
      type: array
      items:
        $ref: '#/components/schemas/Problem'
    Definition:
      type: object
      description: A workflow definition in the WD v1 format (`schemas/wd-v1.schema.json`).
      additionalProperties: true
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type:
      - string
      - 'null'
      format: date-time
    WorkflowSummary:
      type: object
      required:
      - id
      - name
      - active_version
      - latest_version
      - created_at
      - key
      - git_path
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active_version:
          type:
          - integer
          - 'null'
          description: The published version new runs use, if any.
        latest_version:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        key:
          type: string
          description: The definition's own id (`wf_…`) in the latest version.
        git_path:
          type:
          - string
          - 'null'
          description: The file a Git-led repository keeps this workflow in; the workflow is then read-only here.
    WorkflowList:
      type: object
      required:
      - workflows
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSummary'
    VersionInfo:
      type: object
      required:
      - version
      - state
      - digest
      - created_by
      - created_at
      - published_by
      - published_at
      - git_commit
      - git_request
      - ai_build
      properties:
        version:
          type: integer
        state:
          type: string
          enum:
          - draft
          - published
          - deprecated
          - archived
        digest:
          type: string
          description: SHA-256 of the compact definition, in hex.
        created_by:
          type:
          - string
          - 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        published_by:
          type:
          - string
          - 'null'
          format: uuid
        published_at:
          $ref: '#/components/schemas/NullableTimestamp'
        git_commit:
          type:
          - string
          - 'null'
          description: The commit a Git-led sync deployed it from.
        git_request:
          type:
          - string
          - 'null'
          description: The pull or merge request a platform-led publish opened.
        ai_build:
          type:
          - string
          - 'null'
          format: uuid
          description: The AI build the version was saved from.
    Deployment:
      type: object
      required:
      - environment
      - version
      - deployed_by
      - promoted_from
      - deployed_at
      properties:
        environment:
          type: string
        version:
          type: integer
        deployed_by:
          type:
          - string
          - 'null'
        promoted_from:
          type:
          - string
          - 'null'
        deployed_at:
          $ref: '#/components/schemas/Timestamp'
    WorkflowDetail:
      type: object
      required:
      - workflow
      - versions
      - deployments
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowSummary'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionInfo'
        deployments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Deployment'
    VersionRequest:
      type: object
      required:
      - definition
      properties:
        name:
          type: string
          description: The workflow's name (required when creating a workflow).
        definition:
          $ref: '#/components/schemas/Definition'
        layout:
          type: object
          description: Canvas positions; not part of the definition.
        parent_digest:
          type: string
          description: The digest of the version this edit started from. Newer edits are merged three ways.
        resolutions:
          type: object
          additionalProperties:
            type: string
            enum:
            - ours
            - theirs
          description: How to settle conflicts a previous attempt reported, by conflict path.
    VersionSaved:
      type: object
      required:
      - id
      - version
      - digest
      - problems
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        digest:
          type: string
        merged:
          type: boolean
          description: Whether newer edits were merged in.
        problems:
          $ref: '#/components/schemas/Problems'
    VersionDetail:
      type: object
      required:
      - version
      - definition
      - problems
      properties:
        version:
          $ref: '#/components/schemas/VersionInfo'
        definition:
          $ref: '#/components/schemas/Definition'
        layout:
          type: object
        problems:
          $ref: '#/components/schemas/Problems'
    PublishResult:
      type: object
      required:
      - id
      - version
      - state
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        state:
          type: string
          enum:
          - published
          - pending_approval
        git:
          $ref: '#/components/schemas/GitProposals'
        remote_subscriptions:
          type: array
          description: Subscriptions registered at providers for remote triggers.
          items:
            $ref: '#/components/schemas/RemoteSubscription'
      additionalProperties: false
    ValidateRequest:
      type: object
      required:
      - definition
      properties:
        definition:
          $ref: '#/components/schemas/Definition'
    ValidateResult:
      type: object
      required:
      - valid
      - problems
      properties:
        valid:
          type: boolean
        problems:
          $ref: '#/components/schemas/Problems'
    StartRunRequest:
      type: object
      properties:
        input:
          description: The run's input; checked against the workflow's inputs schema (422 when it does not match).
        version:
          type: integer
          description: Pin a version other than the one deployed (dev, or with `workflow.publish`).
        environment:
          type: string
          description: Defaults to prod, or the API key's environment.
    RunStarted:
      type: object
      required:
      - run_id
      - workflow_id
      - version
      - environment
      - status
      - created
      properties:
        run_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        version:
          type: integer
        environment:
          type: string
        status:
          $ref: '#/components/schemas/RunStatusValue'
        created:
          type: boolean
          description: False when an earlier request with the same Idempotency-Key started the run.
    RunStatusValue:
      type: string
      enum:
      - queued
      - running
      - waiting
      - needs_reconciliation
      - completed
      - failed
      - cancelled
    RunSummary:
      type: object
      required:
      - id
      - workflow_id
      - workflow
      - version
      - environment
      - status
      - started_by
      - started_at
      - ended_at
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        workflow:
          type: string
        version:
          type: integer
        environment:
          type: string
        status:
          $ref: '#/components/schemas/RunStatusValue'
        started_by:
          type:
          - string
          - 'null'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        ended_at:
          $ref: '#/components/schemas/NullableTimestamp'
    RunList:
      type: object
      required:
      - runs
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
    HistoryEvent:
      type: object
      required:
      - seq
      - type
      - recorded_at
      - origin
      properties:
        seq:
          type: integer
        type:
          type: string
          description: e.g. `run.started`, `step.completed`, `run.failed`.
        step_id:
          type: string
        attempt:
          type: integer
        payload:
          description: The event's data. Personal data is sealed unless revealed.
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        origin:
          type: string
    RunDetail:
      type: object
      required:
      - run
      - events
      - revealed
      - forks
      properties:
        run:
          $ref: '#/components/schemas/RunSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEvent'
        revealed:
          type: boolean
        forks:
          type: object
          required:
          - parent_run_id
          - resumed_step
          - resumed_by
          properties:
            parent_run_id:
              type:
              - string
              - 'null'
              format: uuid
              description: The failed run this run resumed.
            resumed_step:
              type:
              - string
              - 'null'
            resumed_by:
              type: array
              items:
                type: string
                format: uuid
              description: Runs that resumed this one.
    RunStatus:
