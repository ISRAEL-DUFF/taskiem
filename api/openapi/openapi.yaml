# The Taskiem public API (OpenAPI 3.1). Hand-maintained: change it with the routes.
# api/openapi_test.go fails when a route is missing here, when this names a route
# that does not exist, or when the permissions and plan features drift from the code.
# The docs site renders it as the API reference (tools/docsite).
openapi: 3.1.0
info:
  title: Taskiem API
  version: v1
  summary: Build, publish and run workflows; manage a tenant; embed the builder.
  description: |
    The REST API the web app, the `taskiem` CLI, partners and embedded builders use. Every route is under `/v1` on the deployment's own address (`TASKIEM_PUBLIC_URL`). Requests and answers are JSON unless an operation says otherwise.

    ## Authentication

    | Who | How | Where |
    | --- | --- | --- |
    | The web app | The `taskiem_session` cookie set by sign-in, plus the `X-Taskiem-Request` header (any value) on every request but GET and HEAD | Every member route |
    | The CLI, scripts | `Authorization: Bearer <token>`: the `token` sign-in answers | Every member route |
    | Automation | `Authorization: Bearer tsk_key_…`: an API key (`POST /v1/api-keys`) | Every member route; the partner API takes only keys reaching every environment |
    | An embed app's end users | `Authorization: Bearer tsk_eut_…`: an end-user token the partner mints | `/v1/embed/{app}/…` only |

    An API key acts with its own permissions and within its owner's current ones. Each operation names the permission it needs (`x-taskiem-permission`), the plan feature it needs when billing is on (`x-taskiem-plan-feature`), and whether a key limited to one environment is refused because the operation reaches every environment (`x-taskiem-all-environments`). Sign-in takes only `application/json`, so another site cannot drive it with a form.

    ## Errors

    An error is a JSON object with a human-readable `error`, safe to show to people. Errors clients can act on add a `code`:

    | Status | `code` | Meaning |
    | --- | --- | --- |
    | 400 | — | The request is malformed; unknown JSON fields are refused |
    | 401 | — | Authentication required, or sign-in refused (`passkey_required`, `sso_required` say why) |
    | 402 | `plan_feature_required` | The plan lacks `feature` |
    | 402 | `billing_degraded` | Unpaid or cancelled: payment lifts it |
    | 403 | — | A permission is missing (`requires workflow.publish`), a step-up is needed (`step_up`), or a factor change needs a proof (`reauth`) |
    | 404 | — | Not found, or not visible to the caller |
    | 409 | `downgrade_blocked` | A plan change the tenant's use does not fit, with `blockers`; other conflicts have no code |
    | 422 | — | A definition or run input is not valid, with `problems` |
    | 423 | — | The tenant is suspended |
    | 429 | `limit_exceeded`, `quota_exceeded`, `backlog_full`, `rate_limited` | A plan limit or rate, with `limit`; `Retry-After` when waiting helps |
    | 503 | `key_unavailable` | The tenant's customer key cannot be reached (bring your own key) |

    ## Retries and paging

    `POST /v1/workflows/{wf}/runs` takes an `Idempotency-Key` header: the same key answers the same run, so a timed-out request can be sent again. `GET /v1/runs` pages by `before` (the last run's `started_at`) and `limit`.
servers:
- url: /
  description: The deployment the web app is served from (TASKIEM_PUBLIC_URL)
tags:
- name: Authentication
  description: Signing in and out, passwords, passkeys, single sign-on and self-serve signup.
  x-taskiem-guide: governance
- name: WhatsApp
  description: Linking people to WhatsApp, the tenant's own number, the outbox and approval hand-offs.
  x-taskiem-guide: whatsapp
- name: Account
  description: 'The signed-in person: who they are, their factors, invitations and email confirmation.'
  x-taskiem-guide: governance
- name: Onboarding
  description: The getting-started checklist.
  x-taskiem-guide: onboarding
- name: Embed
  description: The embed API, called by an embed app's end users with their own tokens.
  x-taskiem-guide: embedding
- name: Partner
  description: 'The partner API: sub-tenants, embed apps, end-user tokens and webhooks. API keys reaching every
    environment only.'
  x-taskiem-guide: embedding
- name: AI
  description: Building workflows from goals, and self-repair proposals for failed runs.
  x-taskiem-guide: ai
- name: Git
  description: Connecting environments to Git repositories.
  x-taskiem-guide: git
- name: Governance
  description: Approvals, delegations, approval policies, four-eyes publishing and governance settings.
  x-taskiem-guide: governance
- name: Runs
  description: Starting, watching, cancelling and resolving runs.
  x-taskiem-guide: dashboard
- name: Environments
  description: Environments, promotion, deployments, variables, secrets and private network access.
  x-taskiem-guide: environments
- name: Workflows
  description: Workflows, their versions, validation, publishing and workflow code.
  x-taskiem-guide: sdk
- name: Templates
  description: The SME template library.
  x-taskiem-guide: templates
- name: Catalogue
  description: 'The public connector catalogue: browsing, installing, publishing and submissions.'
  x-taskiem-guide: connector-submissions
- name: Connectors
  description: Connectors, connections, drift and the tenant's own WebAssembly connectors.
  x-taskiem-guide: connector-sdk
- name: Alerts
  description: Alert channels and rules.
  x-taskiem-guide: alerts
- name: Members
  description: Members, invitations, roles, API keys, single sign-on and SCIM settings.
  x-taskiem-guide: governance
- name: Audit
  description: The audit log, compliance reports and erasure of personal data.
  x-taskiem-guide: compliance
- name: Billing
  description: Plans, subscriptions, invoices and limits.
  x-taskiem-guide: billing
- name: Keys
  description: The tenant's encryption keys and bring your own key.
  x-taskiem-guide: byok
- name: USSD
  description: USSD channels.
  x-taskiem-guide: ussd
paths:
  /v1/ai/build:
    post:
      operationId: aiBuild
      tags:
      - AI
      summary: Draft a workflow from a goal
      description: 'Starts an AI build: the goal in plain words becomes a draft workflow, checked and dry-run. Answers
        202 with the build''s id; poll the build until it ends.'
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.edit
      x-taskiem-plan-feature:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIBuildRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIBuildStarted'
        '400':
          description: The goal is empty or longer than 4000 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited` (more than a few builds at once, with Retry-After) or `ai_budget_exhausted`
            (the month''s tokens are spent).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`ai_disabled`: the deployment has no model configured.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/ai/builds/{id}:
    get:
      operationId: aiGetBuild
      tags:
      - AI
      summary: Get an AI build
      description: The build's state, its draft, problems and warnings.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.edit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: AI build id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIBuild'
        '404':
          description: No such build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/ai/builds/{id}/interactions:
    get:
      operationId: aiInteractions
      tags:
      - AI
      summary: List an AI build's model interactions
      description: Every prompt and answer the build exchanged with the model, for audit.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: audit.read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: AI build id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIInteractionList'
        default:
          $ref: '#/components/responses/Error'
  /v1/ai/builds/{id}/save:
    post:
      operationId: aiSave
      tags:
      - AI
      summary: Save an AI build as a workflow
      description: Saves the build's draft as a new workflow or a new version of one; the AI is recorded as co-author.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.edit
      x-taskiem-plan-feature:
      - ai
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: AI build id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISaveRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftSaved'
        '400':
          description: A new workflow needs a name and the definition has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such build, or the workflow it changes is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The build is not a proposal (still running, failed or already saved), or the workflow is
            kept in Git.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/ai/status:
    get:
      operationId: aiStatus
      tags:
      - AI
      summary: Get AI building status
      description: Whether AI building is on, and the tenant's monthly token budget and use.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: workflow.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatus'
        default:
          $ref: '#/components/responses/Error'
  /v1/alerts:
    get:
      operationId: listAlerts
      tags:
      - Alerts
      summary: List recent alerts
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        default:
          $ref: '#/components/responses/Error'
  /v1/alerts/channels:
    get:
      operationId: listAlertChannels
      tags:
      - Alerts
      summary: List alert channels
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertChannelList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAlertChannel
      tags:
      - Alerts
      summary: Add an alert channel
      description: Email, Slack, webhook or WhatsApp destination for alerts.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertChannelRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertChannelCreated'
        '400':
          description: No name, an unknown kind, bad recipients or URL, or a WhatsApp recipient who is not a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/alerts/channels/{id}:
    delete:
      operationId: deleteAlertChannel
      tags:
      - Alerts
      summary: Remove an alert channel
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Error'
  /v1/alerts/channels/{id}/test:
    post:
      operationId: testAlertChannel
      tags:
      - Alerts
      summary: Send a test alert
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivered'
        '404':
          description: No such channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The test message was not delivered; `error` says why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Alerts are not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/alerts/rules:
    get:
      operationId: listAlertRules
      tags:
      - Alerts
      summary: List alert rules
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAlertRule
      tags:
      - Alerts
      summary: Add an alert rule
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDOnly'
        '400':
          description: No name, an unknown kind, a bad threshold, workflow or environment, or an unknown channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/alerts/rules/{id}:
    put:
      operationId: updateAlertRule
      tags:
      - Alerts
      summary: Change an alert rule
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDOnly'
        '400':
          description: No name, an unknown kind, a bad threshold, workflow or environment, or an unknown channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAlertRule
      tags:
      - Alerts
      summary: Remove an alert rule
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: alert.manage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Error'
  /v1/api-keys:
    get:
      operationId: listKeys
      tags:
      - Members
      summary: List API keys
      description: Keys are shown by prefix only; the key itself is shown once, when created.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: member.manage
      responses:
        '200':
          description: Keys, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKey
      tags:
      - Members
      summary: Create an API key
      description: Issues a key with the permissions given (no more than the caller holds), optionally limited to
        one environment. The answer holds the key; it is never shown again. Needs a confirmed email.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: member.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
      responses:
        '201':
          description: Created; the key is shown only here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        default:
          $ref: '#/components/responses/Error'
  /v1/api-keys/{id}:
    delete:
      operationId: revokeKey
      tags:
      - Members
      summary: Revoke an API key
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: member.manage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: API key id
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals:
    get:
      operationId: listApprovals
      tags:
      - Governance
      summary: List approvals waiting for the caller
      description: Approval steps the caller may decide, including those they cover under a delegation.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalList'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/{run}/{step}:
    post:
      operationId: decide
      tags:
      - Governance
      summary: Decide an approval
      description: Approve or reject a waiting approval step. A policy may ask for step-up (a TOTP code or passkey
        assertion); without it the answer is 403 with `step_up`.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: approval.decide
      parameters:
      - name: run
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Run id
      - name: step
        in: path
        required: true
        schema:
          type: string
        description: Step id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '403':
          description: An API key, a role the caller does not hold, or a step-up that is missing or wrong (`step_up`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already decided by the caller, or the approval is closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many wrong authenticator codes (`step_up`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/audit:
    get:
      operationId: listAudit
      tags:
      - Audit
      summary: List audit entries
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: audit.read
      x-taskiem-all-environments: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: before
        in: query
        schema:
          type: integer
        description: Entries before this `seq` (the last page's smallest).
      - name: action
        in: query
        schema:
          type: string
        description: Only this action.
  /v1/audit/anchors:
    get:
      operationId: listAnchors
      tags:
      - Audit
      summary: List audit anchors
      description: Signed checkpoints of the audit chain, checkable with the published anchor key.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: audit.read
      x-taskiem-all-environments: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAnchorList'
        default:
          $ref: '#/components/responses/Error'
  /v1/audit/export:
    get:
      operationId: exportAudit
      tags:
      - Audit
      summary: Export the audit log
      description: The whole audit log as JSON lines (`application/x-ndjson`).
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: audit.read
      x-taskiem-all-environments: true
      responses:
        '200':
          description: The audit log, one JSON entry per line
          content:
            application/x-ndjson:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /v1/audit/verify:
    get:
      operationId: verifyAudit
      tags:
      - Audit
      summary: Verify the audit chain
      description: Recomputes the hash chain and reports the first break, if any.
      security:
      - sessionCookie: []
      - sessionToken: []
      - apiKey: []
      x-taskiem-permission: audit.read
      x-taskiem-all-environments: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      operationId: login
      tags:
      - Authentication
      summary: Sign in with a password
      description: 'Takes only `application/json`. A browser gets the session cookie only; a client that sends `"bearer":
        true` gets the session token in the body and no cookie. Limited per address and per account.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Authentication
      summary: Sign out
      description: Ends the session and clears the cookie.
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionToken: []
      - apiKey: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/passkey:
    post:
      operationId: passkeyLogin
      tags:
      - Authentication
      summary: Sign in with a passkey
