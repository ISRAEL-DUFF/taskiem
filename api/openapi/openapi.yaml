          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        retired_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
    KeyStatus:
      type: object
      required:
      - mode
      - current_version
      - versions
      - parked_steps
      - cache_ttl_seconds
      properties:
        mode:
          type: string
          enum:
          - platform
          - customer
          description: Whether the tenant key is wrapped by the platform's key or the customer's.
        current_version:
          type: integer
        versions:
          type: array
          items:
            type: object
            required:
            - version
            - wrapped_by
            - created_at
            - secrets
            - subject_keys
            properties:
              version:
                type: integer
              wrapped_by:
                type: string
                enum:
                - platform
                - customer
              byok_key_id:
                type: string
                format: uuid
              created_at:
                $ref: '#/components/schemas/Timestamp'
              retired_at:
                $ref: '#/components/schemas/Timestamp'
              destroyed_at:
                $ref: '#/components/schemas/Timestamp'
              secrets:
                type: integer
                description: Secrets still under this version.
              subject_keys:
                type: integer
            additionalProperties: false
        byok:
          $ref: '#/components/schemas/BYOKKey'
        retired_byok:
          type: array
          items:
            $ref: '#/components/schemas/BYOKKey'
        rewrap:
          type: object
          description: Re-encryption under way after a rotation or a change of key.
          required:
          - phase
          - reason
          - since
          - not_before
          - secrets
          - subject_keys
          properties:
            phase:
              type: string
              enum:
              - rewrap
              - destroy
            reason:
              type: string
            since:
              $ref: '#/components/schemas/Timestamp'
            not_before:
              $ref: '#/components/schemas/Timestamp'
            secrets:
              type: integer
            subject_keys:
              type: integer
            last_error:
              type: string
          additionalProperties: false
        parked_steps:
          type: integer
          description: Steps waiting because the customer key is unavailable.
        cache_ttl_seconds:
          type: integer
      additionalProperties: false
    KeysOverview:
      type: object
      required:
      - status
      - providers
      - plan_allows_byok
      properties:
        status:
          $ref: '#/components/schemas/KeyStatus'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/BYOKProvider'
        plan_allows_byok:
          type: boolean
      additionalProperties: false
