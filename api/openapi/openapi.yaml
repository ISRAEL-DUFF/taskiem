                $ref: '#/components/schemas/Object'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: taskiem_session
      description: The web app's session, set by sign-in (`POST /v1/auth/login`, a passkey or single sign-on). HttpOnly,
        SameSite=Strict, 12 hours. Requests that change something (anything but GET and HEAD) made with the cookie
        must also send the `X-Taskiem-Request` header (csrfHeader), or they are refused with 403.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Taskiem-Request
      description: 'Any non-empty value. Required with the session cookie on every request but GET and HEAD: a page
        on another site cannot set it without the browser asking first. Not needed with a bearer token.'
    sessionToken:
      type: http
      scheme: bearer
      description: 'The `token` that sign-in answers, sent as `Authorization: Bearer <token>`. Used by the CLI after
        `taskiem login`.'
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: tsk_key_…
      description: 'An API key (`POST /v1/api-keys`), sent as `Authorization: Bearer tsk_key_…`. It acts with its
        own permissions and within its owner''s current ones, may be limited to one environment, and expires (90
        days by default, at most 365). The partner API takes only keys that reach every environment.'
    endUserToken:
      type: http
      scheme: bearer
      bearerFormat: tsk_eut_…
      description: 'An embed app''s end-user token, minted by the partner (`POST /v1/partner/embed-apps/{app}/tokens`)
        and sent as `Authorization: Bearer tsk_eut_…` to `/v1/embed/{app}/…` only, from one of the app''s allowed
        origins (or from the partner''s servers when the app is headless).'
  responses:
    Error:
      description: An error. The body is always a JSON object with a human-readable `error`; some errors add a machine-readable
        `code` and details (see Errors).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: Done; no body.
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: What went wrong, in plain words. Safe to show to people.
        code:
          type: string
          description: 'Present on errors clients can act on: `limit_exceeded`, `quota_exceeded`, `backlog_full`,
            `rate_limited` (429, with Retry-After when waiting helps), `billing_degraded` (402), `plan_feature_required`
            (402, with `feature`), `downgrade_blocked` (409, with `blockers`), `key_unavailable` (503), `ai_disabled`,
            `ai_budget_exhausted`, `suspended`, and others named in the guides.'
        limit:
          type: string
          description: The plan limit that was reached.
        feature:
          type: string
          description: The plan feature the request needs.
        blockers:
          description: What stops a downgrade.
        problems:
          description: Why a definition or an input is not valid.
        conflicts:
          description: Edits that conflict with a newer version (409 on save).
        step_up:
          type: string
          description: The second factor an approval needs (`totp` or `passkey`).
        reauth:
          type: array
          items:
            type: string
          description: The proofs that will do to change a factor.
        passkey_required:
          type: boolean
        sso_required:
          type: boolean
        invitations_only:
          type: boolean
        enrol_passkey:
          type: boolean
      additionalProperties: true
    Object:
      type: object
      description: A JSON object; the guide linked from this operation's tag describes its fields.
      additionalProperties: true
    Problem:
      type: object
      required:
      - path
      - message
      properties:
        path:
          type: string
          description: JSON pointer into the definition, e.g. `/steps/2/needs`.
        message:
          type: string
    Problems:
      type: array
      items:
        $ref: '#/components/schemas/Problem'
    Definition:
      type: object
      description: A workflow definition in the WD v1 format (`schemas/wd-v1.schema.json`).
      additionalProperties: true
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type:
      - string
      - 'null'
      format: date-time
    WorkflowSummary:
      type: object
      required:
      - id
      - name
      - active_version
      - latest_version
      - created_at
      - key
      - git_path
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active_version:
          type:
          - integer
          - 'null'
          description: The published version new runs use, if any.
        latest_version:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        key:
          type: string
          description: The definition's own id (`wf_…`) in the latest version.
        git_path:
          type:
          - string
          - 'null'
          description: The file a Git-led repository keeps this workflow in; the workflow is then read-only here.
    WorkflowList:
      type: object
      required:
      - workflows
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSummary'
    VersionInfo:
      type: object
      required:
      - version
      - state
      - digest
      - created_by
      - created_at
      - published_by
      - published_at
      - git_commit
      - git_request
      - ai_build
      properties:
        version:
          type: integer
        state:
          type: string
          enum:
          - draft
          - published
          - deprecated
          - archived
        digest:
          type: string
          description: SHA-256 of the compact definition, in hex.
        created_by:
          type:
          - string
          - 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        published_by:
          type:
          - string
          - 'null'
          format: uuid
        published_at:
          $ref: '#/components/schemas/NullableTimestamp'
        git_commit:
          type:
          - string
          - 'null'
          description: The commit a Git-led sync deployed it from.
        git_request:
          type:
          - string
          - 'null'
          description: The pull or merge request a platform-led publish opened.
        ai_build:
          type:
          - string
          - 'null'
          format: uuid
          description: The AI build the version was saved from.
    Deployment:
      type: object
      required:
      - environment
      - version
      - deployed_by
      - promoted_from
      - deployed_at
      properties:
        environment:
          type: string
        version:
          type: integer
        deployed_by:
          type:
          - string
          - 'null'
        promoted_from:
          type:
          - string
          - 'null'
        deployed_at:
          $ref: '#/components/schemas/Timestamp'
    WorkflowDetail:
      type: object
      required:
      - workflow
      - versions
      - deployments
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowSummary'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionInfo'
        deployments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Deployment'
    VersionRequest:
      type: object
      required:
      - definition
      properties:
        name:
          type: string
          description: The workflow's name (required when creating a workflow).
        definition:
          $ref: '#/components/schemas/Definition'
        layout:
          type: object
          description: Canvas positions; not part of the definition.
        parent_digest:
          type: string
          description: The digest of the version this edit started from. Newer edits are merged three ways.
        resolutions:
          type: object
          additionalProperties:
            type: string
            enum:
            - ours
            - theirs
          description: How to settle conflicts a previous attempt reported, by conflict path.
    VersionSaved:
      type: object
      required:
      - id
      - version
      - digest
      - problems
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        digest:
          type: string
        merged:
          type: boolean
          description: Whether newer edits were merged in.
        problems:
          $ref: '#/components/schemas/Problems'
    VersionDetail:
      type: object
      required:
      - version
      - definition
      - problems
      properties:
        version:
          $ref: '#/components/schemas/VersionInfo'
        definition:
          $ref: '#/components/schemas/Definition'
        layout:
          type: object
        problems:
          $ref: '#/components/schemas/Problems'
    PublishResult:
      type: object
      required:
      - id
      - version
      - state
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        state:
          type: string
          enum:
          - published
          - pending_approval
        git:
          type: object
          description: The pull request a platform-led Git environment opened.
        remote_subscriptions:
          type: array
          description: Subscriptions registered at providers for remote triggers.
    ValidateRequest:
      type: object
      required:
      - definition
      properties:
        definition:
          $ref: '#/components/schemas/Definition'
    ValidateResult:
      type: object
      required:
      - valid
      - problems
      properties:
        valid:
          type: boolean
        problems:
          $ref: '#/components/schemas/Problems'
    StartRunRequest:
      type: object
      properties:
        input:
          description: The run's input; checked against the workflow's inputs schema (422 when it does not match).
        version:
          type: integer
          description: Pin a version other than the one deployed (dev, or with `workflow.publish`).
        environment:
          type: string
          description: Defaults to prod, or the API key's environment.
    RunStarted:
      type: object
      required:
      - run_id
      - workflow_id
      - version
      - environment
      - status
      - created
      properties:
        run_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        version:
          type: integer
        environment:
          type: string
        status:
          $ref: '#/components/schemas/RunStatusValue'
        created:
          type: boolean
          description: False when an earlier request with the same Idempotency-Key started the run.
    RunStatusValue:
      type: string
      enum:
      - queued
      - running
      - waiting
      - needs_reconciliation
      - completed
      - failed
      - cancelled
    RunSummary:
      type: object
      required:
      - id
      - workflow_id
      - workflow
      - version
      - environment
      - status
      - started_by
      - started_at
      - ended_at
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        workflow:
          type: string
        version:
          type: integer
        environment:
          type: string
        status:
          $ref: '#/components/schemas/RunStatusValue'
        started_by:
          type:
          - string
          - 'null'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        ended_at:
          $ref: '#/components/schemas/NullableTimestamp'
    RunList:
      type: object
      required:
      - runs
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
    HistoryEvent:
      type: object
      required:
      - seq
      - type
      - recorded_at
      - origin
      properties:
        seq:
          type: integer
        type:
          type: string
          description: e.g. `run.started`, `step.completed`, `run.failed`.
        step_id:
          type: string
        attempt:
          type: integer
        payload:
          description: The event's data. Personal data is sealed unless revealed.
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        origin:
          type: string
    RunDetail:
      type: object
      required:
      - run
      - events
      - revealed
      - forks
      properties:
        run:
          $ref: '#/components/schemas/RunSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEvent'
        revealed:
          type: boolean
        forks:
          type: object
          required:
          - parent_run_id
          - resumed_step
          - resumed_by
          properties:
            parent_run_id:
              type:
              - string
              - 'null'
              format: uuid
              description: The failed run this run resumed.
            resumed_step:
              type:
              - string
              - 'null'
            resumed_by:
              type: array
              items:
                type: string
                format: uuid
              description: Runs that resumed this one.
    RunStatus:
      type: object
      required:
      - run_id
      - status
      properties:
        run_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatusValue'
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
        tenant_id:
          type: string
          format: uuid
          description: Which organisation to sign in to, for someone in several.
        bearer:
          type: boolean
          description: 'Return the session token in the body instead of setting the cookie: for API clients and
            scripts. Browsers leave it out.'
    Session:
      type: object
      properties:
        token:
          type: string
          description: 'The session token, only when the request asked with `"bearer": true`; otherwise the
            session is the `taskiem_session` cookie.'
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
        tenants:
          type:
          - array
          - 'null'
          description: The organisations the person can sign in to.
        user_id:
          type: string
          format: uuid
      additionalProperties: true
    Me:
      type: object
      required:
      - tenant_id
      - roles
      - permissions
      - auth_method
      properties:
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
        roles:
          type:
          - array
          - 'null'
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        auth_method:
          type: string
          description: How the session signed in (`password`, `passkey`, `sso`); empty for an API key.
        enrol_passkey:
          type: boolean
          description: An administrator signed in with a password who must add a passkey before anything else.
        invitations_only:
          type: boolean
          description: Someone in no organisation, answering invitations.
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string
            email_verified:
              type: boolean
        totp:
          type: boolean
          description: Whether an authenticator is enrolled.
        factors:
          description: What the person proves themselves with to change their factors.
    SignupOptions:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    SignupRequest:
      type: object
      required:
      - tenant
      - email
      - password
      properties:
        tenant:
          type: string
          description: The organisation's name.
        email:
          type: string
        name:
          type: string
          description: The person's name.
        password:
          type: string
          minLength: 12
          maxLength: 1024
        website:
          type: string
          description: The form's hidden field. Leave it out; anything in it is refused.
        bearer:
          type: boolean
          description: 'Return the session token in the body instead of setting the cookie: for API clients and
            scripts. Browsers leave it out.'
    SignupResult:
      type: object
      required:
      - tenant_id
      - user_id
      - verification_sent
      properties:
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token:
          type: string
          description: The owner's session token (also set as the cookie).
        verification_sent:
          type: boolean
          description: Whether a confirmation email went out; false when the deployment cannot send email.
    ApiKeyRequest:
      type: object
      required:
      - name
      - permissions
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
          description: No more than the caller holds.
        environment:
          type: string
          description: Limit the key to one environment.
        expires_days:
          type: integer
          description: 1 to 365; default 90.
    ApiKeyCreated:
      type: object
      required:
      - id
      - key
      - expires_days
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: The key, `tsk_key_…`. Shown only here.
        expires_days:
          type: integer
    ApiKeyList:
      type: object
      required:
      - api_keys
      properties:
        api_keys:
          type:
          - array
          - 'null'
          items:
            type: object
            required:
            - id
            - name
            - prefix
            - permissions
            - expires_at
            - last_used_at
            - revoked_at
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              prefix:
                type: string
                description: The key's first characters, to recognise it.
              permissions:
                type: array
                items:
                  type: string
              expires_at:
                $ref: '#/components/schemas/Timestamp'
              last_used_at:
                $ref: '#/components/schemas/NullableTimestamp'
              revoked_at:
                $ref: '#/components/schemas/NullableTimestamp'
    ConnectorList:
      type: object
      required:
      - connectors
      properties:
        connectors:
          type: array
          items:
            type: object
            required:
            - ref
            - id
            - version
            - name
            - auth
            - actions
            - triggers
            properties:
              ref:
                type: string
                description: '`id@major`, as steps name it.'
              id:
                type: string
              version:
                type: string
              name:
                type: string
              auth:
                type: object
                description: How the connector authenticates (its manifest's `auth`).
              actions:
                type: object
                additionalProperties:
                  type: object
                  required:
                  - title
                  - class
                  properties:
                    title:
                      type: string
                    class:
                      type: string
                      description: The action class (read, write, …) that decides retries and idempotency.
                    input:
                      type: object
                    output:
                      type: object
              triggers:
                type:
                - array
                - 'null'
                items:
                  type: string
    Onboarding:
      type: object
      required:
      - items
      - done
      - total
      - complete
      - dismissed
      - self_serve
      - email_verified
      - can_send_email
      - docs_url
      - signed_up_at
      - first_run_at
      - seconds_to_first_run
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - id
            - done
            properties:
              id:
                type: string
              done:
                type: boolean
        done:
          type: integer
        total:
          type: integer
        complete:
          type: boolean
        dismissed:
          type: boolean
        self_serve:
          type: boolean
        email_verified:
          type: boolean
        can_send_email:
          type: boolean
        docs_url:
          type: string
          description: The docs site help panels link to (TASKIEM_DOCS_URL); empty without one.
        signed_up_at:
          $ref: '#/components/schemas/NullableTimestamp'
        first_run_at:
          $ref: '#/components/schemas/NullableTimestamp'
        seconds_to_first_run:
          type:
          - number
          - 'null'
