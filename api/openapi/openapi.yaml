      - rewrap
      properties:
        version:
          type: integer
          description: The new tenant key version.
        rewrap:
          type: string
          enum:
          - queued
          description: Secrets are re-encrypted in the background.
      additionalProperties: false
    BYOKRequest:
      type: object
      description: The key (as BYOKConfig), its credentials, and the step-up.
      required:
      - provider
      - key
      - credentials
      properties:
        provider: *id001
        address: *id002
        mount: *id003
        namespace: *id004
        auth_mount: *id005
        ca_cert: *id006
        key: *id007
        key_version: *id008
        region: *id009
        credentials:
          type: object
          additionalProperties:
            type: string
          description: 'vault_transit: `token`, or `role_id` and `secret_id`; aws_kms: `access_key_id` and `secret_access_key`;
            gcp_kms: `service_account_json`; azure_key_vault: `tenant_id`, `client_id` and `client_secret`.'
        totp:
          type: string
        passkey:
          $ref: '#/components/schemas/PasskeyCredential'
      additionalProperties: false
    BYOKEnabled:
