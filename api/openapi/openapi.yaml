    RepairProposal:
      type: object
      description: A self-repair proposal for a failed run (docs/ai.md).
      required:
      - id
      - run_id
      - workflow_id
      - version
      - environment
      - reason
      - class
      - classified_by
      - step
      - status
      - explanation
      - action
      - definition
      - diff
      - evidence
      - test
      - attempts
      - provider
      - model
      - total_tokens
      - error
      - created_by
      - created_at
      - finished_at
      - draft_version
      - accepted_by
      - accepted_at
      - dismissed_by
      - dismissed_at
      - resumed_run_id
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        version:
          type: integer
          description: The version the run failed on.
        environment:
          type: string
        reason:
          type: string
          description: What failed.
        class:
          type:
          - string
          - 'null'
          enum:
          - transient
          - credential
          - data
          - schema_drift
          - logic
          - unknown_outcome
          - null
        classified_by:
          type:
          - string
          - 'null'
          enum:
          - rules
          - model
          - null
        step:
          type:
          - string
          - 'null'
          description: The failing (or parked) step.
        status:
          type: string
          enum:
          - analysing
          - proposed
          - action
          - withheld
          - failed
          - awaiting_publish
          - awaiting_promotion
          - published
          - resumed
          - dismissed
        explanation:
          type: string
        action:
          description: For transient, credential and unknown-outcome failures, what a person can do.
        definition:
          description: The patched definition, when the proposal is a patch.
          anyOf:
          - $ref: '#/components/schemas/Definition'
          - type: 'null'
        diff:
          description: The patch against the failed version.
        evidence:
          description: The shadow run, regression and existing tests, attempts.
        test:
          description: The regression case (wd-test/v1), redacted.
        attempts:
          type: integer
        provider:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        total_tokens:
          type: integer
        error:
          type:
          - string
          - 'null'
        created_by:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        draft_version:
          type:
          - integer
          - 'null'
          description: The patched version, once accepted.
        accepted_by:
          type:
          - string
          - 'null'
        accepted_at:
          $ref: '#/components/schemas/NullableTimestamp'
        dismissed_by:
          type:
          - string
          - 'null'
        dismissed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        resumed_run_id:
          $ref: '#/components/schemas/NullableUUID'
      additionalProperties: false
    RepairList:
