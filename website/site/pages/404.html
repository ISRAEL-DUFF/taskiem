<style>
.nf{display:grid;place-items:center;text-align:center;min-height:60vh;padding-block:140px 80px}
.nf b{display:block;font-size:clamp(80px,14vw,180px);font-weight:800;letter-spacing:-.06em;line-height:.9;color:var(--head)}
.nf b span{display:inline-block;color:var(--acc);animation:wob 2.6s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-12px) rotate(-6deg)}}
.nf p{margin:18px auto 0;max-width:40ch;font-size:17px}
.nf .cta-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
</style>
{{HEADER}}
<main>
  <div class="wrap nf">
    <div>
      <b>4<span>0</span>4</b>

      <div class="cta-row"><a class="btn btn-main btn-big mag" href="/">Go to the home page</a><a class="btn btn-alt btn-big mag" href="/contact">Contact us</a></div>
    </div>
  </div>
</main>
