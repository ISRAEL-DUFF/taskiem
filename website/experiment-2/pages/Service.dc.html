<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{s.Name}}</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- A page for each service on Works with, in the design's own parts and
     styles (website/experiment-2/README.md). The facts are the connector's
     manifest and the templates that use it, from tools/docsite -data. -->
<div class="tk" data-theme="{{theme}}">
<dc-import name="Header" theme="{{theme}}" hint-size="100%,88px"></dc-import>
<main>

<section class="page-top">
  <div class="container" style="display:flex;flex-direction:column;gap:20px">
    <a class="link" href="/integrations" style="align-self:flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg> Everything Taskiem works with</a>
    <p class="label">{{s.Kind}}</p>
    <h1 class="h1" style="max-width:1000px">{{s.Name}}</h1>
    <p class="lede" style="max-width:720px">{{s.Description}}</p>
  </div>
</section>

<section style="padding-bottom:clamp(48px,6vw,80px)">
  <div class="container">
    <div class="grid" style="--min:320px;align-items:start">
      <div class="card-pine" style="border-radius:24px;padding:clamp(24px,3.4vw,40px)">
        <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v5M15 3v5M6.5 8h11v3a5.5 5.5 0 0 1-11 0zM12 16.5V21"/></svg></div>
        <h2 class="h3" style="font-size:clamp(24px,2.4vw,30px)">Connecting it</h2>
        <p class="small">{{s.connect}}</p>
      </div>
      <sc-if value="{{s.Does}}" hint-placeholder-val="{{true}}">
      <div class="card" style="border-radius:24px;padding:clamp(24px,3.4vw,40px)">
        <h2 class="h3" style="font-size:clamp(24px,2.4vw,30px)">What your workflows can do</h2>
        <ul class="checks">
          <sc-for list="{{s.Does}}" as="d" hint-placeholder-count="4">
            <li><span class="tick" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>{{d}}</li>
          </sc-for>
        </ul>
      </div>
      </sc-if>
      <sc-if value="{{s.Starts}}" hint-placeholder-val="{{true}}">
      <div class="card" style="border-radius:24px;padding:clamp(24px,3.4vw,40px)">
        <h2 class="h3" style="font-size:clamp(24px,2.4vw,30px)">What can start a workflow</h2>
        <ul class="checks">
          <sc-for list="{{s.Starts}}" as="d" hint-placeholder-count="3">
            <li><span class="tick" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>{{d}}</li>
          </sc-for>
        </ul>
      </div>
      </sc-if>
    </div>
  </div>
</section>

<sc-if value="{{s.Templates}}" hint-placeholder-val="{{true}}">
<section style="padding-bottom:clamp(56px,8vw,104px)">
  <div class="container" style="display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;flex-direction:column;gap:8px;max-width:640px">
      <p class="label">Ready-made</p>
      <h2 class="h2" style="font-size:clamp(28px,3.4vw,42px)">Workflows that use {{s.Name}}</h2>
    </div>
    <div class="grid" style="--min:320px">
      <sc-for list="{{s.Templates}}" as="t" hint-placeholder-count="3">
        <div class="card">
          <h3 class="h3">{{t.title}}</h3>
          <p class="small">{{t.line}}</p>
          <div style="margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{t.services}}" as="x" hint-placeholder-count="2">
              <span class="chip">{{x}}</span>
            </sc-for>
          </div>
          <a class="link" href="{{t.href}}">Set it up <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</sc-if>

</main>
<dc-import name="Cta" theme="{{theme}}" hint-size="100%,430px"></dc-import>
<dc-import name="Footer" theme="{{theme}}" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"service":{"editor":"json"},"$preview":{"width":1440,"height":2400}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme === 'dark' ? 'dark' : 'light', s: this.props.service || {} };
  }
}
</script>
</body>
</html>
