<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/50a98d2917f323d39577f6eb0dc5de03">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk" data-theme="{{theme}}">
<dc-import name="Header" theme="{{theme}}" hint-size="100%,88px"></dc-import>
<main>

<section class="page-top" style="padding-bottom:clamp(56px,8vw,104px)">
  <div class="container" style="display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,72px);align-items:flex-start">
    <div style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:20px">
      <p class="label">Contact</p>
      <h1 class="h1">Talk to a person.</h1>
      <p class="lede" style="max-width:520px">Questions about Taskiem, a service you need, or putting it inside your own product? Write to us and we will reply.</p>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
        <p class="small" style="font-weight:800;color:var(--ink)">Email</p>
        <p class="small">[YOUR CONTACT EMAIL]</p>
      </div>
      <div class="btn-row" style="margin-top:4px"><a class="btn btn-alt" href="#whatsapp">Chat with Taskiem on WhatsApp</a></div>
    </div>
    <form class="card" style="flex:1 1 400px;min-width:0;border-radius:24px;padding:clamp(24px,3.4vw,40px);gap:20px" onsubmit="return false">
      <div class="field"><label for="c-name">Your name</label><input id="c-name" type="text" autocomplete="name"></div>
      <div class="field"><label for="c-email">Email or phone number</label><input id="c-email" type="text" autocomplete="email"></div>
      <div class="field"><label for="c-msg">How can we help?</label><textarea id="c-msg"></textarea></div>
      <button type="submit" class="btn btn-main" style="align-self:flex-start">Send message</button>
    </form>
  </div>
</section>

</main>
<dc-import name="Cta" theme="{{theme}}" hint-size="100%,430px"></dc-import>
<dc-import name="Footer" theme="{{theme}}" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme === 'dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
