<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closing buttons</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/50a98d2917f323d39577f6eb0dc5de03">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk" data-theme="{{theme}}">
<section class="onpine" style="background:#0d3b2e;color:#ffffff">
  <div class="container" style="padding-top:clamp(72px,10vw,120px);padding-bottom:clamp(72px,10vw,120px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:32px">
    <h2 class="h2" style="font-size:clamp(36px,5.6vw,80px);line-height:1;max-width:900px">Tell Taskiem what to do. Then get on with your day.</h2>
    <div class="btn-row" style="justify-content:center">
      <a class="btn btn-pine-main" href="#whatsapp-chat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
        Chat with Taskiem on WhatsApp
      </a>
      <a class="btn btn-pine-alt" href="#start-web">Start on the web</a>
    </div>
    <p style="font-size:15px;line-height:1.5;color:rgba(255,255,255,.78)">14 days free. No charge per run.</p>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":1440,"height":430}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme === 'dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
