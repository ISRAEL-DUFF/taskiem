{{define "fhead"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>{{.Title}} · {{.Business}}</title>
<link rel="stylesheet" href="{{asset "site.css"}}">
{{end}}

{{define "fbody"}}</head>
<body class="sf accent-{{.Accent}}">
<main class="page sf-form">
{{with .Home}}<p class="sf-back"><a href="{{.}}">{{$.Business}}</a></p>{{end}}{{end}}

{{define "ffoot"}}</main>
<footer class="foot">
<p class="safety">Never enter a password or card PIN on this page.</p>
<p>Powered by Taskiem</p>
</footer>
</body>
</html>
{{end}}
