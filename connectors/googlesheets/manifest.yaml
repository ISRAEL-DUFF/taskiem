# Google Sheets API v4. Built from Google's public documentation, read 6
# October 2026 (developers.google.com/sheets/api now redirects to
# developers.google.com/workspace/sheets/api):
#   https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets.values
#     (get, batchGet, append, update, clear), ValueRenderOption,
#     ValueInputOption, DateTimeRenderOption
#   https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets
#     (create, get, batchUpdate with AddSheetRequest)
#   https://developers.google.com/workspace/sheets/api/limits
#   https://developers.google.com/workspace/sheets/api/troubleshoot-api-errors
#   https://developers.google.com/workspace/sheets/api/scopes
#   https://developers.google.com/identity/protocols/oauth2/service-account
#   https://developers.google.com/identity/protocols/oauth2/web-server
# See docs/integrations/googlesheets.md.
manifest: connector/v1
id: googlesheets
version: 1.0.0
name: Google Sheets
description: Read, append, update and clear ranges, and create spreadsheets and sheets.
category: productivity
auth:
  type: custom
  fields:
    - { key: service_account_json, label: "Service account key (JSON); share each spreadsheet with its client_email", secret: true, required: false }
    - { key: subject, label: "Workspace user to act as (service accounts with domain-wide delegation only)", required: false }
    - { key: client_id, label: OAuth client id (refresh-token connections), required: false }
    - { key: client_secret, label: OAuth client secret, secret: true, required: false }
    - { key: refresh_token, label: OAuth refresh token, secret: true, required: false }
    - { key: scopes, label: "Scopes for service accounts (default https://www.googleapis.com/auth/spreadsheets)", required: false }
base_url: https://sheets.googleapis.com/v4
egress_hosts: [sheets.googleapis.com, oauth2.googleapis.com]
actions:
  get_values:
    title: Read a range
    class: read
    input:
      type: object
      required: [spreadsheet_id, range]
      properties:
        spreadsheet_id:          { type: string, description: From the spreadsheet's URL }
        range:                   { type: string, description: "A1 notation, e.g. Sheet1!A1:D or Sheet1" }
        value_render_option:     { type: string, enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA], description: Default FORMATTED_VALUE }
        date_time_render_option: { type: string, enum: [SERIAL_NUMBER, FORMATTED_STRING] }
        major_dimension:         { type: string, enum: [ROWS, COLUMNS], description: Default ROWS }
        header_row:              { type: boolean, description: "Also return the rows after the first as objects keyed by the first row (ROWS only)" }
    output:
      type: object
      properties: &rangeout
        range:           { type: string }
        major_dimension: { type: string }
        values:          { type: array, items: { type: array }, description: Rows of cells; Google omits trailing empty cells and rows }
        headers:         { type: array, items: { type: string }, description: With header_row }
        objects:         { type: array, items: { type: object }, description: "With header_row: one object per row; missing cells are null" }
  batch_get_values:
    title: Read several ranges
    class: read
    input:
      type: object
      required: [spreadsheet_id, ranges]
      properties:
        spreadsheet_id:          { type: string }
        ranges:                  { type: array, items: { type: string }, minItems: 1 }
        value_render_option:     { type: string, enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA] }
        date_time_render_option: { type: string, enum: [SERIAL_NUMBER, FORMATTED_STRING] }
        major_dimension:         { type: string, enum: [ROWS, COLUMNS] }
        header_row:              { type: boolean }
    output:
      type: object
      properties:
        value_ranges: { type: array, items: { type: object, properties: *rangeout }, description: In the order requested }
  append_rows:
    title: Append rows
    description: >-
      values.append after the table found in range. Not idempotent: Google
      has no key for appends and a repeat adds the rows again, so an append
      whose outcome is unknown (a dropped connection, a 500) is parked for a
      person. Quota refusals (429) prove nothing was written and are
      retried.
    class: unsafe_write
    compensate: null
    input:
      type: object
      required: [spreadsheet_id, range, values]
      properties:
        spreadsheet_id:      { type: string }
        range:               { type: string, description: "Where to look for the table, e.g. Sheet1!A:D" }
        values:              { type: array, items: { type: array }, minItems: 1, description: Rows of cells }
        value_input_option:  { type: string, enum: [RAW, USER_ENTERED], default: RAW, description: "RAW stores text as given (a leading = stays text); USER_ENTERED parses numbers, dates and formulas as if typed" }
        insert_data_option:  { type: string, enum: [INSERT_ROWS, OVERWRITE], default: INSERT_ROWS }
    output:
      type: object
      properties:
        table_range:     { type: string, description: The table found before appending; empty if none }
        updated_range:   { type: string }
        updated_rows:    { type: integer }
        updated_columns: { type: integer }
        updated_cells:   { type: integer }
  update_values:
    title: Write a range
    description: >-
      values.update. Writing the same values to the same range twice leaves
      the same cells, so a retry is safe. request_key is the engine's and is
      not sent.
    class: idempotent_write
    idempotency: { field: request_key, encoding: base32_lower, length: 32 }
    compensate: null
    input:
      type: object
      required: [spreadsheet_id, range, values]
      properties:
        spreadsheet_id:     { type: string }
        range:              { type: string }
        values:             { type: array, items: { type: array } }
        value_input_option: { type: string, enum: [RAW, USER_ENTERED], default: RAW }
        request_key:        { type: string, description: Set by the engine; not sent to Google }
    output:
      type: object
      properties:
        updated_range:   { type: string }
        updated_rows:    { type: integer }
        updated_columns: { type: integer }
        updated_cells:   { type: integer }
  clear_values:
    title: Clear a range
    description: values.clear (values only; formatting stays). Repeating it changes nothing, so a retry is safe.
    class: idempotent_write
    idempotency: { field: request_key, encoding: base32_lower, length: 32 }
    compensate: null
    input:
      type: object
      required: [spreadsheet_id, range]
      properties:
        spreadsheet_id: { type: string }
        range:          { type: string }
        request_key:    { type: string, description: Set by the engine; not sent to Google }
    output:
      type: object
      properties:
        cleared_range: { type: string }
  create_spreadsheet:
    title: Create a spreadsheet
    description: >-
      spreadsheets.create. Not idempotent (a repeat makes a second
      spreadsheet). A service account owns what it creates, in its own
      Drive; share it or use a refresh-token connection.
    class: unsafe_write
    compensate: null
    input:
      type: object
      required: [title]
      properties:
        title:        { type: string }
        sheet_titles: { type: array, items: { type: string }, description: Sheets to create; default one called Sheet1 }
        locale:       { type: string, description: "e.g. en_GB" }
        time_zone:    { type: string, description: "e.g. Africa/Lagos" }
    output:
      type: object
      properties: &spreadsheetout
        spreadsheet_id:  { type: string }
        spreadsheet_url: { type: string }
        title:           { type: string }
        sheets:
          type: array
          items:
            type: object
            properties:
              sheet_id: { type: integer }
              title:    { type: string }
              index:    { type: integer }
  add_sheet:
    title: Add a sheet
    description: >-
      spreadsheets.batchUpdate with addSheet. Not idempotent: a repeat is
      refused because the title exists, which the connector cannot tell
      apart from a clash with an older sheet, so an unknown outcome parks.
    class: unsafe_write
    compensate: null
    input:
      type: object
      required: [spreadsheet_id, title]
      properties:
        spreadsheet_id: { type: string }
        title:          { type: string }
        index:          { type: integer, minimum: 0 }
        row_count:      { type: integer, minimum: 1 }
        column_count:   { type: integer, minimum: 1 }
    output:
      type: object
      properties:
        sheet_id: { type: integer }
        title:    { type: string }
        index:    { type: integer }
  get_spreadsheet:
    title: Get a spreadsheet's sheets
    class: read
    input:
      type: object
      required: [spreadsheet_id]
      properties:
        spreadsheet_id: { type: string }
    output:
      type: object
      properties: *spreadsheetout
