# The inbound email platform connector (docs/email.md): what a workflow
# started by an email does with the files that came with it. It acts on
# Taskiem's own records, for the run's tenant only, and needs no
# connection.
manifest: connector/v1
id: email
version: 1.0.0
name: Email received
category: other
regions: [NG]
auth:
  type: none
actions:
  file_url:
    title: Get a link to an attachment
    description: A short-lived download link for a file that came with the email that started this run (each of trigger.body.attachments is its id, name, type, size and sha256). The file's content never goes into the run.
    class: read
    input:
      type: object
      required: [file]
      properties:
        file:        { type: string, description: "The attachment's id (trigger.body.attachments[0].id)" }
        ttl_minutes: { type: integer, minimum: 1, maximum: 60, default: 15 }
    output:
      type: object
      properties:
        url:        { type: string }
        expires_at: { type: string }
        name:       { type: string }
        type:       { type: string }
        size:       { type: integer }
  send_in_thread:
    title: Email a customer in a conversation
    description: >-
      An email to a customer about one ticket or conversation (thread, such
      as T-1042), from Taskiem's sending address in the business's name.
      Replies come back to this workflow's own address with the thread's
      reply tag and wake the run waiting on email.reply for that thread
      (docs/email.md#threads); mail apps keep the conversation together
      (Reply-To, Message-ID, In-Reply-To, References, and [#T-1042] in the
      subject once). Needs the workflow's email trigger with threads on;
      or, with address, sends from another email workflow of the business
      in the same environment with threads on (a helpdesk address), so a
      ticket opened by a form, WhatsApp or a person is answered by email and
      the customer's replies reach that workflow. Counted and limited per
      recipient like every email Taskiem sends.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [to, subject, message, thread]
      properties:
        to:          { type: string, description: "The customer's email address (trigger.body.from.address)" }
        subject:     { type: string, minLength: 1, maxLength: 180, description: "The subject; [#<thread>] is put before it unless it carries it already" }
        message:     { type: string, minLength: 1, maxLength: 20000, description: The email, in plain text }
        thread:      { type: string, minLength: 1, maxLength: 24, description: "The ticket key (T-1042): letters, digits and single hyphens" }
        in_reply_to: { type: string, description: "The customer's message this answers (trigger.body.message_id); default: the last email sent in the thread" }
        references:  { type: array, maxItems: 20, items: { type: string }, description: "The thread's earlier Message-IDs (trigger.body.references)" }
        address:     { type: string, maxLength: 200, description: "Send from another email workflow's address, whose run gets the replies: its Taskiem email address (trigger.email.address) or its workflow id. It must have threads on and be of this business and environment. Default: this workflow's own address" }
    output:
      type: object
      properties:
        message_id:  { type: string, description: "The Message-ID it is sent with, without brackets: the same on a retry" }
        thread:      { type: string, description: "The ticket key, in capitals: the email.reply signal's correlation" }
        reply_to:    { type: string, description: The thread's reply address }
        subject:     { type: string }
        in_reply_to: { type: string }
        references:  { type: array, items: { type: string } }
    pii:
      - { field: input.to, category: email }
      - { field: input.subject, category: other }
      - { field: input.message, category: other }
      - { field: output.subject, category: other }
