manifest: connector/v1
id: postgres
version: 1.0.0
name: PostgreSQL
description: Query and update a PostgreSQL database.
category: database
auth:
  type: custom
  fields:
    - { key: host, label: Host }
    - { key: port, label: Port, required: false }
    - { key: database, label: Database }
    - { key: user, label: User }
    - { key: password, label: Password, secret: true, required: false }
    - { key: sslmode, label: "SSL mode (verify-full by default; verify-ca, require, disable)", required: false }
  test: { action: query }
egress_hosts: ["${connection.host}"]
actions:
  query:
    title: Run a read-only query
    description: Runs in a READ ONLY transaction with a statement timeout; at most max_rows rows are returned.
    class: read
    input:
      type: object
      required: [sql]
      properties:
        sql:      { type: string }
        params:   { type: array }
        max_rows: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
    output:
      type: object
      properties:
        rows:      { type: array }
        row_count: { type: integer }
        truncated: { type: boolean }
    pii:
      - { field: output.rows, category: other }
  execute:
    title: Run a statement that changes data
    description: Without a key the database cannot deduplicate, so an unknown outcome parks the step. Make statements idempotent where you can (for example INSERT ... ON CONFLICT DO NOTHING).
    class: unsafe_write
    input:
      type: object
      required: [sql]
      properties:
        sql:    { type: string }
        params: { type: array }
    output:
      type: object
      properties:
        rows_affected: { type: integer }
