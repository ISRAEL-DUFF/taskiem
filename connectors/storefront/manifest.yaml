# The storefront platform connector (docs/storefronts.md): what workflows do
# with the organisation's storefront orders. It acts on Taskiem's own
# records, for the run's tenant only, and needs no connection.
manifest: connector/v1
id: storefront
version: 1.0.0
name: Storefront
category: other
regions: [NG]
auth:
  type: none
actions:
  decide:
    title: Accept, decline or complete an order or booking
    description: Moves the order or booking from the storefront form that started the run. Accepting lowers the stock where the catalogue tracks it; declining one already paid leaves it refund_due; no_show marks a booking the customer did not come to. Declining or cancelling a booking frees its time.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [reference, decision]
      properties:
        reference: { type: string, description: The order's reference (trigger.body.reference) }
        decision:  { type: string, enum: [accept, decline, complete, cancel, no_show] }
        note:      { type: string, description: Why, kept on the order }
    output:
      type: object
      properties:
        reference:  { type: string }
        status:     { type: string }
        refund_due: { type: boolean }
        total:      { type: string }
        short:      { type: array, items: { type: string }, description: "On accept, the items there was too little stock of (stock is lowered to zero)" }
  payment_link:
    title: Make the order's payment link
    description: A payment page for an accepted order the customer pays after acceptance; the run can then wait for the storefront.payment signal. On an order paid before it asks for more (a deposit's balance, an instalment), amount_kobo or the balance, as a new step with its own page; the signal then says what the step asked and what is left.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
        amount_kobo: { type: integer, minimum: 100, description: "On an order paid before: what this step asks, at most the balance; left out, the balance" }
    output:
      type: object
      properties:
        reference:    { type: string }
        url:          { type: string }
        total:        { type: string }
        amount_kobo:  { type: integer }
        balance_kobo: { type: integer }
  notify_customer:
    title: Message the customer
    description: An SMS to the customer, and an email when they gave one, from the business's name. The recipient is the order's customer, never an address in the input.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
        text:      { type: string, maxLength: 1000, description: "The message; an SMS starts with the business's name and is at most three parts. {link} becomes the customer's status link, where a booking is moved or cancelled" }
        say:       { type: string, description: "Instead of text: one of Taskiem's customer messages (order_confirmed_pickup, booking_confirmed, deposit_received, balance_due…), in the business's own language" }
        vars:      { type: object, description: "With say: the message's values (reference, total, url, service, when, amount, balance)" }
        subject:   { type: string, description: The email's subject }
    output:
      type: object
      properties:
        reference: { type: string }
        queued:    { type: array, items: { type: string } }
  refund:
    title: Refund the customer
    description: Refunds a paid order or booking that was declined or cancelled (refund_due) in full, through the business's Paystack connection, and tells the customer. Put an approval before it so the owner confirms. A refund Paystack refuses (too little balance) fails the step and leaves the order refund due with the reason. One paid by bank transfer (or by money matched to it) cannot be sent back by Taskiem; by_hand is true, note says what to do, and it stays refund due until the owner marks it refunded.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
    output:
      type: object
      properties:
        reference: { type: string }
        status:    { type: string }
        total:     { type: string }
        by_hand:   { type: boolean, description: True when the owner refunds it from their bank and marks it refunded }
        note:      { type: string }
  mark_returned:
    title: Mark a hire returned
    description: Ends a hire (fronts F5) when its items are back, freeing them for other dates. Put an approval before it so the owner says they are back. Back after the day it was due, the hire's late fee for each day late is added to what is owed; balance_kobo is then what is left, for a payment_link step to ask. Marking it again changes nothing.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
    output:
      type: object
      properties:
        reference:     { type: string }
        late_days:     { type: integer }
        late_fee_kobo: { type: integer }
        late_fee:      { type: string }
        balance_kobo:  { type: integer }
        balance:       { type: string }
  issue_tickets:
    title: Issue tickets
    description: Makes a paid ticket order's codes (fronts F6), one per seat, the order's reference and the seat (AK-7QX4KD-2), to send to the customer; they are checked in at the door with `check in <code>` in chat. Asked again, it gives the same codes. A refunded or cancelled order's codes do not check in.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
    output:
      type: object
      properties:
        reference: { type: string }
        count:     { type: integer }
        codes:     { type: string }
        event:     { type: string }
        when:      { type: string }
  offer_place:
    title: Offer a waiting-list place
    description: Gives a name on a full class's waiting list its place when one is free (fronts F6), taken as a place on the page is, so two offers cannot both take the last one. The order becomes accepted and paid after acceptance, for a payment_link step. Still full, the step fails.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
    output:
      type: object
      properties:
        reference:  { type: string }
        status:     { type: string }
        total_kobo: { type: integer }
        total:      { type: string }
  get_booking:
    title: Read a booking
    description: The booking's status, service and time, when its reminders fall, and its payment page. A booking moved by the customer or the owner starts a new run, so a run's times are the booking's.
    class: read
    input:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
    output:
      type: object
      properties:
        reference:       { type: string }
        status:          { type: string }
        service:         { type: string }
        service_id:      { type: string }
        starts_at:       { type: string, description: RFC 3339 in Lagos time }
        ends_at:         { type: string }
        when:            { type: string, description: "As customers read it: Sat 24 Oct, 10:30" }
        auto_confirm:    { type: boolean }
        remind_day_at:   { type: string, description: A day before the start, or now when that has passed }
        remind_day:      { type: boolean, description: Whether the day-before reminder is still to come }
        remind_hours_at: { type: string, description: Two hours before the start, or now when that has passed }
        remind_hours:    { type: boolean }
        payment_url:     { type: string }
        total:           { type: string }
        deposit_kobo:    { type: integer }
        paid:            { type: boolean }
