# iswallet (iSpend's wallet platform): the wallet and payment provider for
# iSpend and the businesses it serves. Built from iswallet engineering's answers of
# 5 and 12 October 2026 (docs/integrations/iswallet.md). Customers'
# account numbers and their credits (schools B0) follow iswallet's
# OpenAPI, read 23 October 2026 at
# https://synledger.name.ng/iwallet/openapi.json (served as
# /iwallet/docs/doc.json): "Bulk-issue virtual accounts" and "List
# transactions" (docs/spec/schools-rail-facts.md). Issuing, wallets,
# providers and the credit webhook's fields follow iswallet's guide of 27
# October 2026 (docs/spec/iswallet-account-numbers.md).
manifest: connector/v1
id: iswallet
version: 1.5.0
name: iswallet
description: Wallet-to-wallet transfers, bank payouts, balances, wallets, customers' account numbers and wallet events on iswallet.
category: payments
kind: rail
regions: [NG]
auth:
  type: api_key
  fields:
    - { key: api_key, label: API key (client scope), secret: true }
    # Taskiem subscribes each connection itself and keeps the secret iswallet
    # returns; this is for a subscription made by hand instead.
    - { key: webhook_secret, label: "Webhook signing secret, only for a subscription made by hand", secret: true, required: false }
    # A client key reaches every wallet of the client. When one client is
    # shared by several customers (a partner's sub-tenants), wallet_ids
    # limits the connection to the customer's own wallets (decision 0031).
    - { key: wallet_ids, label: Wallets this connection may use (comma-separated wallet ids), required: false }
    - { key: shared_client, label: "Shared client: true when the key also reaches other customers' wallets (then wallet_ids is required)", required: false }
  # Live and test are separate hosts with separate keys (rule 17):
  # production at ispend.name.ng, the sandbox at synledger.name.ng (iswallet,
  # 26 October 2026); both serve /v1/... under /iwallet.
  # TASKIEM_ISWALLET_URL and TASKIEM_ISWALLET_TEST_URL move them.
  modes:
    - { mode: live, label: Live (real money), base_url: https://ispend.name.ng/iwallet }
    - { mode: test, label: Test (practice), base_url: https://synledger.name.ng/iwallet }
  # The key works, and which partners can issue account numbers.
  test: { action: list_providers }
# 100 requests a minute per API key (client scope).
rate_limit: { requests: 100, per: 1m, scope: connection }
# Where connections made before modes go: the sandbox, or
# TASKIEM_ISWALLET_URL when it is set.
base_url: https://synledger.name.ng/iwallet
actions:
  get_balance:
    title: Get wallet balance
    class: read
    input:
      type: object
      required: [wallet_id]
      properties:
        wallet_id: { type: string }
    output:
      type: object
      properties:
        wallet_id: { type: string }
        balances:
          type: array
          description: One entry per currency held; a currency with no balance is absent.
          items:
            type: object
            properties:
              currency:  { type: string }
              total:     { type: integer, description: Minor units, including money committed to pending payouts }
              available: { type: integer, description: Minor units that can be spent now }
              pending:   { type: integer }
              scale:     { type: integer, description: Decimal places of the minor unit (NGN 2) }
  transfer:
    title: Transfer between wallets
    description: Same client, same currency. Final when it returns; no fee; does not use the daily limit.
    class: idempotent_write
    idempotency:
      field: header:Idempotency-Key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { max_length: 255 }
    # Undo with a transfer the other way, under its own key.
    compensate: transfer
    input:
      type: object
      required: [from_wallet_id, to_wallet_id, amount]
      properties:
        from_wallet_id: { type: string }
        to_wallet_id:   { type: string }
        amount:         { type: integer, minimum: 1, description: Minor units (kobo for NGN) }
        currency:       { type: string, default: NGN }
        narration:      { type: string, maxLength: 255 }
    output:
      type: object
      properties:
        transfer_id:  { type: string }
        txn_id:       { type: string }
        status:       { type: string, enum: [completed] }
        amount:       { type: integer }
        currency:     { type: string }
        completed_at: { type: string }
  payout:
    title: Pay out to a bank account
    description: >-
      NGN bank payout over NIP. Returns pending; the outcome arrives as an
      outflow_event (correlation: outflow_id). The wallet is debited amount + fee.
      A confirmed payout cannot be undone.
    class: idempotent_write
    idempotency:
      field: header:Idempotency-Key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { max_length: 255 }
    compensate: null
    input:
      type: object
      required: [wallet_id, amount, bank_code, account_number, account_name]
      properties:
        wallet_id:      { type: string }
        amount:         { type: integer, minimum: 1, description: Kobo }
        narration:      { type: string, maxLength: 255 }
        bank_code:      { type: string, description: From list_banks }
        account_number: { type: string }
        account_name:   { type: string, description: As returned by name_enquiry }
        metadata:       { type: object, description: Echoed back on reads }
    output:
      type: object
      properties:
        outflow_id:         { type: string, description: The handle for get_payout and outflow events }
        status:             { type: string, enum: [pending, confirmed, failed, reversed, unresolved, resolved] }
        amount:             { type: integer }
        fee:                { type: integer, description: Charged on top of amount }
        net_amount:         { type: integer }
        provider_reference: { type: string, description: Empty when the provider's answer is not yet known }
        idempotency_key:    { type: string }
    pii:
      - { field: account_number, category: account_number }
      - { field: account_name, category: name }
  get_payout:
    title: Get payout status
    class: read
    input:
      type: object
      required: [outflow_id]
      properties:
        outflow_id: { type: string }
    output:
      type: object
      properties:
        outflow_id:   { type: string }
        wallet_id:    { type: string, description: The wallet the payout was debited from }
        status:       { type: string, enum: [pending, confirmed, failed, reversed, unresolved, resolved] }
        amount:       { type: integer }
        fee:          { type: integer }
        confirmed_at: { type: string }
  name_enquiry:
    title: Resolve account name
    description: Call before paying a new account; a payout to the wrong valid account cannot be recovered.
    class: read
    input:
      type: object
      required: [bank_code, account_number]
      properties:
        bank_code:      { type: string }
        account_number: { type: string }
    output:
      type: object
      properties:
        account_name:   { type: string }
        account_number: { type: string }
        bank_code:      { type: string }
    pii:
      - { field: account_number, category: account_number }
      - { field: output.account_name, category: name }
      - { field: output.account_number, category: account_number }
  list_banks:
    title: List banks
    class: read
    input: { type: object, properties: {} }
    output:
      type: object
      properties:
        banks: { type: array, items: { type: object } }
  issue_virtual_account:
    title: Issue a customer's account number
    description: >-
      A permanent account number (NUBAN) on a wallet, one per reference
      (POST /v1/wallets/{id}/virtual-account, type permanent). iswallet
      answers the account already issued for a reference again, so a
      resend never opens a second. Every wallet needs an email, and a
      business wallet its director's BVN, first (KYC_REQUIRED otherwise,
      naming the field). Transfers into it credit the wallet; the partner's
      fee is passed to the payer by default.
    class: idempotent_write
    idempotency:
      field: reference
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      # iswallet documents no limit for a reference; its own example is
      # "pgdock:org:4471". Ours stay short and plain.
      limits: { max_length: 64, charset: "a-z0-9_" }
    compensate: null
    input:
      type: object
      required: [wallet_id]
      properties:
        wallet_id:    { type: string, description: The wallet the number pays into }
        account_name: { type: string, description: What a payer's bank shows when it resolves the number }
        reference:    { type: string }
        provider:     { type: string, description: "A partner from list_providers; iswallet chooses when it is left out" }
    output:
      type: object
      properties:
        wallet_id:      { type: string }
        reference:      { type: string, description: The account's reference; its credits carry it (virtual_account.reference) }
        account_number: { type: string }
        account_name:   { type: string }
        bank_name:      { type: string }
        status:         { type: string, description: "iswallet's status for the account (active)" }
        request_id:     { type: string, description: "iswallet's X-Request-ID for the call, for a report to iswallet" }
    pii:
      - { field: account_name, category: name }
      - { field: output.account_name, category: name }
      - { field: output.account_number, category: account_number }
  issue_virtual_accounts:
    title: Issue many customers' account numbers
    description: >-
      Up to 500 permanent account numbers on one wallet in one call (POST
      /v1/wallets/{id}/virtual-accounts/batch), for an enrolment sitting.
      Idempotent per reference, so running it again after a partial failure
      is safe; each account has its own result (created, existing or failed,
      with iswallet's error code).
    class: idempotent_write
    idempotency:
      field: header:Idempotency-Key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { max_length: 255 }
    compensate: null
    input:
      type: object
      required: [wallet_id, accounts]
      properties:
        wallet_id: { type: string }
        accounts:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [reference]
            properties:
              reference:    { type: string, maxLength: 64 }
              account_name: { type: string }
    output:
      type: object
      properties:
        wallet_id: { type: string }
        created:   { type: integer }
        existing:  { type: integer }
        failed:    { type: integer }
        accounts:  { type: array, items: { type: object }, description: "One per account: reference, status (created, existing, failed), account_number, account_name, bank_name, error_code, error_message" }
        request_id: { type: string }
    pii:
      - { field: accounts, category: name }
      - { field: output.accounts, category: account_number }
  create_dynamic_account:
    title: Open an account number for one payment
    description: >-
      A one-time account number (POST /v1/wallets/{id}/virtual-account, type
      dynamic) for one amount, on the connection's wallet (its wallet_ids
      must list exactly one). Every call opens another account, so the
      action is unsafe: an unknown outcome parks rather than risk two.
      iswallet's 30-minute expiry is advisory (it refuses neither a late
      payment nor a second one), so expires_at is Taskiem's own window. The
      payment arrives as wallet.credit.posted carrying the reference
      (tot_ and the step's key).
    class: unsafe_write
    # The key is the reference, and tot_ marks a one-time number: the
    # invoice records the payment id before asking, so money paid in is
    # found even when the answer is lost. Not a promise of idempotency:
    # iswallet opens another account on every call.
    idempotency:
      field: reference
      encoding: base32_lower
      length: 32
      prefix: "tot_"
      limits: { max_length: 64, charset: "a-z0-9_" }
    compensate: null
    input:
      type: object
      required: [amount]
      properties:
        reference:       { type: string }
        amount:          { type: integer, minimum: 1, description: Kobo }
        account_name:    { type: string, description: What a payer's bank shows when it resolves the number }
        expires_minutes: { type: integer, minimum: 1, maximum: 1440 }
    output:
      type: object
      properties:
        wallet_id:      { type: string }
        reference:      { type: string, description: The step's key; the payment's credit event carries it }
        account_number: { type: string }
        account_name:   { type: string }
        bank_name:      { type: string }
        amount:         { type: integer, description: Kobo }
        expires_at:     { type: string, description: "RFC 3339: Taskiem's window, counted from when the request was sent" }
        request_id:     { type: string }
    pii:
      - { field: account_name, category: name }
      - { field: output.account_name, category: name }
      - { field: output.account_number, category: account_number }
  list_providers:
    title: List the partners that issue account numbers
    description: GET /v1/providers. Also the connection's check that its key works.
    class: read
    input: { type: object, properties: {} }
    output:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              code:       { type: string }
              currencies: { type: array, items: { type: string } }
              permanent:  { type: boolean, description: Can issue permanent accounts }
              dynamic:    { type: boolean, description: Can issue one-time accounts }
        request_id: { type: string }
  create_wallet:
    title: Create a wallet
    description: >-
      A wallet for a customer or a business (POST /v1/wallets), one per
      owner_ref and currency. Identity fields are flat, never a kyc_profile.
      Every wallet needs an email; a business wallet its director's BVN
      before it can issue account numbers. The wallet-level number iswallet
      answers is its own handle and nobody can pay into it, so it is not
      returned: internal_reference is. A retry with the same key never
      makes a second wallet.
    class: idempotent_write
    idempotency:
      field: header:Idempotency-Key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { max_length: 255 }
    compensate: null
    input:
      type: object
      required: [owner_type, owner_ref]
      properties:
        owner_type:
          type: string
          enum: [client_end_user, client_end_user_business, client_end_business]
          description: "An individual; a business holding other people's money (a school's fees), its own segregated account; a business holding only its own money, pooled"
        owner_ref:      { type: string, description: "Taskiem's key for the owner (tenant:<id> for a business's own wallet)" }
        currency:       { type: string, default: NGN }
        email:          { type: string }
        business_email: { type: string }
        bvn:            { type: string, description: The director's BVN, for a business wallet }
        first_name:     { type: string }
        last_name:      { type: string }
        business_name:  { type: string }
    output:
      type: object
      properties:
        wallet_id:          { type: string }
        internal_reference: { type: string, description: "iswallet's handle for the wallet; not an account number anyone can pay into" }
        tier:               { type: string }
        owner_type:         { type: string }
        request_id:         { type: string }
    pii:
      - { field: email, category: email }
      - { field: business_email, category: email }
      - { field: bvn, category: bvn }
      - { field: first_name, category: name }
      - { field: last_name, category: name }
  list_transactions:
    title: List a wallet's transactions
    description: >-
      Every transaction of a wallet in a window (GET /v1/wallets/{id}/transactions,
      100 a page, every page up to 2,000; truncated beyond). A credit into a
      customer's account number names it (virtual_account) and carries the
      provider_reference its webhook carries.
    class: read
    input:
      type: object
      required: [wallet_id, from]
      properties:
        wallet_id: { type: string }
        from:      { type: string, format: date-time }
        to:        { type: string, format: date-time }
    output:
      type: object
      properties:
        wallet_id:    { type: string }
        transactions: { type: array, items: { type: object }, description: "iswallet's transaction items: txn_id, type, direction, status, amount (the ledger movement), amount_credited, fee, fee_charged (the provider's), currency, narration, occurred_at, confirmed_at, provider_reference, counterparty, virtual_account" }
        truncated:    { type: boolean }
    pii:
      - { field: output.transactions, category: other }
triggers:
  outflow_event:
    type: webhook
    title: Payouts
    where: "Taskiem subscribes this connection itself; a subscription made by hand instead needs its signing secret on this connection"
    # One subscription per connection and environment, made through
    # iswallet's API when the connection is (docs/spec/iswallet-account-numbers.md I7).
    registration: connection
    verify: { scheme: hmac_sha256_timestamped, header: X-iSpend-Signature, timestamp_header: X-iSpend-Timestamp, tolerance: 5m, secret_field: webhook_secret }
    events: [wallet.outflow.confirmed, wallet.outflow.failed, wallet.outflow.reversed]
    event_type: =body.event_type
    dedup: =body.id
    correlation: =body.data.outflow_id
    # A partner holding the client's one subscription delivers each event
    # into the sub-tenants whose connection lists the wallet (decision 0031).
    route: { key: =body.wallet_id, field: wallet_ids }
  credit_event:
    type: webhook
    registration: connection
    verify: { scheme: hmac_sha256_timestamped, header: X-iSpend-Signature, timestamp_header: X-iSpend-Timestamp, tolerance: 5m, secret_field: webhook_secret }
    events: [wallet.credit.posted, wallet.credit.reversed, wallet.credit.rejected]
    event_type: =body.event_type
    # By movement rather than envelope, as iswallet advises (12 October
    # 2026): two events for one movement are then one event here. An
    # event naming no movement is kept once by the delivery key every
    # retry of it carries (X-iSpend-Idempotency-Key, 27 October), else its
    # envelope id.
    dedup: >-
      =has(body.data) && has(body.data.txn_id) ? body.event_type + ":" + body.data.txn_id + ":" + body.wallet_id
      : has(body.data) && has(body.data.provider_reference) && body.data.provider_reference != '' ? body.event_type + ":" + body.data.provider_reference + ":" + body.wallet_id
      : "x-ispend-idempotency-key" in headers ? string(headers["x-ispend-idempotency-key"]) : body.id
    # What its event names: a credit by its account's reference (a
    # one-time number's payment too), a reversed credit by its
    # provider_reference; any other by its wallet.
    correlation: >-
      =!has(body.data) || !has(body.data.virtual_account) || !has(body.data.virtual_account.reference) || body.data.virtual_account.reference == '' ? body.wallet_id
      : body.event_type == 'wallet.credit.reversed' && !string(body.data.virtual_account.reference).startsWith('tot_') ? (has(body.data.provider_reference) && body.data.provider_reference != '' ? string(body.data.provider_reference) : body.wallet_id)
      : string(body.data.virtual_account.reference)
    route: { key: =body.wallet_id, field: wallet_ids }
  transfer_event:
    type: webhook
    registration: connection
    verify: { scheme: hmac_sha256_timestamped, header: X-iSpend-Signature, timestamp_header: X-iSpend-Timestamp, tolerance: 5m, secret_field: webhook_secret }
    events: [wallet.transfer.completed, wallet.transfer.failed]
    event_type: =body.event_type
    # A completed transfer fires once per side, both with the same txn_id:
    # the wallet is part of the key, or one side's event would be dropped.
    dedup: '=has(body.data) && has(body.data.txn_id) ? body.event_type + ":" + body.data.txn_id + ":" + body.wallet_id : body.id'
    correlation: =body.wallet_id
    # Fires once per side, each with its own wallet_id: each side reaches
    # the sub-tenant that holds that wallet.
    route: { key: =body.wallet_id, field: wallet_ids }
# What iswallet can do in Taskiem's words (rule 16, schemas/capabilities-v1.json).
# Money moves from a named wallet: account and source are required here.
capabilities:
  balance:
    action: get_balance
    input: { wallet_id: "=input.account" }
    output:
      available_kobo: "=sum(output.balances.filter(b, b.currency == input.currency).map(b, b.available))"
      currency: "=input.currency"
    requires: [account]
  resolve_account:
    action: name_enquiry
    input: { bank_code: "=input.bank_code", account_number: "=input.account_number" }
    output: { account_name: "=output.account_name" }
  pay_bank:
    action: payout
    input:
      wallet_id: "=input.source"
      amount: "=input.amount_kobo"
      bank_code: "=input.bank_code"
      account_number: "=input.account_number"
      account_name: "=input.account_name"
      narration: "=input.narration"
    output:
      payout_id: "=output.outflow_id"
      status: "=output.status == 'confirmed' ? 'settled' : output.status in ['failed', 'reversed'] ? 'failed' : 'pending'"
      fee_kobo: "=output.?fee"
    requires: [source]
    fixed: { currency: NGN }
    settles_by: { trigger: outflow_event, lookup: get_payout }
  pay_wallet:
    # Final when it returns, with no fee.
    action: transfer
    input:
      from_wallet_id: "=input.source"
      to_wallet_id: "=input.wallet_id"
      amount: "=input.amount_kobo"
      currency: "=input.currency"
      narration: "=input.narration"
    output: { payout_id: "=output.transfer_id", status: settled, fee_kobo: 0 }
    requires: [source]
  get_payout:
    action: get_payout
    input: { outflow_id: "=input.payout_id" }
    output:
      # unresolved and resolved are iswallet's operations at work on it: pending until it says confirmed or failed.
      status: "=output.status == 'confirmed' ? 'settled' : output.status == 'reversed' ? 'reversed' : output.status == 'failed' ? 'failed' : 'pending'"
      reason: "=output.status in ['unresolved', 'resolved'] ? optional.of(output.status) : optional.none()"
      settled_at: "=output.?confirmed_at"
      fee_kobo: "=output.?fee"
  virtual_account:
    # A permanent number on the named wallet (account). iswallet's partner
    # names the account; the name asked for is sent, but may not be shown.
    action: issue_virtual_account
    input:
      wallet_id: "=input.account"
      account_name: "=input.?account_name.orValue(input.customer.name)"
    output:
      account_number: "=output.account_number"
      bank_name: "=output.bank_name"
      account_name: "=output.?account_name"
      reference: "=output.reference"
    requires: [account]
    ignores: [customer.email, customer.phone, customer.bvn, customer.nin]
    notes: >-
      Every wallet needs an email, and a business wallet its director's BVN, before it can
      issue (KYC_REQUIRED names the missing field). The partner's fee (1.4%, capped at
      NGN 2,000) is passed to the payer by default: the credit event says what the payer sent
      and what landed. Credits arrive by webhook (virtual_account.credited) and are read back
      with list_credits.
  collect_transfer:
    # A one-time number on the connection's one wallet, for an invoice.
    action: create_dynamic_account
    input:
      amount: =input.amount_kobo
      account_name: =input.customer.?name
      expires_minutes: =input.?expires_minutes
    output:
      payment_id: =output.reference
      account_number: =output.account_number
      bank_name: =output.bank_name
      account_name: =output.?account_name
      amount_kobo: =output.amount
      expires_at: =output.expires_at
    ignores: [customer.email, customer.phone, customer.bvn, customer.nin, description]
    fixed: { currency: NGN }
    unsafe: true
    transfer: { on_late: credited, on_wrong_amount: unknown, min_minutes: 1, max_minutes: 1440, default_minutes: 60 }
    notes: >-
      Opened on the connection's wallet, so its wallet_ids must list exactly one. iswallet's
      expiry is advisory: it refuses neither a late transfer nor a second one, so the window
      is Taskiem's and a late transfer is credited. Every call opens another account: an
      unknown outcome parks for a person.
  list_credits:
    # Credits into customers' numbers, from the wallet's transactions:
    # those that name a virtual account. amount (on this route the ledger
    # movement) is not used: amount_credited is what landed and fee_charged
    # the provider's fee, when disclosed, so what the payer sent is their
    # sum; without fee_charged only what landed is known. provider_reference
    # is "the SAME id the credit webhook carries" (iswallet's OpenAPI).
    action: list_transactions
    input: { wallet_id: "=input.account", from: "=input.since", to: "=input.?until" }
    output:
      credits: >-
        =output.transactions.filter(t, has(t.virtual_account) && has(t.virtual_account.reference) && t.virtual_account.reference != ''
        && has(t.provider_reference) && t.provider_reference != '' && has(t.amount_credited))
        .map(t, {'reference': t.virtual_account.reference, 'credit_id': t.provider_reference,
        'amount_kobo': int(t.amount_credited) + (has(t.fee_charged) ? int(t.fee_charged) : 0),
        'settled_kobo': int(t.amount_credited), ?'fee_kobo': t.?fee_charged, ?'currency': t.?currency,
        ?'account_number': t.virtual_account.?account_number,
        ?'payer_name': has(t.counterparty) ? t.counterparty.?name : optional.none(),
        ?'payer_account': has(t.counterparty) ? t.counterparty.?account_number : optional.none(),
        ?'payer_bank': has(t.counterparty) ? t.counterparty.?bank_name : optional.none(),
        ?'narration': t.?narration, ?'occurred_at': t.?occurred_at})
      truncated: "=output.?truncated"
    requires: [account]
events:
  virtual_account.credited:
    # A transfer into a customer's permanent number (27 October 2026):
    # data.virtual_account.reference is ours, data.amount what the payer
    # sent and data.amount_credited what landed. credit_id is the
    # provider_reference list_credits reads back, so a credit heard here
    # and read back is one entry; an event without one is left to the
    # look-back. A one-time number's credit (tot_) is payment.received.
    trigger: credit_event
    when: >-
      =body.event_type == 'wallet.credit.posted' && has(body.data.virtual_account) && has(body.data.virtual_account.reference)
      && body.data.virtual_account.reference != '' && !string(body.data.virtual_account.reference).startsWith('tot_')
      && has(body.data.provider_reference) && body.data.provider_reference != '' && has(body.data.amount)
    fields:
      reference: =body.data.virtual_account.reference
      credit_id: =body.data.provider_reference
      amount_kobo: =int(body.data.amount)
      settled_kobo: "=has(body.data.amount_credited) ? optional.of(int(body.data.amount_credited)) : optional.none()"
      fee_kobo: "=has(body.data.amount_credited) ? optional.of(int(body.data.amount) - int(body.data.amount_credited)) : optional.none()"
      currency: =body.data.?currency
      account_number: =body.data.virtual_account.?account_number
      payer_name: "=has(body.data.counterparty) ? body.data.counterparty.?name : optional.none()"
      payer_account: "=has(body.data.counterparty) ? body.data.counterparty.?account_number : optional.none()"
      payer_bank: "=has(body.data.counterparty) ? body.data.counterparty.?bank_name : optional.none()"
      narration: =body.data.?narration
      occurred_at: =body.data.?occurred_at.orValue(body.?occurred_at.orValue(''))
  payment.received:
    # The payment into a one-time number (create_dynamic_account), by the
    # reference that opened it.
    trigger: credit_event
    when: >-
      =body.event_type == 'wallet.credit.posted' && has(body.data.virtual_account) && has(body.data.virtual_account.reference)
      && string(body.data.virtual_account.reference).startsWith('tot_') && has(body.data.amount)
    fields:
      payment_id: =body.data.virtual_account.reference
      amount_kobo: =int(body.data.amount)
      currency: =body.data.?currency
      paid_at: =body.data.?occurred_at.orValue(body.?occurred_at.orValue(''))
  payment.returned:
    # A credit iswallet clawed back: the money log undoes what it counted
    # towards (engine/matching), finding the credit by its credit_id, or a
    # one-time number's payment by its reference.
    trigger: credit_event
    when: >-
      =body.event_type == 'wallet.credit.reversed' && has(body.data.virtual_account) && has(body.data.virtual_account.reference)
      && (string(body.data.virtual_account.reference).startsWith('tot_') || has(body.data.provider_reference) && body.data.provider_reference != '')
    fields:
      payment_id: "=string(body.data.virtual_account.reference).startsWith('tot_') ? body.data.virtual_account.reference : body.data.provider_reference"
      amount_kobo: "=has(body.data.amount) ? optional.of(int(body.data.amount)) : optional.none()"
      reason: other
  payout.settled:
    trigger: outflow_event
    when: "=body.event_type == 'wallet.outflow.confirmed'"
    fields: { payout_id: "=body.data.outflow_id", amount_kobo: "=body.data.?amount" }
  payout.failed:
    trigger: outflow_event
    when: "=body.event_type == 'wallet.outflow.failed'"
    fields: { payout_id: "=body.data.outflow_id", reason: "=body.data.?reason" }
  payout.reversed:
    trigger: outflow_event
    when: "=body.event_type == 'wallet.outflow.reversed'"
    fields: { payout_id: "=body.data.outflow_id", reason: "=body.data.?reason" }
