# A business's customer assistant (docs/assistant-guard.md, decision 0062
# V6): what a workflow answering customers does besides talking. Acts for
# the run's organisation and needs no connection. channel and sender are a
# guarded trigger's (trigger.guard.channel, trigger.guard.sender).
manifest: connector/v1
id: assistant
version: 1.0.0
name: Customer assistant
category: other
regions: [NG]
auth:
  type: none
actions:
  check_reply:
    title: Check a reply before it is sent
    description: >-
      Checks what the model wrote before it reaches a customer: nothing
      left of a mask or a marker ([[phone_1]], {{...}}, the material's
      quotes); no price, link, or promise (free, a discount, a refund) that
      the material does not state (what the customer asked for never counts);
      no phone number or email that neither the material nor the customer
      gave; nothing shaped like a key; none of the values never to say; and
      not too long. Amounts spelled out in words and other customers' names
      are not seen: offer a person when unsure. ok false answers, as text, a fixed
      answer in the customer's language ("Let me check that with the team
      and get back to you") to send instead, with the problems found.
    class: read
    input:
      type: object
      required: [text]
      properties:
        text:     { type: string, maxLength: 20000, description: The reply }
        material: { type: string, maxLength: 60000, description: "What the model answered from (knowledge@1 search's material)" }
        customer: { type: string, maxLength: 20000, description: "What the customer wrote or said (trigger.guard.text, or the transcript)" }
        links:    { type: array, items: { type: string }, maxItems: 50, description: "Links the business allows besides those in the material (its storefront, its website)" }
        never:    { type: array, items: { type: string }, maxItems: 200, description: "Values never said to a customer (cost prices, staff numbers)" }
        max:      { type: integer, minimum: 100, maximum: 20000, default: 4000, description: The longest reply in characters }
        language: { type: string, description: "The language of the held answer (trigger.guard.language)" }
    output:
      type: object
      properties:
        ok:       { type: boolean }
        text:     { type: string, description: The reply to send (the held answer when ok is false) }
        problems:
          type: array
          items:
            type: object
            properties:
              kind:   { type: string, enum: [empty, placeholder, too_long, price, promise, link, contact, secret, internal] }
              detail: { type: string }
    pii:
      - { field: text, category: other }
      - { field: customer, category: other }
      - { field: never, category: other }
      - { field: output.text, category: other }
      - { field: output.problems, category: other }
  hand_over:
    title: Hand a customer to a person
    description: >-
      The assistant stays quiet for this customer for hours (it keeps their
      messages, and trigger.guard.outcome is quiet), and the owners are
      told to answer them. For when the model is unsure or the customer is
      upset; a customer can also ask by writing PERSON.
    class: idempotent_write
    idempotency: { field: "header:X-Taskiem-Idempotency-Key", encoding: base32_lower, length: 32 }
    compensate: null
    input:
      type: object
      required: [channel, sender]
      properties:
        channel: { type: string, description: trigger.guard.channel }
        sender:  { type: string, description: trigger.guard.sender }
        hours:   { type: integer, minimum: 1, maximum: 168, default: 24 }
    output:
      type: object
      properties:
        until: { type: string, description: When the assistant answers them again }
    pii:
      - { field: sender, category: other }
  resume:
    title: Answer a customer again
    description: Ends a hand-over to a person, so the assistant answers the customer again.
    class: idempotent_write
    idempotency: { field: "header:X-Taskiem-Idempotency-Key", encoding: base32_lower, length: 32 }
    compensate: null
    input:
      type: object
      required: [channel, sender]
      properties:
        channel: { type: string }
        sender:  { type: string }
    output:
      type: object
      properties:
        resumed: { type: boolean }
    pii:
      - { field: sender, category: other }
  window:
    title: Can the business still write to them
    description: >-
      WhatsApp lets a business answer freely within 24 hours of the
      customer's last message, and only with an approved template after.
      open says whether that window is open now (for a message sent later
      than the answer: a follow-up, a member's reply). Telegram has no
      window: open is always true there.
    class: read
    input:
      type: object
      required: [channel, sender]
      properties:
        channel: { type: string }
        sender:  { type: string }
    output:
      type: object
      properties:
        open:            { type: boolean }
        last_inbound_at: { type: string, description: "When they last wrote, empty when never" }
        closes_at:       { type: string }
    pii:
      - { field: sender, category: other }
