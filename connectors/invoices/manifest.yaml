# The invoices platform connector (docs/invoices.md, decision 0045): what
# workflows do with the business's invoices to its customers. It acts on
# Taskiem's own records, for the run's tenant only, and needs no
# connection. No action marks an invoice paid: only a payment counted
# towards it does, and a run waits for that with the invoice.paid signal.
manifest: connector/v1
id: invoices
version: 1.0.0
name: Invoices
category: other
regions: [NG]
auth:
  type: none
actions:
  create:
    title: Create an invoice
    description: A draft invoice with the business's next number. Give the amount (one line) or the items. Send it with send.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [customer]
      properties:
        customer:
          type: object
          required: [name]
          properties:
            name:  { type: string }
            phone: { type: string }
            email: { type: string }
        amount_kobo: { type: integer, minimum: 100, description: A single line for this amount; or give lines }
        description: { type: string, description: The single line's description (default "Amount due") }
        lines:
          type: array
          items:
            type: object
            required: [description, quantity, unit_kobo]
            properties:
              description: { type: string }
              quantity:    { type: integer, minimum: 1 }
              unit_kobo:   { type: integer, minimum: 1 }
        due_on:              { type: string, description: YYYY-MM-DD }
        note:                { type: string }
        connection:          { type: string, description: The payments connection; the business's default when left out }
        fee_paid_by:         { type: string, enum: [business, customer] }
        allow_part_payments: { type: boolean }
    output:
      type: object
      properties:
        number:     { type: string }
        status:     { type: string }
        total_kobo: { type: integer }
        total:      { type: string }
    pii:
      - { field: customer.name, category: name }
      - { field: customer.phone, category: phone }
      - { field: customer.email, category: email }
  send:
    title: Send an invoice
    description: Sends the invoice to its customer by SMS and email with its page's link, and marks it sent. Sending again resends the same link.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [number]
      properties:
        number: { type: string }
    output:
      type: object
      properties:
        number: { type: string }
        status: { type: string }
        queued: { type: array, items: { type: string } }
  get:
    title: Read an invoice
    class: read
    input:
      type: object
      required: [number]
      properties:
        number: { type: string }
    output:
      type: object
      properties:
        number:     { type: string }
        status:     { type: string, enum: [draft, sent, part_paid, paid, overdue, void] }
        total_kobo: { type: integer }
        paid_kobo:  { type: integer }
        due_kobo:   { type: integer }
        total:      { type: string }
        due:        { type: string }
        due_on:     { type: string }
        customer_name: { type: string }
    pii:
      - { field: output.customer_name, category: name }
  void:
    title: Void an invoice
    description: Cancels an invoice that is not paid, with the reason. A void invoice takes no new payment.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [number, reason]
      properties:
        number: { type: string }
        reason: { type: string }
    output:
      type: object
      properties:
        number: { type: string }
        status: { type: string }
  list:
    title: List overdue or paid invoices
    description: The business's overdue invoices (oldest due first, with the days past the due date, Lagos time), or those paid in the last hours (oldest paid first). No customer details; message a customer with notify_customer.
    class: read
    input:
      type: object
      required: [status]
      properties:
        status:            { type: string, enum: [overdue, paid] }
        paid_within_hours: { type: integer, minimum: 1, maximum: 168, description: For paid, how far back (default 24) }
        limit:             { type: integer, minimum: 1, maximum: 200, description: At most this many (default 50) }
    output:
      type: object
      properties:
        count: { type: integer }
        invoices:
          type: array
          items:
            type: object
            properties:
              number:       { type: string }
              status:       { type: string }
              total_kobo:   { type: integer }
              total:        { type: string }
              due_kobo:     { type: integer }
              due:          { type: string }
              due_on:       { type: string }
              days_overdue: { type: integer, description: Whole days past the due date; 0 when not overdue }
              paid_at:      { type: string }
  notify_customer:
    title: Message the invoice's customer
    description: An SMS, and an email when there is one, to the invoice's customer. {link} becomes the invoice's page link, {number} its number, {due} what is still due and {fee_line} a sentence on the bank's fee (what was sent and what reached the business) when the rail reported it, else nothing.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [number, text]
      properties:
        number:  { type: string }
        text:    { type: string }
        subject: { type: string, description: The email's subject }
    output:
      type: object
      properties:
        number: { type: string }
        queued: { type: array, items: { type: string } }
  register_account:
    title: Give a customer their own account number
    description: "A permanent account number of the customer's own: money paid into it is matched to their open invoices, oldest first, and the rest kept as their credit. Either issue one (issue true) on a connection that can issue account numbers, or register one the business already has for them (account_number and reference). The same customer and connection again answers the account already issued. One per customer, never one per invoice: an invoice's page offers its own. The customer is as their invoices have them: by key when given, else phone, else email."
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [customer, connection]
      properties:
        customer:
          type: object
          required: [name]
          properties:
            name:  { type: string }
            phone: { type: string }
            email: { type: string }
            key:   { type: string, description: The business's own key for the customer, when its invoices give one }
        connection:     { type: string, description: "The connection the account is on or is issued on, as connector/name: paystack/main" }
        issue:          { type: boolean, description: Issue the account on the connection (it must be able to issue account numbers) }
        account_number: { type: string, description: The account the business already has for the customer (not with issue) }
        reference:      { type: string, description: Its reference, which its payments carry (not with issue) }
        bank_name:      { type: string }
        account_name:   { type: string, description: "The name asked for when issuing, where the rail lets the business name it; the business's and the customer's when left out" }
        account:        { type: string, description: "The wallet the number pays into, on rails that hold several" }
        bvn:            { type: string, description: "The customer's BVN (11 digits), for rails that need one per account (Flutterwave); never kept" }
        nin:            { type: string, description: "Or their NIN (11 digits)" }
    output:
      type: object
      properties:
        account_number: { type: string }
        bank_name:      { type: string }
        reference:      { type: string, description: The account's reference, which its payments carry }
        connection:     { type: string }
        customer_name:  { type: string }
    pii:
      - { field: customer.name, category: name }
      - { field: customer.phone, category: phone }
      - { field: customer.email, category: email }
      - { field: bvn, category: bvn }
      - { field: nin, category: nin }
      - { field: output.customer_name, category: name }
