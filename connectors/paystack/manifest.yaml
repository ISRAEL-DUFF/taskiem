# Reference manifest for the Phase 1 Paystack connector. Handlers land in Phase 1;
# this file is a contract fixture validated against schemas/connector-v1.schema.json.
manifest: connector/v1
id: paystack
version: 1.0.0
name: Paystack
category: payments
regions: [NG, GH, KE, ZA, CI]
auth:
  type: api_key
  fields:
    - key: secret_key
      label: Secret key
      secret: true
      help: Taskiem uses it to take and check payments for your business. Keep it private.
      where: Paystack dashboard → Settings → API Keys & Webhooks
      link: https://dashboard.paystack.com/#/settings/developers
      prefixes:
        - { prefix: sk_live_, mode: live, label: Live (real money) }
        - { prefix: sk_test_, mode: test, label: Test (practice) }
      refuse:
        - { prefix: pk_, message: "That is your public key. Copy the secret key from the same page: it starts with sk_." }
  test: { action: check_balance }
rate_limit: { requests: 50, per: 1s, scope: connection }
base_url: https://api.paystack.co
actions:
  check_balance:
    title: Check balance
    class: read
    input: { type: object, properties: {} }
    output:
      type: object
      properties:
        balances:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              balance: { type: integer, description: Minor units }
  transfer:
    title: Send transfer
    class: idempotent_write
    idempotency:
      field: reference
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 50, charset: "a-z0-9_-" }
    reconcile: verify_transfer
    compensate: null
    input:
      type: object
      required: [amount, recipient]
      properties:
        amount:    { type: integer, description: Amount in kobo, minimum: 100 }
        recipient: { type: string, description: Recipient code }
        reason:    { type: string }
        currency:  { type: string, default: NGN }
    output:
      type: object
      properties:
        transfer_code: { type: string }
        reference:     { type: string }
        status:        { type: string, enum: [pending, success, failed, reversed, otp] }
    pii:
      - { field: recipient, category: account_number }
  verify_transfer:
    title: Verify transfer
    class: read
    input:
      type: object
      required: [reference]
      properties: { reference: { type: string } }
    output:
      type: object
      properties:
        transfer_code: { type: string }
        reference:     { type: string }
        status:        { type: string, enum: [pending, success, failed, reversed, otp, not_found] }
  initialize_transaction:
    title: Create a payment page
    description: A Paystack checkout page for a customer to pay an amount; verify_charge reports when it is paid.
    class: idempotent_write
    idempotency:
      field: reference
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 50, charset: "a-z0-9_-" }
    reconcile: verify_charge
    compensate: null
    input:
      type: object
      required: [amount, email]
      properties:
        amount:       { type: integer, description: Amount in kobo, minimum: 100 }
        email:        { type: string, description: The customer's email; Paystack requires one }
        callback_url: { type: string, description: Where Paystack sends the customer after paying }
        currency:     { type: string, default: NGN }
        metadata:     { type: object }
    output:
      type: object
      properties:
        authorization_url: { type: string }
        access_code:       { type: string }
        reference:         { type: string }
    pii:
      - { field: email, category: email }
  verify_charge:
    title: Verify charge
    class: read
    input:
      type: object
      required: [reference]
      properties: { reference: { type: string } }
    output:
      type: object
      properties:
        reference: { type: string }
        amount:    { type: integer }
        status:    { type: string }
  refund_transaction:
    title: Refund a payment
    description: Refunds a customer's payment in full, from the business's Paystack balance. Paystack refuses a second refund of the same payment, so a retry reports the first. The money reaches the customer in about 5 to 10 working days.
    class: reconcilable_write
    reconcile: refund_status
    compensate: null
    input:
      type: object
      required: [reference]
      properties:
        reference:     { type: string, description: The payment's reference }
        customer_note: { type: string }
        merchant_note: { type: string }
    output:
      type: object
      properties:
        reference: { type: string }
        refund_id: { type: integer }
        amount:    { type: integer, description: Kobo }
        status:    { type: string, description: "pending, processing, processed or failed; already when it had been refunded" }
  refund_status:
    title: Check whether a payment was refunded
    description: Reads the payment; not found while it has not been refunded (reversed).
    class: read
    input:
      type: object
      required: [reference]
      properties: { reference: { type: string } }
    output:
      type: object
      properties:
        reference: { type: string }
        status:    { type: string }
triggers:
  transfer_event:
    type: webhook
    verify: { scheme: hmac_sha512, header: x-paystack-signature, secret_field: secret_key }
    events: [transfer.success, transfer.failed, transfer.reversed]
    event_type: =body.event
    dedup: =body.data.reference + ':' + body.event
    correlation: =body.data.reference
  charge_event:
    type: webhook
    verify: { scheme: hmac_sha512, header: x-paystack-signature, secret_field: secret_key }
    events: [charge.success]
    event_type: =body.event
    dedup: =body.data.reference + ':' + body.event
    correlation: =body.data.reference
