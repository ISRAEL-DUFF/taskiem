# Reference manifest for the Phase 1 Paystack connector. Handlers land in Phase 1;
# this file is a contract fixture validated against schemas/connector-v1.schema.json.
manifest: connector/v1
id: paystack
version: 1.0.0
name: Paystack
category: payments
kind: rail
regions: [NG, GH, KE, ZA, CI]
auth:
  type: api_key
  fields:
    - key: secret_key
      label: Secret key
      secret: true
      help: Taskiem uses it to take and check payments for your business. Keep it private.
      where: Paystack dashboard → Settings → API Keys & Webhooks
      link: https://dashboard.paystack.com/#/settings/developers
      prefixes:
        - { prefix: sk_live_, mode: live, label: Live (real money) }
        - { prefix: sk_test_, mode: test, label: Test (practice) }
      refuse:
        - { prefix: pk_, message: "That is your public key. Copy the secret key from the same page: it starts with sk_." }
  test: { action: check_balance }
rate_limit: { requests: 50, per: 1s, scope: connection }
base_url: https://api.paystack.co
actions:
  check_balance:
    title: Check balance
    class: read
    input: { type: object, properties: {} }
    output:
      type: object
      properties:
        balances:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              balance: { type: integer, description: Minor units }
  list_transactions:
    title: List successful payments
    description: Payments received since a time, newest first (Paystack's GET /transaction). Taskiem uses it to notice payments without a webhook set up in Paystack.
    class: read
    input:
      type: object
      required: [from]
      properties:
        from: { type: string, format: date-time, description: Since when }
    output:
      type: object
      properties:
        data: { type: array, items: { type: object }, description: "Paystack transaction objects, as its charge.success webhook carries them" }
    pii:
      - { field: output.data, category: other }
  list_transfers:
    title: List transfers
    description: Transfers made since a time (Paystack's GET /transfer). Taskiem uses it to notice transfer results without a webhook set up in Paystack.
    class: read
    input:
      type: object
      required: [from]
      properties:
        from: { type: string, format: date-time, description: Since when }
    output:
      type: object
      properties:
        data: { type: array, items: { type: object }, description: "Paystack transfer objects, as its transfer webhooks carry them" }
    pii:
      - { field: output.data, category: other }
  list_banks:
    title: List Nigerian banks
    description: The banks Paystack pays into, by name and code, to choose one by name.
    class: read
    input: { type: object, properties: {} }
    output:
      type: object
      properties:
        banks: { type: array, items: { type: object, properties: { name: { type: string }, code: { type: string } } } }
  resolve_account:
    title: Find an account's name
    description: The name on a bank account, from its number and bank, to confirm before paying it.
    class: read
    input:
      type: object
      required: [account_number, bank_code]
      properties:
        account_number: { type: string, description: The 10-digit account number }
        bank_code:      { type: string, description: The bank's code (list_banks) }
    output:
      type: object
      properties:
        account_name:   { type: string }
        account_number: { type: string }
    pii:
      - { field: account_number, category: account_number }
      - { field: output.account_name, category: name }
      - { field: output.account_number, category: account_number }
  create_recipient:
    title: Save a person or business to pay
    description: A transfer recipient from a bank account, so transfers can be sent to it; an account already saved answers its recipient code again.
    class: idempotent_write
    idempotency:
      field: idempotency_key
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 64, charset: "a-z0-9_-" }
    input:
      type: object
      required: [account_number, name]
      properties:
        account_number: { type: string }
        bank_code:      { type: string, description: The bank's code (list_banks); or give bank }
        bank:           { type: string, description: "The bank's name as people write it (GTBank, First Bank, Opay), when there is no code" }
        name:           { type: string, description: The account's name as the bank has it }
    output:
      type: object
      properties:
        recipient_code: { type: string }
        name:           { type: string }
    pii:
      - { field: account_number, category: account_number }
      - { field: name, category: name }
  transfer:
    title: Send transfer
    class: idempotent_write
    idempotency:
      field: reference
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 50, charset: "a-z0-9_-" }
    reconcile: verify_transfer
    compensate: null
    input:
      type: object
      required: [amount, recipient]
      properties:
        amount:    { type: integer, description: Amount in kobo, minimum: 100 }
        recipient: { type: string, description: Recipient code }
        reason:    { type: string }
        currency:  { type: string, default: NGN }
    output:
      type: object
      properties:
        transfer_code: { type: string }
        reference:     { type: string }
        status:        { type: string, enum: [pending, success, failed, reversed, otp] }
    pii:
      - { field: recipient, category: account_number }
  verify_transfer:
    title: Verify transfer
    class: read
    input:
      type: object
      required: [reference]
      properties: { reference: { type: string } }
    output:
      type: object
      properties:
        transfer_code: { type: string }
        reference:     { type: string }
        status:        { type: string, enum: [pending, success, failed, reversed, otp, not_found] }
  initialize_transaction:
    title: Create a payment page
    description: A Paystack checkout page for a customer to pay an amount; verify_charge reports when it is paid.
    class: idempotent_write
    idempotency:
      field: reference
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 50, charset: "a-z0-9_-" }
    reconcile: verify_charge
    compensate: null
    input:
      type: object
      required: [amount, email]
      properties:
        amount:       { type: integer, description: Amount in kobo, minimum: 100 }
        email:        { type: string, description: The customer's email; Paystack requires one }
        callback_url: { type: string, description: Where Paystack sends the customer after paying }
        currency:     { type: string, default: NGN }
        metadata:     { type: object }
    output:
      type: object
      properties:
        authorization_url: { type: string }
        access_code:       { type: string }
        reference:         { type: string }
    pii:
      - { field: email, category: email }
  pay_with_transfer:
    title: Open an account number for one payment
    description: >-
      Pay with Transfer: a temporary account number for one amount, which
      Paystack must have turned on for the business. It takes payments
      until expires_at (15 minutes to 8 hours; 8 hours when no time is
      given); a transfer of another amount, or after that, is sent back to
      the payer. The payment arrives as charge.success with this reference.
    class: idempotent_write
    idempotency:
      field: reference
      encoding: base32_lower
      length: 32
      prefix: "tsk_"
      limits: { min_length: 16, max_length: 50, charset: "a-z0-9_-" }
    compensate: null
    input:
      type: object
      required: [amount, email]
      properties:
        amount:          { type: integer, description: Amount in kobo, minimum: 100 }
        email:           { type: string, description: The customer's email; Paystack requires one }
        expires_minutes: { type: integer, minimum: 1, description: Kept between 15 and 480 }
        metadata:        { type: object }
    output:
      type: object
      properties:
        reference:      { type: string }
        account_number: { type: string }
        account_name:   { type: string }
        bank_name:      { type: string }
        amount:         { type: integer, description: Kobo }
        expires_at:     { type: string, description: RFC 3339 }
        status:         { type: string, description: pending_bank_transfer until paid }
    pii:
      - { field: email, category: email }
      - { field: output.account_number, category: account_number }
      - { field: output.account_name, category: name }
  verify_charge:
    title: Verify charge
    class: read
    input:
      type: object
      required: [reference]
      properties: { reference: { type: string } }
    output:
      type: object
      properties:
        reference: { type: string }
        amount:    { type: integer }
        status:    { type: string }
  refund_transaction:
    title: Refund a payment
    description: Refunds a customer's payment in full, from the business's Paystack balance. Paystack refuses a second refund of the same payment, so a retry reports the first. The money reaches the customer in about 5 to 10 working days.
    class: reconcilable_write
    reconcile: refund_status
    compensate: null
    input:
      type: object
      required: [reference]
      properties:
        reference:     { type: string, description: The payment's reference }
        customer_note: { type: string }
        merchant_note: { type: string }
    output:
      type: object
      properties:
        reference: { type: string }
        refund_id: { type: integer }
        amount:    { type: integer, description: Kobo }
        status:    { type: string, description: "pending, processing, processed or failed; already when it had been refunded" }
  refund_status:
    title: Check whether a payment was refunded
    description: Reads the payment; not found while it has not been refunded (reversed).
    class: read
    input:
      type: object
      required: [reference]
      properties: { reference: { type: string } }
    output:
      type: object
      properties:
        reference: { type: string }
        status:    { type: string }
triggers:
  transfer_event:
    type: webhook
    title: Transfers you send
    where: "Paystack keeps one webhook address: give it the payments one. Transfers still reach Taskiem, which checks Paystack for them."
    verify: { scheme: hmac_sha512, header: x-paystack-signature, secret_field: secret_key }
    events: [transfer.success, transfer.failed, transfer.reversed]
    event_type: =body.event
    dedup: =body.data.reference + ':' + body.event
    correlation: =body.data.reference
    # Without the webhook in Paystack's dashboard, Taskiem asks Paystack
    # itself every few minutes (no-technical-steps N4); with it, events
    # arrive at once, and each is taken once either way.
    poll: { action: list_transfers, since: from, items: =output.data, event: "='transfer.' + item.status", every: 5m }
  charge_event:
    type: webhook
    title: Payments you receive
    where: "Paystack dashboard → Settings → API Keys & Webhooks → Live Webhook URL (Paystack keeps one address: use this one)"
    verify: { scheme: hmac_sha512, header: x-paystack-signature, secret_field: secret_key }
    # Refund events come to the same address (Paystack sends every event to
    # its one webhook URL). They name the payment refunded in
    # transaction_reference, not reference (docs-v2.paystack.com/docs/payments/refunds/,
    # "Listen to notifications").
    events: [charge.success, bank.transfer.rejected, refund.pending, refund.processing, refund.processed, refund.failed]
    event_type: =body.event
    dedup: "=body.event.startsWith('refund.') ? body.data.transaction_reference + ':' + body.event + ':' + string(body.data.amount) : body.data.reference + ':' + body.event"
    correlation: "=body.event.startsWith('refund.') ? body.data.transaction_reference : body.data.reference"
    poll: { action: list_transactions, since: from, items: =output.data, event: "='charge.success'", every: 5m }
# What Paystack can do in Taskiem's words (rule 16, schemas/capabilities-v1.json).
capabilities:
  balance:
    action: check_balance
    input: {}
    output:
      available_kobo: "=sum(output.balances.filter(b, b.currency == input.currency).map(b, b.balance))"
      currency: =input.currency
    unsupported: [account]
  resolve_account:
    action: resolve_account
    input: { account_number: "=input.account_number", bank_code: "=input.bank_code" }
    output: { account_name: "=output.account_name" }
  list_banks:
    action: list_banks
    input: {}
    output: { banks: "=output.banks.map(b, {'code': b.code, 'name': b.name})" }
  pay_bank:
    # A bank account is paid through a saved recipient: two calls, each
    # exactly once under its own key.
    steps:
      - id: recipient
        action: create_recipient
        input: { account_number: "=input.account_number", bank_code: "=input.bank_code", name: "=input.account_name" }
      - id: transfer
        action: transfer
        input: { amount: "=input.amount_kobo", recipient: "=steps.recipient.output.recipient_code", reason: "=input.narration", currency: "=input.currency" }
    output:
      payout_id: =output.reference
      status: "=output.status == 'success' ? 'settled' : output.status == 'pending' ? 'pending' : 'failed'"
      reason: "=output.status == 'otp' ? optional.of('otp_enabled') : output.status == 'reversed' ? optional.of('reversed') : optional.none()"
    unsupported: [source]
    settles_by: { trigger: transfer_event, lookup: get_payout }
    notes: With OTP on transfers turned on in Paystack, a transfer waits for a code Taskiem cannot give; it is reported failed with reason otp_enabled.
  get_payout:
    action: verify_transfer
    input: { reference: "=input.payout_id" }
    output:
      status: "=output.status == 'success' ? 'settled' : output.status == 'reversed' ? 'reversed' : output.status == 'pending' ? 'pending' : 'failed'"
      reason: "=output.status == 'otp' ? optional.of('otp_enabled') : output.status == 'not_found' ? optional.of('not_found') : optional.none()"
  collect_link:
    action: initialize_transaction
    input:
      amount: =input.amount_kobo
      email: =input.customer.email
      currency: =input.currency
      callback_url: =input.?return_url
      metadata: "={'description': input.description}"
    output: { payment_url: "=output.authorization_url", payment_id: "=output.reference" }
    requires: [customer.email]
    ignores: [customer.name, customer.phone, customer.bvn]
  collect_transfer:
    action: pay_with_transfer
    input:
      amount: =input.amount_kobo
      email: =input.customer.email
      expires_minutes: =input.?expires_minutes
      metadata: "={'description': input.description}"
    output:
      payment_id: =output.reference
      account_number: =output.account_number
      bank_name: =output.bank_name
      account_name: =output.?account_name
      amount_kobo: =output.amount
      expires_at: =output.expires_at
    requires: [customer.email]
    ignores: [customer.name, customer.phone, customer.bvn]
    fixed: { currency: NGN }
    transfer: { on_late: returned, on_wrong_amount: returned, min_minutes: 15, max_minutes: 480, default_minutes: 480 }
    notes: >-
      Pay with Transfer must be turned on for the business by Paystack's support. A transfer
      of another amount, or after the account expires, is refunded to the payer by Paystack
      (bank.transfer.rejected for a wrong amount).
  get_payment:
    action: verify_charge
    input: { reference: "=input.payment_id" }
    output:
      status: "=output.status == 'success' ? 'paid' : output.status == 'reversed' ? 'refunded' : output.status in ['failed', 'abandoned'] ? 'failed' : 'pending'"
      amount_kobo: =output.?amount
      currency: =output.?currency
  refund:
    action: refund_transaction
    input: { reference: "=input.payment_id", merchant_note: "=input.?reason" }
    output:
      # A payment refunded before answers no refund id: the payment's reference stands for it.
      refund_id: "=has(output.refund_id) ? string(output.refund_id) : input.payment_id"
      status: "=output.status in ['processed', 'already'] ? 'refunded' : output.status == 'failed' ? 'failed' : 'pending'"
      amount_kobo: =output.?amount
    unsupported: [amount_kobo]
events:
  payout.settled:
    trigger: transfer_event
    when: =body.event == 'transfer.success'
    fields: { payout_id: "=body.data.reference", amount_kobo: "=body.data.?amount" }
  payout.failed:
    trigger: transfer_event
    when: =body.event == 'transfer.failed'
    fields: { payout_id: "=body.data.reference", reason: "=body.data.?reason" }
  payout.reversed:
    trigger: transfer_event
    when: =body.event == 'transfer.reversed'
    fields: { payout_id: "=body.data.reference", reason: "=body.data.?reason" }
  payment.received:
    trigger: charge_event
    when: =body.event == 'charge.success'
    fields: { payment_id: "=body.data.reference", amount_kobo: "=body.data.amount", currency: "=body.data.?currency", paid_at: "=body.data.?paid_at" }
  payment.returned:
    # Paystack's documentation describes the event (an incorrect amount, or
    # a payer its fraud checks flagged) without an example body; the
    # reference is read as in its other charge events. Confirm in sandbox.
    trigger: charge_event
    when: =body.event == 'bank.transfer.rejected'
    fields: { payment_id: "=body.data.reference", amount_kobo: "=body.data.?amount", reason: "='other'" }
  # Refunds, from Paystack's public documentation (docs-v2.paystack.com,
  # read 23 October 2026): the events are listed on
  # https://docs-v2.paystack.com/docs/payments/webhooks/ (refund.pending,
  # refund.processing, refund.processed, refund.failed), and one example
  # body, refund.pending, is on
  # https://docs-v2.paystack.com/docs/payments/refunds/#listen-to-notifications
  # (data: status, transaction_reference, refund_reference (null there),
  # amount as a string, currency, processor, customer). The other three are
  # read the same way. amount is read in the currency's subunit, as the
  # Create Refund API takes it (https://docs-v2.paystack.com/docs/api/refund/);
  # the webhook example does not say. A failed refund's reason is not
  # documented and is left out. refund.processing (the processor has it) is
  # still pending. Confirm in sandbox.
  refund.pending:
    trigger: charge_event
    when: =body.event in ['refund.pending', 'refund.processing']
    fields:
      payment_id: =body.data.transaction_reference
      refund_id: =body.data.?refund_reference
      amount_kobo: "=has(body.data.amount) && body.data.amount != null ? optional.of(int(body.data.amount)) : optional.none()"
      currency: =body.data.?currency
  refund.processed:
    trigger: charge_event
    when: =body.event == 'refund.processed'
    fields:
      payment_id: =body.data.transaction_reference
      refund_id: =body.data.?refund_reference
      amount_kobo: "=has(body.data.amount) && body.data.amount != null ? optional.of(int(body.data.amount)) : optional.none()"
      currency: =body.data.?currency
  refund.failed:
    trigger: charge_event
    when: =body.event == 'refund.failed'
    fields:
      payment_id: =body.data.transaction_reference
      refund_id: =body.data.?refund_reference
      amount_kobo: "=has(body.data.amount) && body.data.amount != null ? optional.of(int(body.data.amount)) : optional.none()"
      currency: =body.data.?currency
