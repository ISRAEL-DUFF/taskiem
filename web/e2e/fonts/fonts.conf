<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The parity test's text (web/e2e/parity.spec.ts): drawn into pictures the
     phone app is compared with, as a phone draws it: no hinting and no colour
     fringes, whatever the machine's own fontconfig says (an Ubuntu runner's
     draws sub-pixel colour, hinted). Its FONTCONFIG_FILE. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
  <!-- Emoji from Noto Color Emoji (as the pictures were drawn and as Android
       draws them), not whichever colour font the machine has first. -->
  <alias binding="strong"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <selectfont><rejectfont>
    <pattern><patelt name="color"><bool>true</bool></patelt></pattern>
  </rejectfont><acceptfont>
    <pattern><patelt name="family"><string>Noto Color Emoji</string></patelt></pattern>
  </acceptfont></selectfont>
</fontconfig>
