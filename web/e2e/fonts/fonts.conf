<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The parity test's text (web/e2e/parity.spec.ts): drawn into pictures the
     phone app is compared with, as a phone draws it: no hinting and no colour
     fringes, whatever the machine's own fontconfig says (an Ubuntu runner's
     draws sub-pixel colour, hinted). Its FONTCONFIG_FILE. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
  <!-- Only the fonts Playwright's own image has (what Playwright's
       install with its dependencies puts on Ubuntu), so a machine with more (a
       runner's image has many) falls back for a symbol or an emoji to the
       same font as the kept pictures did. The words are the web's own font,
       loaded by the page. Emoji from Noto Color Emoji, the release
       pin-emoji.sh puts in place. -->
  <alias binding="strong"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <selectfont>
    <rejectfont>
      <!-- Every font file (a glob's * reaches into folders)... -->
      <glob>/*.ttf</glob><glob>/*.otf</glob><glob>/*.ttc</glob><glob>/*.otc</glob>
      <glob>/*.pfb</glob><glob>/*.pfa</glob><glob>/*.pcf.gz</glob><glob>/*.pcf</glob>
      <glob>/*.woff</glob><glob>/*.woff2</glob>
    </rejectfont>
    <!-- ...but these. -->
    <acceptfont>
      <glob>/usr/share/fonts/X11/Type1/*</glob>
      <glob>/usr/share/fonts/opentype/ipafont-gothic/*</glob>
      <glob>/usr/share/fonts/opentype/tlwg/*</glob>
      <glob>/usr/share/fonts/opentype/unifont/*</glob>
      <glob>/usr/share/fonts/truetype/fonts-japanese-gothic.ttf</glob>
      <glob>/usr/share/fonts/truetype/freefont/*</glob>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob>
      <glob>/usr/share/fonts/truetype/wqy/*</glob>
    </acceptfont>
  </selectfont>
</fontconfig>
