<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 · Open</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<script src="../../../kit/kit.js"></script>
<script>window.scene = { duration: 6000 };</script>
<style>
/* Scene 1 (script.md): say what this scene shows and where its screen
   comes from (a design board, a page of the app). */
</style>
</head>
<body>
<div class="stage">
  <div class="caption">
    <span class="kicker up" style="--at:.1s">Every day</span>
    <h1 class="headline up" style="--at:.25s">A line that says it, <em>in pine</em>.</h1>
    <p class="sub up" style="--at:.45s">One more line under it, quieter.</p>
  </div>
  <div class="phone show"><div class="island"></div><div class="screen"><div class="app">
    <header data-name="Taskiem" data-sub="Ada's Kitchen" data-av="spark"></header>
    <main class="chat">
      <div class="day">Today</div>
      <div class="bubble in" style="--at:.8s">A message arrives.<time>8:02</time></div>
      <div class="bubble mine in" style="--at:1.8s">An answer.<time>8:03</time></div>
    </main>
    <footer data-composer="Message, @ to tag"></footer>
    <i class="tap" data-at="3000" style="left:195px;top:790px"></i>
  </div></div></div>
</div>
</body>
</html>
