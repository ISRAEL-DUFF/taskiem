<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>11 · Light by day, dark by night</title>
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/kit.js"></script>
<script>window.scene = { duration: 6000 };</script>
<style>
/* Scene 11 (video/script.md): evening; the whole frame goes from the
   light theme to the app's own dark one; How did we do, as a chart. */
.layer { position: absolute; inset: 0; }
.layer.light { background: inherit; animation: k-gone .9s var(--ease) both; animation-delay: 1.6s; }
.dark {
  --paper: #0d0e0c; --ink: #ededea; --muted: #a3a8a0; --white: #161815; --soft: #1f221e; --line: #262a25;
  color: var(--ink);
  background: radial-gradient(60% 70% at 72% 52%, rgba(200,241,105,.10), transparent 70%), radial-gradient(rgba(255,255,255,.04) 1.6px, transparent 2.2px) 0 0 / 36px 36px, #0d0e0c;
}
.dark .headline em { color: var(--lime); box-shadow: inset 0 -.16em 0 rgba(200,241,105,.18); }
.dark .app header { background: #161815; border-color: #262a25; }
.dark .chat { background: radial-gradient(rgba(255,255,255,.035) 1.2px, transparent 1.7px) 0 0 / 28px 28px, #0d0e0c; }
.dark .app footer { background: #161815; }
.dark .box { background: #1f221e; }
.dark .phone .screen { background: #0d0e0c; }
.dark .avatar.pine { background: #164a3b; }
.how { border-radius: 22px; background: var(--white); padding: 16px; box-shadow: 0 1px 2px rgba(14,26,20,.1); }
.how .k { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.how .big { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
.how .up { font-size: 13px; font-weight: 600; color: var(--pine); }
.dark .how .up { color: var(--lime); }
.chart { display: flex; align-items: flex-end; gap: 10px; height: 150px; margin-top: 16px; }
.chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.chart span { width: 100%; border-radius: 6px 6px 3px 3px; background: rgba(13,59,46,.18); }
.chart div:last-child span { background: var(--pine); }
.dark .chart span { background: rgba(200,241,105,.22); }
.dark .chart div:last-child span { background: var(--lime); }
.chart small { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="stage">
  <div class="layer dark" id="dark"></div>
  <div class="layer light" id="light">
    <div class="caption">
      <span class="kicker show">4 · Staff</span>
      <h1 class="headline">Light by day, <em>dark by night</em>.</h1>
      <p class="sub">And how the day went, as a chart.</p>
    </div>
    <div class="phone"><div class="island"></div><div class="screen"><div class="app">
      <header data-name="Taskiem" data-sub="Ada's Kitchen · 9:40 pm" data-av="spark"></header>
      <main class="chat">
        <article class="how">
          <div class="k">HOW DID WE DO · THIS WEEK</div>
          <div class="big">₦2,940,000</div>
          <div class="up">Up 9% on last week</div>
          <div class="chart">
            <div><span class="grows" style="height:52%;--at:.3s"></span><small>Fri</small></div>
            <div><span class="grows" style="height:70%;--at:.36s"></span><small>Sat</small></div>
            <div><span class="grows" style="height:38%;--at:.42s"></span><small>Sun</small></div>
            <div><span class="grows" style="height:58%;--at:.48s"></span><small>Mon</small></div>
            <div><span class="grows" style="height:64%;--at:.54s"></span><small>Tue</small></div>
            <div><span class="grows" style="height:80%;--at:.60s"></span><small>Wed</small></div>
            <div><span class="grows" style="height:100%;--at:.66s"></span><small>Thu</small></div>
          </div>
        </article>
        <div class="dl">✓ Shift handed over: cash counted ₦184,500</div>
      </main>
      <footer data-composer="Ask Taskiem, or @ to tag"></footer>
    </div></div></div>
  </div>
</div>
<script>
  // The dark layer is the light one's twin, under it: the light fades away.
  document.getElementById("dark").innerHTML = document.getElementById("light").innerHTML;
</script>
</body>
</html>
