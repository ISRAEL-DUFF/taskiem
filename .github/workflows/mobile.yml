name: mobile

# The phone app (docs/spec/mobile-app.md): analysed, tested (its half of the
# parity test included), its Dart packages through the licence gate, and
# built for Android and for iPhone. The web half of the parity test runs with
# the browser tests in ci.yml. Run when the app, its theme's generator, the
# web's look or the API description (the app's client is generated from it)
# changes; the iPhone build needs macOS, so it is not run on every
# change to the repository.

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'tools/mobilegen/**', 'tools/licencecheck/**', 'web/src/**', 'web/public/brand/**', 'api/openapi/openapi.yaml', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'tools/mobilegen/**', 'tools/licencecheck/**', 'web/src/**', 'web/public/brand/**', 'api/openapi/openapi.yaml', '.github/workflows/mobile.yml']

permissions:
  contents: read

env:
  # Flutter from Google's own release, checked against its published sha256
  # (releases_linux.json, releases_macos.json); change the three together.
  FLUTTER_VERSION: 3.47.9

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install Flutter
        run: |
          curl -fsSL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  flutter.tar.xz" | sha256sum -c -
          tar -xJf flutter.tar.xz -C "$RUNNER_TEMP" && rm flutter.tar.xz
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: The theme is the web's (tokens and brand files)
        run: go test ./tools/mobilegen/
      - name: Dart packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Licence gate for the Dart packages
        run: go run ./tools/licencecheck -pub mobile/pubspec.lock
      - working-directory: mobile
        run: flutter analyze
      - name: Tests, with the app half of the parity test
        working-directory: mobile
        run: flutter test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: parity
          path: mobile/build/parity/
      - name: Build for Android
        working-directory: mobile
        run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Flutter
        run: |
          curl -fsSL -o flutter.zip "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          echo "6545b85938745dc5070e9faf2adf70233c1811009d87fe6d27bfcda5a04b7698  flutter.zip" | shasum -a 256 -c -
          unzip -q flutter.zip -d "$RUNNER_TEMP" && rm flutter.zip
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Tests on macOS too (the parity test runs on Linux, where the web's pictures are taken)
        working-directory: mobile
        run: flutter test --exclude-tags parity
      - name: "Build for iPhone, not signed (signing needs the Apple account, A3)"
        working-directory: mobile
        run: flutter build ios --debug --no-codesign
