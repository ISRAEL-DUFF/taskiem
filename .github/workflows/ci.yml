name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      TASKIEM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Start OpenBao (transit engine for the secrets tests)
        run: |
          curl -sSL -o bao.tgz https://github.com/openbao/openbao/releases/download/v2.4.1/bao_2.4.1_Linux_x86_64.tar.gz
          tar xzf bao.tgz bao
          ./bao server -dev -dev-root-token-id=dev -dev-listen-address=127.0.0.1:8200 > bao.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null && break; sleep 1; done
          curl -sf -H "X-Vault-Token: dev" -X POST -d '{"type":"transit"}' http://127.0.0.1:8200/v1/sys/mounts/transit
          curl -sf -H "X-Vault-Token: dev" -X POST http://127.0.0.1:8200/v1/transit/keys/taskiem-root
          echo "TASKIEM_TEST_OPENBAO_ADDR=http://127.0.0.1:8200" >> "$GITHUB_ENV"
      - name: Unit and database tests
        run: go test -count=1 ./...
      - name: Validate contracts and dogfood workflows
        run: go run ./cmd/taskiem validate flows/*/*.wd.json connectors/*/manifest.yaml
      - name: Migrations apply cleanly with the CLI
        run: go run ./cmd/taskiem migrate --dsn "$TASKIEM_TEST_DATABASE_URL"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The web app in a real browser against the real binary (web/e2e).
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      TASKIEM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taskiem/web build
      - run: pnpm --filter @taskiem/web exec playwright install --with-deps chromium
      - run: pnpm --filter @taskiem/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/

  # The image builds and the Compose stack comes up healthy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait taskiem
      - name: Bootstrap and sign in
        run: |
          docker compose -f deploy/docker-compose.yml run --rm --no-deps -e TASKIEM_BOOTSTRAP_PASSWORD='ci password 123' taskiem bootstrap --tenant CI --email ci@example.com
          curl -sf -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"ci password 123"}' http://127.0.0.1:8080/v1/auth/login
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses list --json > npm-licences.json
      - run: go run ./tools/licencecheck -npm npm-licences.json

  # The AI evaluation gate (spec 12.4, docs/ai.md#evaluation): the builder
  # and repair suites through the real pipelines with the offline heuristic
  # provider, compared with the committed baselines (no API key, no cost,
  # deterministic). Runs on main and on pull requests touching the AI
  # layer, the suites, the template library or the runner. The real-model
  # run is .github/workflows/ai-eval.yml.
  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does this change touch the AI layer?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(engine/ai/|evals/|templates/|tools/aieval/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change under engine/ai, evals, templates or tools/aieval: the AI evaluation is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@v6
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: Builder suite against its baseline
        if: steps.changes.outputs.run == 'true'
        run: go run ./tools/aieval -compare evals/builder/baseline.json -tolerance 0 -out builder-eval.json -markdown builder-eval.md
      - name: Repair suite against its baseline
        if: steps.changes.outputs.run == 'true'
        run: go run ./tools/aieval -mode repair -compare evals/repair/baseline.json -tolerance 0 -out repair-eval.json -markdown repair-eval.md
      - name: Summary
        if: always() && steps.changes.outputs.run == 'true'
        run: cat builder-eval.md repair-eval.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: ai-eval
          path: |
            builder-eval.json
            builder-eval.md
            repair-eval.json
            repair-eval.md
          if-no-files-found: ignore

  # Signed builds and SBOM (build plan Phase 0). Runs on main only.
  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, typescript, web, docker, licences]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make build VERSION=${GITHUB_SHA::12}
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: bin/taskiem.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v3
      - name: Sign binary and SBOM
        run: |
          for f in bin/taskiem bin/taskiem.spdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: taskiem-${{ github.sha }}
          path: bin/

  # The image builds, the chart lints, and deploy/kubernetes is regenerated from it.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Chart and generated manifests
        run: |
          make chart
          git diff --exit-code deploy/kubernetes
      - name: Image
        run: docker build --build-arg VERSION=ci -t taskiem:ci .
