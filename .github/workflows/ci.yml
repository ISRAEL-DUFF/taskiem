name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      TASKIEM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Start OpenBao (transit engine for the secrets tests)
        run: |
          curl -sSL -o bao.tgz https://github.com/openbao/openbao/releases/download/v2.4.1/bao_2.4.1_Linux_x86_64.tar.gz
          tar xzf bao.tgz bao
          ./bao server -dev -dev-root-token-id=dev -dev-listen-address=127.0.0.1:8200 > bao.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null && break; sleep 1; done
          curl -sf -H "X-Vault-Token: dev" -X POST -d '{"type":"transit"}' http://127.0.0.1:8200/v1/sys/mounts/transit
          curl -sf -H "X-Vault-Token: dev" -X POST http://127.0.0.1:8200/v1/transit/keys/taskiem-root
          echo "TASKIEM_TEST_OPENBAO_ADDR=http://127.0.0.1:8200" >> "$GITHUB_ENV"
      - name: Unit and database tests
        run: go test -count=1 ./...
      - name: Validate contracts and dogfood workflows
        run: go run ./cmd/taskiem validate flows/*/*.wd.json connectors/*/manifest.yaml
      # Every docs link and anchor resolves, and the docs site and API
      # reference build (decision 0025). The OpenAPI route, permission and
      # response checks run with the unit tests above (api/openapi_test.go).
      - name: Docs links and site
        run: go run ./tools/docsite -out "$RUNNER_TEMP/site"
      - name: Migrations apply cleanly with the CLI
        run: go run ./cmd/taskiem migrate --dsn "$TASKIEM_TEST_DATABASE_URL"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The web app in a real browser against the real binary (web/e2e).
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      TASKIEM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taskiem/web build
      - run: pnpm --filter @taskiem/web exec playwright install --with-deps chromium
      - run: pnpm --filter @taskiem/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/

  # The image builds and the Compose stack comes up healthy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait taskiem
      - name: Bootstrap and sign in
        run: |
          docker compose -f deploy/docker-compose.yml run --rm --no-deps -e TASKIEM_BOOTSTRAP_PASSWORD='ci password 123' taskiem bootstrap --tenant CI --email ci@example.com
          curl -sf -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"ci password 123"}' http://127.0.0.1:8080/v1/auth/login
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses list --json > npm-licences.json
      - run: go run ./tools/licencecheck -npm npm-licences.json

  # The AI evaluation gate (spec 12.4, docs/ai.md#evaluation): the builder
  # and repair suites through the real pipelines with the offline heuristic
  # provider, compared with the committed baselines (no API key, no cost,
  # deterministic). Runs on main and on pull requests touching the AI
  # layer, the suites, the template library or the runner. The real-model
  # run is .github/workflows/ai-eval.yml.
  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does this change touch the AI layer?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(engine/ai/|evals/|templates/|tools/aieval/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change under engine/ai, evals, templates or tools/aieval: the AI evaluation is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@v6
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: Builder suite against its baseline
        if: steps.changes.outputs.run == 'true'
        run: go run ./tools/aieval -compare evals/builder/baseline.json -tolerance 0 -out builder-eval.json -markdown builder-eval.md
      - name: Repair suite against its baseline
        if: steps.changes.outputs.run == 'true'
        run: go run ./tools/aieval -mode repair -compare evals/repair/baseline.json -tolerance 0 -out repair-eval.json -markdown repair-eval.md
      - name: Summary
        if: always() && steps.changes.outputs.run == 'true'
        run: cat builder-eval.md repair-eval.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: ai-eval
          path: |
            builder-eval.json
            builder-eval.md
            repair-eval.json
            repair-eval.md
          if-no-files-found: ignore

  # The one-VM deployment, end to end on a fresh runner (decision 0032,
  # docs/vm.md): install.sh and taskiem-vps setup against a real Postgres,
  # OpenBao initialised and auto-unsealed, Caddy in front; then a restart
  # (auto-unseal), a broken release (rolled back), a good one, and rollback.
  vps:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail: a failure before "| tee" fails the step
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      TASKIEM_VPS_KIT_SOURCE: ${{ github.workspace }}/deploy/vm
      TASKIEM_VPS_NO_FIREWALL: "1"
      TASKIEM_VPS_NO_TIMERS: "1"
      TASKIEM_VPS_NONINTERACTIVE: "1"
      TASKIEM_VPS_VERIFY: "0"
      TASKIEM_VPS_INSECURE_TLS: "1"
      TASKIEM_VPS_IMAGE_OVERRIDE: taskiem:ci
      TASKIEM_VPS_DOMAIN: localhost
      TASKIEM_VPS_OWNER_EMAIL: owner@example.com
      TASKIEM_VPS_ORG: CI Company
      TASKIEM_VPS_CHANNEL: staging
      TASKIEM_VPS_WINDOW: any
      TASKIEM_VPS_BACKUP_REPO: /srv/taskiem-backups
      TASKIEM_VPS_PUBLIC: "yes"
      TASKIEM_VPS_PREVIEW_DOMAIN: shops.localhost
      TASKIEM_VPS_MAIL_DOMAIN: in.localhost
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck deploy/vm/install.sh deploy/vm/taskiem-vps
      - name: Images (a good one, a renamed copy, and one that cannot start)
        run: |
          docker build --build-arg VERSION=ci -t taskiem:ci .
          docker tag taskiem:ci taskiem:ci-next
          printf 'FROM taskiem:ci\nENTRYPOINT ["/taskiem", "no-such-command"]\n' | docker build -t taskiem:broken -
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres taskiem_ci
      - name: Install
        run: |
          # The runner's own address: Taskiem's containers reach Postgres as a server reaches its database host.
          export TASKIEM_VPS_DATABASE_URL="postgres://postgres:postgres@$(hostname -I | awk '{print $1}'):5432/taskiem_ci?sslmode=disable"
          sudo -E bash deploy/vm/install.sh 2>&1 | tee install.log
      - name: Installed, healthy, owner created
        run: |
          curl -fsk https://localhost/readyz
          PW=$(sed -n 's/.*first password[^:]*: //p' install.log | tail -n1)
          test -n "$PW"
          sudo sh -c 'grep -q "unseal key" /root/taskiem-recovery-*.txt && shred -u /root/taskiem-recovery-*.txt'
          sudo -E taskiem-vps backup
          sudo -E taskiem-vps check
          # Test only: an https public URL holds admins to passkeys, which a script cannot use.
          echo "TASKIEM_REQUIRE_ADMIN_PASSKEYS='false'" | sudo tee -a /opt/taskiem/taskiem.env >/dev/null
          sudo docker compose --project-directory /opt/taskiem up -d --wait taskiem
          curl -fsk -H 'Content-Type: application/json' -d "{\"email\":\"owner@example.com\",\"password\":\"$PW\",\"bearer\":true}" https://localhost/v1/auth/login | jq -er .token > token
      - name: The public host runs apart, and certificates are asked for only for hosts it serves
        run: |
          dc() { sudo docker compose --project-directory /opt/taskiem "$@"; }
          # Its own login and nothing else of the platform's.
          sudo grep -q "^TASKIEM_PUBLIC_DATABASE_URL='postgres://taskiem_ci_public:" /opt/taskiem/public.env
          if sudo grep -Eq 'OPENBAO|KMS|TASKIEM_DATABASE_URL|ANCHOR|SMTP' /opt/taskiem/public.env; then echo "the public host was given a platform secret"; exit 1; fi
          test -f /opt/taskiem/caddy.d/public.caddy
          ask() { dc exec -T caddy wget -qO- "http://taskiem-public:9090/tls/ask?domain=$1" >/dev/null 2>&1; }
          if ask ada.shops.localhost; then echo "a certificate would be issued for a host nobody verified"; exit 1; fi
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d taskiem_ci -qc "INSERT INTO public_hosts (host, tenant_id, kind, site_id, verified_at)
            SELECT 'ada.shops.localhost', id, 'storefront', gen_random_uuid(), now() FROM tenants LIMIT 1"
          ask ada.shops.localhost
          dc exec -T caddy wget -qO- --header 'Host: ada.shops.localhost' http://taskiem-public:8082/ | grep 'Coming soon' >/dev/null
          # The app's own host still goes to the app.
          curl -fsk https://localhost/readyz
      - name: The mail server runs apart, on port 25, and takes mail only for workflows' addresses
        run: |
          # Its own login and the public key, nothing else of the platform's.
          sudo grep -q "^TASKIEM_PUBLIC_DATABASE_URL='postgres://taskiem_ci_public:" /opt/taskiem/mail.env
          sudo grep -q "^TASKIEM_MAIL_DOMAIN='in.localhost'" /opt/taskiem/mail.env /opt/taskiem/taskiem.env
          if sudo grep -Eq 'OPENBAO|KMS|TASKIEM_DATABASE_URL|ANCHOR|SMTP' /opt/taskiem/mail.env; then echo "the mail server was given a platform secret"; exit 1; fi
          printf 'From: a@example.com\r\nSubject: x\r\n\r\nx\r\n' > msg.eml
          # An address no workflow has is refused at RCPT (550), so the server is up and reads the database.
          out=$(curl -sS smtp://127.0.0.1:25 --mail-from a@example.com --mail-rcpt nobodyhere12@in.localhost -T msg.eml 2>&1 || true)
          echo "$out"
          grep -q 550 <<<"$out"
          sudo -E taskiem-vps check
      - name: A secret goes through OpenBao, before and after OpenBao restarts (auto-unseal)
        run: |
          put() { curl -fsk -X PUT -H "Authorization: Bearer $(cat token)" -H 'Content-Type: application/json' -d '{"value":"v"}' "https://localhost/v1/secrets/prod/$1"; }
          put ci_one
          sudo docker compose --project-directory /opt/taskiem restart openbao
          for i in $(seq 30); do sudo docker compose --project-directory /opt/taskiem exec -T openbao bao status >/dev/null 2>&1 && break; sleep 2; done
          put ci_two
          sudo -E taskiem-vps check
      - name: A broken release is rolled back
        run: |
          if sudo -E TASKIEM_VPS_IMAGE_OVERRIDE=taskiem:broken taskiem-vps update --now; then echo "the broken release was accepted"; exit 1; fi
          test "$(sudo cat /var/lib/taskiem-vps/current)" = taskiem:ci
          curl -fsk https://localhost/readyz
          out=$(sudo -E taskiem-vps check || true)
          grep -q 'taskiem:broken failed to upgrade' <<<"$out"
      - name: A good release upgrades; rollback returns to the one before
        run: |
          sudo -E TASKIEM_VPS_IMAGE_OVERRIDE=taskiem:ci-next taskiem-vps update --now
          test "$(sudo cat /var/lib/taskiem-vps/current)" = taskiem:ci-next
          sudo -E taskiem-vps rollback
          test "$(sudo cat /var/lib/taskiem-vps/current)" = taskiem:ci
          curl -fsk https://localhost/readyz
          sudo -E taskiem-vps status
      - name: Disaster and restore from the backup and the recovery sheet
        run: |
          sudo -E taskiem-vps backup
          UNSEAL=$(sudo sed -n "s/^BAO_STATIC_UNSEAL_KEY='\(.*\)'$/\1/p" /opt/taskiem/openbao-unseal.env)
          RESTIC=$(sudo sed -n "s/^RESTIC_PASSWORD='\(.*\)'$/\1/p" /etc/taskiem/backup.env)
          test -n "$UNSEAL" && test -n "$RESTIC"
          # Lose the server: containers, volumes (OpenBao's storage included) and every setting.
          sudo docker compose --project-directory /opt/taskiem down -v
          sudo sh -c 'rm -rf /opt/taskiem/.env /opt/taskiem/*.env /etc/taskiem /var/lib/taskiem-vps'
          sudo -E TASKIEM_VPS_RESTIC_PASSWORD="$RESTIC" TASKIEM_VPS_UNSEAL_KEY="$UNSEAL" taskiem-vps restore
          curl -fsk https://localhost/readyz
          # Writing a secret unwraps the tenant key through the restored OpenBao.
          curl -fsk -X PUT -H "Authorization: Bearer $(cat token)" -H 'Content-Type: application/json' -d '{"value":"v"}' https://localhost/v1/secrets/prod/ci_three
      - if: failure()
        run: |
          sudo docker compose --project-directory /opt/taskiem logs --tail 200 || true
          sudo cat /var/lib/taskiem-vps/last-update.log || true

  # The image the Helm chart and the VM deployment pull (decision 0032):
  # pushed to GHCR on every merge to main and every v* tag, signed keylessly
  # with cosign, with an SBOM and build provenance attached. Tags: sha-<12>
  # and the version (immutable), and the channel "staging", which servers on
  # the staging channel follow (taskiem-vps). "production" is moved only by
  # the promote job below.
  image:
    if: github.event_name == 'push'
    needs: [go, typescript, web, docker, licences, vps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - name: Image name and version
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=sha-${{ steps.name.outputs.sha }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.name.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      # cosign-installer v4: v3 cannot install cosign v3 (it fetches a .sig
      # cosign v3 no longer publishes).
      - uses: sigstore/cosign-installer@v4.1.2 # no v4 major tag is published
        with:
          cosign-release: v3.1.3 # the version taskiem-vps verifies with (deploy/vm/install.sh)
      - name: Sign the image
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          cosign sign --yes "$REF"
          { echo "Pushed and signed \`$REF\`"; echo; echo "Tags: $(echo "$TAGS" | tr '\n' ' ')"; } >> "$GITHUB_STEP_SUMMARY"

  # Production servers follow the "production" tag. A version tag (v1.2.0)
  # builds and signs its image above; this job moves "production" to it once
  # someone approves the deployment in the "production" GitHub environment
  # (Settings → Environments → production → required reviewers). Servers then
  # upgrade themselves inside their upgrade window, rolling back on failure.
  promote:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point production at this release
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:production" "$IMAGE@$DIGEST"
          echo "production → \`$IMAGE@$DIGEST\` ($GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

  # Signed builds and SBOM (build plan Phase 0). Runs on main only.
  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, typescript, web, docker, licences]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make build VERSION=${GITHUB_SHA::12}
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: bin/taskiem.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v4.1.2 # no v4 major tag is published
        with:
          cosign-release: v3.1.3 # as the image is signed
      - name: Sign binary and SBOM
        run: |
          for f in bin/taskiem bin/taskiem.spdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: taskiem-${{ github.sha }}
          path: bin/

  # The image builds, the chart lints, and deploy/kubernetes is regenerated from it.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Chart and generated manifests
        run: |
          make chart
          git diff --exit-code deploy/kubernetes
      - name: VM Compose file (decision 0032)
        working-directory: deploy/vm
        run: |
          printf "TASKIEM_DOMAIN='ci.example'\nTASKIEM_IMAGE='taskiem:ci'\n" > .env
          touch taskiem.env migrate.env openbao.env openbao-unseal.env
          docker compose config --quiet
      - name: Image
        run: docker build --build-arg VERSION=ci -t taskiem:ci .
