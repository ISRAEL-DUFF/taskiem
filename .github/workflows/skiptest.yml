# Temporary: which job conditions survive a skipped job two levels down.
name: skiptest
on:
  push:
    branches: [claude/website-0ak3hh]
jobs:
  a:
    if: false
    runs-on: ubuntu-latest
    steps: [{run: "true"}]
  b:
    needs: [a]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps: [{run: "true"}]
  c_notcancelled_contains:
    needs: [b]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    steps: [{run: "true"}]
  c_notcancelled_result:
    needs: [b]
    if: ${{ !cancelled() && needs.b.result == 'success' }}
    runs-on: ubuntu-latest
    steps: [{run: "true"}]
  c_always_result:
    needs: [b]
    if: ${{ always() && needs.b.result == 'success' }}
    runs-on: ubuntu-latest
    steps: [{run: "true"}]
  c_plain:
    needs: [b]
    if: ${{ needs.b.result == 'success' }}
    runs-on: ubuntu-latest
    steps: [{run: "true"}]
