{{- if and .Values.storage.enabled (not .Values.storage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taskiem.storageClaim" . }}
  labels:
    {{- include "taskiem.labels" . | nindent 4 }}
  annotations:
    # Archived runs and audit anchors outlive the release.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.storage.accessModes | nindent 4 }}
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
{{- end }}
