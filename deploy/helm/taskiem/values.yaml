# Taskiem Helm chart. See docs/kubernetes.md for a walk-through.

image:
  repository: ghcr.io/israel-duff/taskiem
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# split: one Deployment per role (production). all: one Deployment running
# every role in one process (small installs; set replicas to 1).
mode: split

# Where people reach the web app, e.g. https://taskiem.example.com.
# Turns on passkeys, single sign-on callbacks and SCIM endpoints.
publicURL: ""

# A Secret you create (kubectl create secret generic ...) whose keys are
# environment variables: TASKIEM_DATABASE_URL is required; also, as you use
# them, TASKIEM_LOCAL_KMS_KEY or TASKIEM_OPENBAO_TOKEN, TASKIEM_ANCHOR_KEY,
# TASKIEM_SMTP_URL, and for the platform WhatsApp number TASKIEM_WHATSAPP_*
# (docs/whatsapp.md). Nothing secret is ever put in values.
existingSecret: taskiem
# For a highly available Postgres (docs/cloud.md#high-availability-postgres),
# put every host in TASKIEM_DATABASE_URL with target_session_attrs=read-write;
# an optional read replica for run lists and dashboards goes in
# TASKIEM_DATABASE_READ_URL (its lag bound, TASKIEM_DATABASE_READ_MAX_LAG, in
# config).

# Non-secret settings, as environment variables (docs/operations.md).
config:
  TASKIEM_KMS: openbao            # local | openbao
  TASKIEM_OPENBAO_ADDR: ""
  TASKIEM_KMS_KEY: taskiem
  TASKIEM_SECURE_COOKIES: "true"
  TASKIEM_TRUST_PROXY: "true"     # behind an ingress controller
  TASKIEM_ALLOW_SIGNUP: "false"
  TASKIEM_ALERT_FROM: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

# Extra environment variables for every pod: [{name, value}] or valueFrom.
extraEnv: []

roles:
  api:
    replicas: 2
    databasePool: 20
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { memory: 512Mi }
  edge:
    replicas: 2
    databasePool: 10
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 256Mi }
  orchestrator:
    replicas: 2
    databasePool: 20
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { memory: 512Mi }
  # Schedules, timers, retention archiving, audit anchoring, alerts. Several
  # replicas are safe (claims use SKIP LOCKED); one is usually enough.
  scheduler:
    replicas: 1
    databasePool: 10
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 256Mi }
  worker:
    replicas: 2
    databasePool: 20
    queues: connector,sandbox
    # Python steps need room: the interpreter's memory cap is 256 MiB per
    # running step, on top of the process.
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { memory: 2Gi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
  # Used when mode is "all".
  all:
    replicas: 1
    databasePool: 30
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { memory: 2Gi }

# Dedicated worker pools (decision 0024, docs/kubernetes.md#dedicated-worker-pools):
# each entry is its own Deployment (and HPA, PDB, metrics Service) with
# TASKIEM_WORKER_POOL set to its name. It claims only the work of tenants
# an operator routes there (taskiem pools assign NAME --tenant ID, or
# --plan PLAN); everyone else stays on roles.worker, the shared pool. Start
# the pool before routing anyone to it. Split mode only. The container
# queue stays in containerSteps.
workerPools: []
#  - name: acme                     # lowercase letters, digits, dashes
#    queues: connector,sandbox      # default
#    replicas: 2
#    databasePool: 10
#    resources:                     # default: roles.worker.resources
#      requests: { cpu: 500m, memory: 512Mi }
#      limits: { memory: 2Gi }
#    nodeSelector: {}               # default: nodeSelector (for example a dedicated node pool)
#    tolerations: []                # default: tolerations
#    autoscaling:
#      enabled: false
#      minReplicas: 2
#      maxReplicas: 6
#      targetCPUUtilizationPercentage: 70

# The scheduler archives runs past retention and appends signed audit
# anchors here. Anchors are only worth their copy outside the database:
# use a write-once class (object lock) where you can.
storage:
  enabled: true
  storageClass: ""
  size: 10Gi
  accessModes: [ReadWriteOnce]
  # Use a claim you created instead.
  existingClaim: ""

migrations:
  # Runs `taskiem migrate` before every install and upgrade.
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: taskiem.example.com
  # Webhooks (/hooks, /git-hooks, /channels) go to the edge role; everything else to the API.
  tls:
    enabled: true
    secretName: taskiem-tls
  # Partners' custom domains for embed apps (docs/embedding.md#custom-domains).
  # Each host gets a rule sending only /embed/ and /v1/embed/ to the API (which
  # serves nothing else on a verified custom domain) and its own TLS secret:
  # with cert-manager, set embedAnnotations to your issuer (for example
  # cert-manager.io/cluster-issuer: letsencrypt) and it issues one certificate
  # per host. A partner points its host at the ingress (CNAME) and verifies it
  # through the partner API; the application never issues certificates.
  embedHosts: []
  #  - host: automations.partner.example
  #    secretName: automations-partner-example-tls   # default: <host with dashes>-tls
  embedAnnotations: {}

podDisruptionBudget:
  enabled: true

# Container steps (spec 7.5, docs/container-steps.md): a separate worker
# pool (the "container" queue) runs each attempt as a Pod in a sandbox
# namespace, under a gVisor RuntimeClass, with no network but this pool's
# egress proxy. Needs a node pool with gVisor (runsc) installed and a
# RuntimeClass for it; tenants also need container_minutes_monthly set on
# their plan (taskiem tenants limits).
containerSteps:
  enabled: false
  # Where sandbox Pods run; nothing else should run there.
  namespace: taskiem-sandbox
  createNamespace: true
  # The RuntimeClass sandbox Pods use. Create it here only if your cluster
  # does not already provide one (GKE Sandbox provides "gvisor").
  runtimeClassName: gvisor
  runtimeClass:
    create: false
    handler: runsc
    # Schedules sandbox Pods onto the gVisor nodes (RuntimeClass scheduling).
    nodeSelector: {}
    tolerations: []
  # Image prefixes steps may use (required), e.g. registry.example.com/steps.
  # Anything else is refused before a Pod is created.
  registries: []
  # Secrets in the sandbox namespace for pulling from a private registry.
  imagePullSecrets: []
  # Extra node selector for sandbox Pods.
  nodeSelector: {}
  # A cap on the sandbox namespace as a whole (ResourceQuota hard limits).
  quota:
    pods: "50"
    limits.cpu: "100"
    limits.memory: 200Gi
  # The egress proxy sandboxes reach for network "egress".
  proxyPort: 3128
  worker:
    replicas: 2
    databasePool: 10
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }

# Restrict traffic: ingress only to the API and edge ports (and metrics from
# the monitoring namespace); egress is left to the egress guard and to your
# own policies, since connectors call many providers.
networkPolicy:
  enabled: false
  monitoringNamespace: monitoring

serviceMonitor:
  # Needs the Prometheus Operator CRDs.
  enabled: false
  interval: 30s

# Taskiem's SLO recording rules and burn-rate alerts (docs/reliability.md),
# generated from engine/slo. Needs the Prometheus Operator CRDs.
prometheusRule:
  enabled: false
  labels: {}
  # Where alerts' runbook links point: your copy of docs/reliability.md.
  runbookBaseURL: ""

# The SLO and error budget dashboard, as a ConfigMap for Grafana's dashboard
# sidecar (which picks up ConfigMaps with these labels).
grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
  namespace: ""   # default: the release namespace

# Graceful shutdown (docs/reliability.md#graceful-shutdown). On SIGTERM a pod
# is not ready at once, keeps serving for delaySeconds while load balancers
# take it out, then stops taking work; workers finish in-flight steps for up
# to workerDrainSeconds and release the rest. gracePeriodSeconds must be at
# least delaySeconds + workerDrainSeconds + 10.
shutdown:
  delaySeconds: 10
  workerDrainSeconds: 30
  gracePeriodSeconds: 60

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
