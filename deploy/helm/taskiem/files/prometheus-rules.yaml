    record: taskiem:slo_errors:ratio_rate1d
  - expr: sum(rate(taskiem_http_requests_total{route!~"/healthz|/readyz|/status|/status.json|/status/feed.atom|/v1/runs/\\{run\\}/stream",code=~"5.."}[3d]))
