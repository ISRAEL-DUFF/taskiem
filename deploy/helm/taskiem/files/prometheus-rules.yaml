# Generated by go generate ./engine/slo from engine/slo/slo.go. Do not edit.
# Taskiem's SLOs (docs/reliability.md, decision 0023): recording rules and
# multi-window, multi-burn-rate alerts. Load into Prometheus as a rule file,
# or enable prometheusRule in the Helm chart.
groups:
- interval: 30s
  name: taskiem-slo-recording
  rules:
  - expr: sum(rate(taskiem_http_requests_total{route!~"/healthz|/readyz|/status|/status.json|/status/feed.atom|/v1/runs/\\{run\\}/stream",code=~"5.."}[5m]))
      / sum(rate(taskiem_http_requests_total{route!~"/healthz|/readyz|/status|/status.json|/status/feed.atom|/v1/runs/\\{run\\}/stream"}[5m]))
    labels:
      slo: api_availability
    record: taskiem:slo_errors:ratio_rate5m
  - expr: sum(rate(taskiem_http_requests_total{route!~"/healthz|/readyz|/status|/status.json|/status/feed.atom|/v1/runs/\\{run\\}/stream",code=~"5.."}[30m]))
