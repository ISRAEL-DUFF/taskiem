        Objective: 99% over 30d. At this rate the whole budget lasts 5 days.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapilatencybudgetburn
      summary: API latency is burning its error budget 6x too fast (6h and 30m windows)
