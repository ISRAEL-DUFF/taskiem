- name: taskiem-slo-alerts
  rules:
  - alert: TaskiemAPIAvailabilityBudgetBurn
    annotations:
      description: 'Share of API requests (every route but probes, the status page
        and run streams) answered without a 5xx. Objective: 99.9% over 30d. At this
        rate the whole budget lasts 2.1 days.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
      summary: API availability is burning its error budget 14.4x too fast (1h and
        5m windows)
    expr: |-
      taskiem:slo_errors:ratio_rate1h{slo="api_availability"} > (14.4 * 0.001)
      and
      taskiem:slo_errors:ratio_rate5m{slo="api_availability"} > (14.4 * 0.001)
    labels:
      severity: page
      slo: api_availability
      window: 1h
  - alert: TaskiemAPIAvailabilityBudgetBurn
    annotations:
      description: 'Share of API requests (every route but probes, the status page
        and run streams) answered without a 5xx. Objective: 99.9% over 30d. At this
        rate the whole budget lasts 5 days.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
      summary: API availability is burning its error budget 6x too fast (6h and 30m
        windows)
    expr: |-
      taskiem:slo_errors:ratio_rate6h{slo="api_availability"} > (6 * 0.001)
      and
      taskiem:slo_errors:ratio_rate30m{slo="api_availability"} > (6 * 0.001)
    labels:
      severity: page
      slo: api_availability
      window: 6h
  - alert: TaskiemAPIAvailabilityBudgetBurn
    annotations:
      description: 'Share of API requests (every route but probes, the status page
        and run streams) answered without a 5xx. Objective: 99.9% over 30d. At this
        rate the whole budget lasts 10 days.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
      summary: API availability is burning its error budget 3x too fast (1d and 2h
        windows)
    expr: |-
      taskiem:slo_errors:ratio_rate1d{slo="api_availability"} > (3 * 0.001)
      and
      taskiem:slo_errors:ratio_rate2h{slo="api_availability"} > (3 * 0.001)
    labels:
      severity: ticket
      slo: api_availability
      window: 1d
  - alert: TaskiemAPIAvailabilityBudgetBurn
    annotations:
      description: 'Share of API requests (every route but probes, the status page
        and run streams) answered without a 5xx. Objective: 99.9% over 30d. At this
        rate the whole budget lasts 30 days.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
      summary: API availability is burning its error budget 1x too fast (3d and 6h
        windows)
    expr: |-
      taskiem:slo_errors:ratio_rate3d{slo="api_availability"} > (1 * 0.001)
      and
      taskiem:slo_errors:ratio_rate6h{slo="api_availability"} > (1 * 0.001)
    labels:
      severity: ticket
      slo: api_availability
      window: 3d
  - alert: TaskiemAPILatencyBudgetBurn
    annotations:
      description: 'Share of API requests (same routes) answered within 1 second.
        Objective: 99% over 30d. At this rate the whole budget lasts 2.1 days.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapilatencybudgetburn
      summary: API latency is burning its error budget 14.4x too fast (1h and 5m windows)
    expr: |-
