- name: taskiem-alerts
  rules:
  - alert: TaskiemCanaryFailing
    annotations:
      description: 'Five or more canary probes failed in 15 minutes and none passed:
        a webhook through the public hooks URL did not become a finished run. Customers''
        runs are probably affected.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemcanaryfailing
      summary: The synthetic canary has not completed a run in 15 minutes
    expr: sum(increase(taskiem_canary_probes_total{result!="ok"}[15m])) >= 5 unless
      sum(increase(taskiem_canary_probes_total{result="ok"}[15m])) > 0
    for: 0m
    labels:
      severity: page
  - alert: TaskiemCanaryStopped
    annotations:
      description: No canary probes ran in 15 minutes although the canary is configured.
        The availability signal it gives (and the status page's automatic check) is
        missing.
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemcanarystopped
      summary: The synthetic canary stopped probing
    expr: sum(increase(taskiem_canary_probes_total[15m])) == 0
    for: 15m
    labels:
      severity: ticket
  - alert: TaskiemSchedulerStalled
    annotations:
      description: Timers, schedules, lease recovery, the orchestrator sweep and admission
        of queued runs have stopped (or no scheduler is running).
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemschedulerstalled
      summary: No scheduler has completed a tick in 2 minutes
    expr: (time() - max(taskiem_scheduler_last_tick_timestamp_seconds{mode="scheduler"})
      > 120) or absent(taskiem_scheduler_last_tick_timestamp_seconds{mode="scheduler"})
    for: 2m
    labels:
      severity: page
  - alert: TaskiemQueueBacklog
    annotations:
      description: 'The oldest ready task in a connector or sandbox queue is over
        10 minutes old: workers are down, stuck or saturated. The dispatch SLO only
        sees steps that are claimed, so this catches a queue nobody serves.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemqueuebacklog
      summary: Steps have waited over 10 minutes in a queue
    expr: max by (queue) (taskiem_queue_oldest_ready_seconds{queue=~"connector|sandbox"})
      > 600
    for: 5m
    labels:
      severity: page
  - alert: TaskiemLeaseExpiries
    annotations:
      description: 'More than 10 task or timer leases were recovered after expiring
        in 15 minutes: processes are dying or being killed before they drain.'
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemleaseexpiries
      summary: Task leases are expiring
    expr: sum(increase(taskiem_lease_expiries_total[15m])) > 10
    for: 15m
    labels:
      severity: ticket
  - alert: TaskiemTargetDown
    annotations:
      description: Prometheus cannot scrape a Taskiem pod. If it serves traffic, the
        API and ingest SLIs miss its requests.
      runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemtargetdown
      summary: A Taskiem pod's metrics cannot be scraped
    expr: up{job=~".*taskiem.*"} == 0
    for: 10m
    labels:
      severity: ticket
