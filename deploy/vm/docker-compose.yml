# Taskiem on one VM (decision 0032): every role in one process, persistent
# OpenBao, Caddy for HTTPS. Postgres is NOT here: use a managed Postgres 16
# (or one on another host) with backups and point-in-time recovery.
#
# Installed and run by taskiem-vps (docs/vm.md): `taskiem-vps setup` writes
# the env files and initialises OpenBao, and `taskiem-vps update` moves
# TASKIEM_IMAGE (a digest) between releases. Do not edit it on a server: the
# next update replaces it with the copy from the release being installed.
#
# Container steps are deliberately off: their only safe runner is Kubernetes.
name: taskiem

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  caddy:
    <<: *hardening
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      TASKIEM_DOMAIN: ${TASKIEM_DOMAIN:?set TASKIEM_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # public.caddy when public pages are on (taskiem-vps setup).
      - ./caddy.d:/etc/caddy/caddy.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      taskiem: { condition: service_healthy }

  # Keys for every secret Taskiem stores. Raft storage on a named volume;
  # unseals itself on start with the static key in openbao-unseal.env
  # (decision 0032, amendment). Not published: only Taskiem talks to it, on
  # the Compose network.
  openbao:
    <<: *hardening
    image: openbao/openbao:${OPENBAO_VERSION:-2.7.1}
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    env_file: [openbao-unseal.env]
    volumes:
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - ./openbao-taskiem-policy.hcl:/openbao/policies/taskiem.hcl:ro
      - openbao_data:/openbao/file
    healthcheck:
      # 200 only when initialised and unsealed.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      retries: 3

  # Renews Taskiem's periodic OpenBao token once a day. Taskiem itself does
  # not renew it, and an expired token makes every secret unreadable.
  openbao-renew:
    <<: *hardening
    image: openbao/openbao:${OPENBAO_VERSION:-2.7.1}
    entrypoint: ["sh", "-c"]
    command:
      - |
        export BAO_TOKEN="$$TASKIEM_OPENBAO_TOKEN"
        while :; do
          if bao token renew >/dev/null; then echo "$$(date -u +%FT%TZ) renewed"; else echo "$$(date -u +%FT%TZ) RENEWAL FAILED" >&2; fi
          sleep 86400
        done
    environment:
      BAO_ADDR: http://openbao:8200
    # Only the token: never the database or other secrets.
    env_file: [openbao.env]
    depends_on:
      openbao: { condition: service_healthy }

  # Forward-only migrations as the schema owner, before Taskiem starts.
  migrate:
    image: ${TASKIEM_IMAGE:?set TASKIEM_IMAGE in .env}
    command: ["migrate"]
    env_file: [migrate.env]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    read_only: true

  taskiem:
    <<: *hardening
    image: ${TASKIEM_IMAGE:?set TASKIEM_IMAGE in .env}
    command: ["serve", "--role", "all"]
    env_file: [taskiem.env, openbao.env]
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp, /cache]
    volumes:
      # Archived runs and audit anchors (TASKIEM_ARCHIVE_DIR, TASKIEM_ANCHOR_DIR).
      - taskiem_data:/var/lib/taskiem
    ports:
      # Metrics for a Prometheus on this host only; never public.
      - "127.0.0.1:9090:9090"
    # Workers drain for up to TASKIEM_WORKER_DRAIN (30 s) on shutdown.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "/taskiem", "healthcheck"]
      interval: 10s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }
      openbao: { condition: service_healthy }

  # The public host for storefronts and hosted forms (docs/public-host.md),
  # started only with the "public" profile (COMPOSE_PROFILES in .env, set
  # by taskiem-vps setup). It gets its own database login, a member of
  # taskiem_public only, and nothing else: no OpenBao token, no platform
  # secret.
  taskiem-public:
    <<: *hardening
    profiles: [public]
    image: ${TASKIEM_IMAGE:?set TASKIEM_IMAGE in .env}
    command: ["serve", "--role", "public"]
    env_file: [public.env]
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:9091:9090"
    healthcheck:
      test: ["CMD", "/taskiem", "healthcheck", "127.0.0.1:9090"]
      interval: 10s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  caddy_data: {}
  caddy_config: {}
  openbao_data: {}
  taskiem_data: {}
