apiVersion: batch/v1
kind: Job
metadata:
  name: taskiem-migrate
  labels:
    helm.sh/chart: taskiem-0.1.0
    app.kubernetes.io/name: taskiem
    app.kubernetes.io/instance: taskiem
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migrate
  annotations:
    # Before the new pods start: the schema only ever moves forward, and
    # every release reads the schema of the one before it.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskiem
        app.kubernetes.io/instance: taskiem
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/israel-duff/taskiem:0.1.0
          imagePullPolicy: IfNotPresent
          args: [migrate]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The Secret is read directly: a pre-install hook runs before the
          # chart's ConfigMap exists.
          env:
            - name: TASKIEM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskiem
                  key: TASKIEM_DATABASE_URL
          resources:
            limits:
