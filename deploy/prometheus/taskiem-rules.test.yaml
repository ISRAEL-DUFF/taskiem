evaluation_interval: 1m
rule_files:
- taskiem-rules.yaml
tests:
- alert_rule_test:
  - alertname: TaskiemAPIAvailabilityBudgetBurn
    eval_time: 70m
    exp_alerts:
    - exp_annotations:
        description: 'Share of API requests (every route but probes, the status page
          and run streams) answered without a 5xx. Objective: 99.9% over 30d. At this
          rate the whole budget lasts 2.1 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
        summary: API availability is burning its error budget 14.4x too fast (1h and
          5m windows)
      exp_labels:
        severity: page
        slo: api_availability
        window: 1h
    - exp_annotations:
        description: 'Share of API requests (every route but probes, the status page
          and run streams) answered without a 5xx. Objective: 99.9% over 30d. At this
          rate the whole budget lasts 5 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
        summary: API availability is burning its error budget 6x too fast (6h and
          30m windows)
      exp_labels:
        severity: page
        slo: api_availability
        window: 6h
    - exp_annotations:
        description: 'Share of API requests (every route but probes, the status page
          and run streams) answered without a 5xx. Objective: 99.9% over 30d. At this
          rate the whole budget lasts 10 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
        summary: API availability is burning its error budget 3x too fast (1d and
          2h windows)
      exp_labels:
        severity: ticket
        slo: api_availability
        window: 1d
    - exp_annotations:
        description: 'Share of API requests (every route but probes, the status page
          and run streams) answered without a 5xx. Objective: 99.9% over 30d. At this
          rate the whole budget lasts 30 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
        summary: API availability is burning its error budget 1x too fast (3d and
          6h windows)
      exp_labels:
        severity: ticket
        slo: api_availability
        window: 3d
  input_series:
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="200"}
    values: 0+98x80
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="500"}
    values: 0+2x80
  - series: taskiem_http_requests_total{route="/readyz",method="GET",code="503"}
    values: 0+1000x80
  interval: 1m
  name: '2% of API requests fail for an hour: every burn-rate window fires'
- alert_rule_test:
  - alertname: TaskiemAPIAvailabilityBudgetBurn
    eval_time: 70m
    exp_alerts: []
  input_series:
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="200"}
    values: 0+100x80
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="500"}
    values: 0+0x80
  - series: taskiem_http_requests_total{route="/readyz",method="GET",code="503"}
    values: 0+1000x80
  interval: 1m
  name: a healthy API and a draining pod's readiness failures do not alert
- alert_rule_test:
  - alertname: TaskiemStepDispatchBudgetBurn
    eval_time: 70m
    exp_alerts:
    - exp_annotations:
        description: 'Share of steps, on every queue and in every worker pool, claimed
          within 50 ms of becoming ready (spec 15.3: p95 under 50 ms). Objective:
          95% over 30d. At this rate the whole budget lasts 2.1 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemstepdispatchbudgetburn
        summary: Step dispatch latency is burning its error budget 14.4x too fast
          (1h and 5m windows)
      exp_labels:
        severity: page
        slo: step_dispatch
        window: 1h
    - exp_annotations:
        description: 'Share of steps, on every queue and in every worker pool, claimed
          within 50 ms of becoming ready (spec 15.3: p95 under 50 ms). Objective:
          95% over 30d. At this rate the whole budget lasts 5 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemstepdispatchbudgetburn
        summary: Step dispatch latency is burning its error budget 6x too fast (6h
          and 30m windows)
      exp_labels:
        severity: page
        slo: step_dispatch
        window: 6h
    - exp_annotations:
        description: 'Share of steps, on every queue and in every worker pool, claimed
          within 50 ms of becoming ready (spec 15.3: p95 under 50 ms). Objective:
          95% over 30d. At this rate the whole budget lasts 10 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemstepdispatchbudgetburn
        summary: Step dispatch latency is burning its error budget 3x too fast (1d
          and 2h windows)
      exp_labels:
        severity: ticket
        slo: step_dispatch
        window: 1d
    - exp_annotations:
        description: 'Share of steps, on every queue and in every worker pool, claimed
          within 50 ms of becoming ready (spec 15.3: p95 under 50 ms). Objective:
          95% over 30d. At this rate the whole budget lasts 30 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemstepdispatchbudgetburn
        summary: Step dispatch latency is burning its error budget 1x too fast (3d
          and 6h windows)
      exp_labels:
        severity: ticket
        slo: step_dispatch
        window: 3d
  input_series:
  - series: taskiem_step_dispatch_delay_seconds_bucket{queue="container",le="0.05"}
    values: 0+20x80
  - series: taskiem_step_dispatch_delay_seconds_count{queue="container"}
    values: 0+100x80
  interval: 1m
  name: slow step dispatch on any queue burns the dispatch budget
- input_series:
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="200"}
    values: 0+100x60 6000x60
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="500"}
    values: "0x120"
  interval: 1m
  name: a quiet hour leaves the 30-day budget readable
  promql_expr_test:
  - eval_time: 120m
    exp_samples:
    - labels: taskiem:slo_error_budget_remaining:ratio{slo="api_availability"}
      value: 1
    expr: taskiem:slo_error_budget_remaining:ratio{slo="api_availability"}
- alert_rule_test:
  - alertname: TaskiemSchedulerStalled
    eval_time: 5m
    exp_alerts: []
  - alertname: TaskiemSchedulerStalled
    eval_time: 12m
    exp_alerts:
    - exp_annotations:
        description: Timers, schedules, lease recovery, the orchestrator sweep and
          admission of queued runs have stopped (or no scheduler is running).
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemschedulerstalled
        summary: No scheduler has completed a tick in 2 minutes
      exp_labels:
        severity: page
  input_series:
  - series: taskiem_scheduler_last_tick_timestamp_seconds{mode="scheduler"}
    values: 0+60x5 300x10
  interval: 1m
  name: the scheduler stops ticking
- alert_rule_test:
  - alertname: TaskiemCanaryFailing
    eval_time: 10m
    exp_alerts: []
  - alertname: TaskiemCanaryFailing
    eval_time: 28m
    exp_alerts:
    - exp_annotations:
        description: 'Five or more canary probes failed in 15 minutes and none passed:
          a webhook through the public hooks URL did not become a finished run. Customers''
          runs are probably affected.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemcanaryfailing
        summary: The synthetic canary has not completed a run in 15 minutes
      exp_labels:
        severity: page
  input_series:
  - series: taskiem_canary_probes_total{result="ok"}
    values: 0+1x10 10x20
  - series: taskiem_canary_probes_total{result="complete"}
    values: 0x10 0+1x20
  interval: 1m
  name: the canary keeps failing
- alert_rule_test:
  - alertname: TaskiemQueueBacklog
    eval_time: 18m
    exp_alerts:
    - exp_annotations:
        description: 'The oldest ready task in a queue of a worker pool is over 10
          minutes old: that pool''s workers for the queue are down, stuck, saturated
          or were never started. The dispatch SLO only sees steps that are claimed,
          so this catches a queue or pool nobody serves.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemqueuebacklog
        summary: Steps have waited over 10 minutes in a queue
      exp_labels:
        pool: acme
        queue: ai
        severity: page
    - exp_annotations:
        description: 'The oldest ready task in a queue of a worker pool is over 10
          minutes old: that pool''s workers for the queue are down, stuck, saturated
          or were never started. The dispatch SLO only sees steps that are claimed,
          so this catches a queue or pool nobody serves.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemqueuebacklog
        summary: Steps have waited over 10 minutes in a queue
      exp_labels:
        pool: shared
        queue: container
        severity: page
    - exp_annotations:
        description: 'The oldest ready task in a queue of a worker pool is over 10
          minutes old: that pool''s workers for the queue are down, stuck, saturated
          or were never started. The dispatch SLO only sees steps that are claimed,
          so this catches a queue or pool nobody serves.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemqueuebacklog
        summary: Steps have waited over 10 minutes in a queue
      exp_labels:
        pool: shared
        queue: sandbox
        severity: page
  input_series:
  - series: taskiem_pool_oldest_ready_seconds{pool="shared",queue="sandbox"}
    values: 0+60x20
  - series: taskiem_pool_oldest_ready_seconds{pool="shared",queue="container"}
    values: 0+60x20
  - series: taskiem_pool_oldest_ready_seconds{pool="acme",queue="ai"}
    values: 0+60x20
  - series: taskiem_pool_oldest_ready_seconds{pool="acme",queue="connector"}
    values: 0+0x20
  interval: 1m
  name: a queue nobody serves, in any pool
- alert_rule_test:
  - alertname: TaskiemRetentionPurgeBehind
    eval_time: 20m
    exp_alerts: []
  - alertname: TaskiemRetentionPurgeBehind
    eval_time: 50m
    exp_alerts:
    - exp_annotations:
        description: 'The oldest run past its retention date has not been archived
          and deleted for over 6 hours (a healthy purge takes minutes): the archive
          is refusing writes, a run keeps failing to purge, or purging cannot keep
          up. Personal data is kept past its retention, and run_events grows.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemretentionpurgebehind
        summary: Runs past retention have waited over 6 hours to be purged
      exp_labels:
        severity: ticket
  input_series:
  - series: taskiem_retention_purge_oldest_overdue_seconds{instance="a"}
    values: 21000+60x60
  - series: taskiem_retention_purge_oldest_overdue_seconds{instance="b"}
    values: "0x60"
  interval: 1m
  name: the retention purge falls behind on one scheduler
