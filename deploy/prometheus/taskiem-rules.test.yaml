  - alertname: TaskiemSchedulerStalled
    eval_time: 12m
    exp_alerts:
    - exp_annotations:
        description: Timers, schedules, lease recovery, the orchestrator sweep and
          admission of queued runs have stopped (or no scheduler is running).
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemschedulerstalled
        summary: No scheduler has completed a tick in 2 minutes
      exp_labels:
        severity: page
