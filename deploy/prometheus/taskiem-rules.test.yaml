          rate the whole budget lasts 10 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemapiavailabilitybudgetburn
        summary: API availability is burning its error budget 3x too fast (1d and
          2h windows)
      exp_labels:
        severity: ticket
        slo: api_availability
        window: 1d
    - exp_annotations:
        description: 'Share of API requests (every route but probes, the status page
