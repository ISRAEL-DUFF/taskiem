- alert_rule_test:
  - alertname: TaskiemAPIAvailabilityBudgetBurn
    eval_time: 70m
    exp_alerts: []
  input_series:
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="200"}
    values: 0+100x80
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="500"}
    values: 0+0x80
  - series: taskiem_http_requests_total{route="/readyz",method="GET",code="503"}
    values: 0+1000x80
  interval: 1m
  name: a healthy API and a draining pod's readiness failures do not alert
- alert_rule_test:
