  input_series:
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="200"}
    values: 0+98x80
  - series: taskiem_http_requests_total{route="/v1/workflows",method="GET",code="500"}
    values: 0+2x80
  - series: taskiem_http_requests_total{route="/readyz",method="GET",code="503"}
    values: 0+1000x80
