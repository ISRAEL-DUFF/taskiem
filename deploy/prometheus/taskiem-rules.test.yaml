          and 30m windows)
      exp_labels:
        severity: page
        slo: step_dispatch
        window: 6h
    - exp_annotations:
        description: 'Share of connector and sandbox steps claimed within 50 ms of
          becoming ready (spec 15.3: p95 under 50 ms). Objective: 95% over 30d. At
          this rate the whole budget lasts 10 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemstepdispatchbudgetburn
        summary: Step dispatch latency is burning its error budget 3x too fast (1d
          and 2h windows)
      exp_labels:
        severity: ticket
        slo: step_dispatch
        window: 1d
    - exp_annotations:
        description: 'Share of connector and sandbox steps claimed within 50 ms of
          becoming ready (spec 15.3: p95 under 50 ms). Objective: 95% over 30d. At
          this rate the whole budget lasts 30 days.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemstepdispatchbudgetburn
        summary: Step dispatch latency is burning its error budget 1x too fast (3d
          and 6h windows)
      exp_labels:
        severity: ticket
        slo: step_dispatch
        window: 3d
  input_series:
  - series: taskiem_step_dispatch_delay_seconds_bucket{queue="connector",le="0.05"}
    values: 0+20x80
  - series: taskiem_step_dispatch_delay_seconds_count{queue="connector"}
    values: 0+100x80
  interval: 1m
  name: slow step dispatch burns the dispatch budget
- alert_rule_test:
  - alertname: TaskiemSchedulerStalled
    eval_time: 5m
    exp_alerts: []
  - alertname: TaskiemSchedulerStalled
    eval_time: 12m
    exp_alerts:
    - exp_annotations:
        description: Timers, schedules, lease recovery, the orchestrator sweep and
          admission of queued runs have stopped (or no scheduler is running).
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemschedulerstalled
        summary: No scheduler has completed a tick in 2 minutes
      exp_labels:
        severity: page
  input_series:
  - series: taskiem_scheduler_last_tick_timestamp_seconds{mode="scheduler"}
    values: 0+60x5 300x10
  interval: 1m
  name: the scheduler stops ticking
- alert_rule_test:
  - alertname: TaskiemCanaryFailing
    eval_time: 10m
    exp_alerts: []
  - alertname: TaskiemCanaryFailing
    eval_time: 28m
    exp_alerts:
    - exp_annotations:
        description: 'Five or more canary probes failed in 15 minutes and none passed:
          a webhook through the public hooks URL did not become a finished run. Customers''
          runs are probably affected.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemcanaryfailing
        summary: The synthetic canary has not completed a run in 15 minutes
      exp_labels:
        severity: page
  input_series:
  - series: taskiem_canary_probes_total{result="ok"}
    values: 0+1x10 10x20
  - series: taskiem_canary_probes_total{result="complete"}
    values: 0x10 0+1x20
  interval: 1m
  name: the canary keeps failing
- alert_rule_test:
  - alertname: TaskiemQueueBacklog
    eval_time: 18m
    exp_alerts:
    - exp_annotations:
        description: 'The oldest ready task in a connector or sandbox queue is over
          10 minutes old: workers are down, stuck or saturated. The dispatch SLO only
          sees steps that are claimed, so this catches a queue nobody serves.'
        runbook_url: https://github.com/israel-duff/taskiem/blob/main/docs/reliability.md#runbook-taskiemqueuebacklog
        summary: Steps have waited over 10 minutes in a queue
      exp_labels:
        queue: sandbox
        severity: page
  input_series:
  - series: taskiem_queue_oldest_ready_seconds{queue="sandbox"}
    values: 0+60x20
  - series: taskiem_queue_oldest_ready_seconds{queue="container"}
    values: 0+60x20
  interval: 1m
  name: a queue nobody serves
