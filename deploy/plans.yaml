# Taskiem plan catalogue and billing terms (spec 16; docs/billing.md).
#
#   taskiem billing plans --file deploy/plans.yaml          # validate
#   taskiem billing plans --file deploy/plans.yaml --load   # write to the database
#
# Prices (decision B1, 21 October 2026): the three public tiers are the
# website's, Starter Trader, Growing Business and Enterprise & Regulated
# (docs/strategy/website.md). The storefront plans and Business stay
# active for tenants already on them but are not offered self-serve.
#
# Amounts are kobo (1 naira = 100 kobo). Limits use the keys of
# `taskiem tenants limits` (0: no limit; a key left out takes the platform
# default, TASKIEM_DEFAULT_*). Operator overrides (taskiem tenants limits
# --set) still apply on top of a tenant's plan.
placeholder_prices: false
currency: NGN
vat_percent: 7.5          # Nigerian VAT, shown separately on invoices (finance to confirm, B1)
invoice_prefix: TKM       # invoice numbers: TKM-2026-000001, no gaps per year
trial_days: 14
trial_plan: growth
grace_days: 7             # past due this long, then degraded: new runs refused
dunning_days: [0, 3, 5]   # card retries and reminders, days after falling past due
due_days: 7
# Meta's charge per WhatsApp template beyond a plan's allowance, passed
# through at cost (placeholders: set from Meta's current Nigeria rate card).
whatsapp_template_kobo:
  marketing: 8000
  utility: 1100
  authentication: 1100

plans:
  # The storefront plans (storefronts spec 11): below Starter, for one
  # trader or service. Their prices are placeholders like the rest (B1);
  # the domain from the domain platform joins them with S6.
  - id: shop
    name: Shop
    tier: shop
    sort: 1
    public: false
    active: true
    monthly_kobo: 500000       
    annual_kobo: 5000000       
    limits:
      max_running_runs: 2
      worker_concurrency: 2
      ingest_rate: 2
      ingest_burst: 10
      ingest_ceiling: 5
      ingest_ceiling_burst: 25
      max_queued_runs: 200
      max_workflows: 10
      max_steps_per_run: 2000
      max_retention_days: 7
      ai_monthly_tokens: 0
      whatsapp_templates_monthly: 300
      container_minutes_monthly: 0
      max_data_tables: 3
      storefront_items: 50
      storefront_orders_monthly: 300
      storefront_bookings_monthly: 300
      sms_monthly: 100
      embed_sites: 1
    features: {}

  - id: shop_plus
    name: Shop Plus
    tier: shop
    sort: 2
    public: false
    active: true
    monthly_kobo: 1000000      
    annual_kobo: 10000000      
    limits:
      max_running_runs: 3
      worker_concurrency: 3
      ingest_rate: 3
      ingest_burst: 15
      ingest_ceiling: 10
      ingest_ceiling_burst: 50
      max_queued_runs: 500
      max_workflows: 15
      max_steps_per_run: 5000
      max_retention_days: 7
      ai_monthly_tokens: 0
      whatsapp_templates_monthly: 500
      container_minutes_monthly: 0
      max_data_tables: 5
      storefront_items: 500
      storefront_orders_monthly: 1500
      storefront_bookings_monthly: 1500
      sms_monthly: 500
      embed_sites: 3
    features: {storefront_pay_on_order: true}
  - id: starter
    name: Starter Trader
    tier: starter
    sort: 3
    public: true
    active: true
    monthly_kobo: 1500000       # ₦15,000 a month
    annual_kobo: 15000000      # ₦150,000 a year
    limits:
      max_running_runs: 5
      worker_concurrency: 5
      ingest_rate: 5
      ingest_burst: 25
      ingest_ceiling: 20
      ingest_ceiling_burst: 100
      max_queued_runs: 1000
      max_workflows: 10
      max_steps_per_run: 10000
      max_retention_days: 7
      ai_monthly_tokens: 500000
      whatsapp_templates_monthly: 500
      container_minutes_monthly: 0   # PLACEHOLDER (CS3): 0 = container steps off
      max_data_tables: 10
      storefront_items: 2000
      sms_monthly: 1000
    features: {storefront_pay_on_order: true, ai: true}

  - id: growth
    name: Growing Business
    tier: growth
    sort: 4
    public: true
    active: true
    monthly_kobo: 4500000       # ₦45,000 a month
    annual_kobo: 45000000      # ₦450,000 a year
    limits:
      max_running_runs: 25
      worker_concurrency: 25
      ingest_rate: 25
      ingest_burst: 125
      ingest_ceiling: 75
      ingest_ceiling_burst: 300
      max_queued_runs: 5000
      max_workflows: 0
      max_steps_per_run: 50000
      max_retention_days: 30
      ai_monthly_tokens: 2000000
      whatsapp_templates_monthly: 2000
      container_minutes_monthly: 0   # PLACEHOLDER (CS3): 0 = container steps off
      max_data_tables: 50
      storefront_items: 2000
      sms_monthly: 1000
    features: {storefront_pay_on_order: true, ai: true, git: true}

  - id: business
    name: Business
    tier: business
    sort: 5
    public: false
    active: true
    monthly_kobo: 25000000     
    annual_kobo: 250000000     
    limits:
      max_running_runs: 100
      worker_concurrency: 100
      ingest_rate: 100
      ingest_burst: 500
      ingest_ceiling: 250
      ingest_ceiling_burst: 1000
      max_queued_runs: 20000
      max_workflows: 0
      max_steps_per_run: 100000
      max_retention_days: 90
      ai_monthly_tokens: 10000000
      whatsapp_templates_monthly: 10000
      container_minutes_monthly: 600   # PLACEHOLDER (CS3): 0 = container steps off
      max_data_tables: 0
      storefront_items: 2000
      sms_monthly: 1000
    features: {storefront_pay_on_order: true, ai: true, git: true, sso: true, embedded: true}
    partner:
      max_subtenants: 50
      subtenant_runs_per_month: 200000

  - id: enterprise
    name: Enterprise & Regulated
    tier: enterprise
    sort: 6
    public: true              # sales-led: operators grant it (taskiem billing grant)
    active: true
    monthly_kobo: 18000000       # ₦180,000 a month
    annual_kobo: 180000000      # ₦1,800,000 a year
    limits:
      max_running_runs: 0
      worker_concurrency: 0
      max_queued_runs: 100000
      max_workflows: 0
      max_retention_days: 2555   # up to 7 years (spec 16.1)
      ai_monthly_tokens: 50000000
      whatsapp_templates_monthly: 100000
      container_minutes_monthly: 3000   # PLACEHOLDER (CS3): 0 = container steps off
    features: {storefront_pay_on_order: true, ai: true, git: true, sso: true, scim: true, custom_roles: true, white_label: true, byok: true, embedded: true}
    partner:
      max_subtenants: 0
    overage:
      ai_kobo_per_million_tokens: 1500000
